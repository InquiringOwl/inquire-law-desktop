# Runs on every push to main and every pull request (and before each release, see release.yml).
# 1. build-web.js  - every source file must parse
# 2. validate.js   - trees, field map, topic dossiers, HTML markup, lab coverage
# 4. labtest.js    - logic tests for lab rules (tests/*.test.js; English: checks/labs/<id>.test.js), no browser
# 5. smoke.js      - headless Chromium opens every screen at desktop and phone width; any JS error fails
name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node tools/build-web.js
      - run: node tools/validate.js
      - run: node tools/labtest.js
      - name: Install Playwright only (skips downloading Electron)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.56.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - run: node tools/smoke.js
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
      - run: node tools/interact.js
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
