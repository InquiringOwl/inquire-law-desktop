/* ---------- workspace ---------- */
function renderWork(){
  const w = h("div", { class: "work", "data-accent": SM[S.subject].accent || "" });
  const nav = h("aside", { class: "nav", "aria-label": SM[S.subject].name + " navigator" });
  const main = h("section", { class: "main" });
  // ◀/▶ tab on the sidebar's right edge: fold the sidebar away so the map, tree or lesson gets the full width (desktop)
  const fold = h("button", { type: "button", class: "nav-fold", "aria-controls": "navside" });
  nav.id = "navside";
  const setFold = (on, save) => {
    w.classList.toggle("navfold", on);
    nav.inert = on && matchMedia("(min-width:761px)").matches;
    fold.innerHTML = `<span aria-hidden="true">${on ? "▶" : "◀"}</span>`;
    fold.setAttribute("aria-expanded", String(!on));
    fold.title = fold.ariaLabel = on ? "Show the sidebar" : "Hide the sidebar (wider view)";
    fold.setAttribute("aria-label", fold.title);
    if (save) store.set("navfold", on);
  };
  fold.onclick = () => setFold(!w.classList.contains("navfold"), true);
  setFold(!!store.get("navfold", false), false);
  w.append(nav, main, fold); viewEl.appendChild(w);
  buildNav(nav, w);
  if (S.gword && GWORDS[S.gword]) renderWordPane(main);
  else if (S.topic) renderTopic(main);
  else if (S.field === "map") renderFieldMap(main);
  else if (charted(S.field)) renderFieldTree(main, S.field);
  else renderDossier(main);
}

function buildNav(nav, w){
  const gn = Object.keys(GWORDS).filter(k => GWORDS[k].some(e => e.subject === S.subject));
  const glMode = S.navMode === "glossary";
  // glossary scope: this subject's words (default) or every subject's
  const scope = () => (S.glScope === "all" || !gn.length) ? "all" : S.subject;
  // field sub-filter (Arithmetic, Pre-Algebra, …) inside this subject's words
  if (S.glField && subjOf(S.glField) !== S.subject) S.glField = null;
  const glFields = subjFields(S.subject).map(f => [f, GL.filter(e => e.subject === S.subject && e.field === f).length]).filter(x => x[1]);
  const fieldOn = () => scope() !== "all" && S.glField && glFields.some(x => x[0] === S.glField) ? S.glField : null;
  nav.innerHTML = `<div class="nav-top">
      <div class="nav-title"><span class="glyph">${SM[S.subject].glyph}</span><div><h2>${esc(SM[S.subject].name)}</h2><small>${subjFields(S.subject).length} fields · ${subjTrees(S.subject).length} charted</small></div></div>
      <label class="search"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#8B97AE" stroke-width="1.4"/><path d="M9.5 9.5 13 13" stroke="#8B97AE" stroke-width="1.4"/></svg>
      <input id="navq" type="text" placeholder="${glMode ? "Search words and definitions" : "Search fields and topics"}" aria-label="${glMode ? "Search the glossary" : "Search fields and topics"}"></label>
    </div><div class="nav-list" id="navlist"></div>
    <div class="nav-foot">${glMode ? "Pick a word to read it here. The full glossary has field, letter and mastered filters." : "Gold nodes are ready to study. Green nodes are mastered. Mark a topic mastered from its page."}</div>`;
  $(".nav-title", nav).appendChild(starBtn("s:" + S.subject));
  const list = $("#navlist", nav);
  const q = $("#navq", nav);
  const fromHere = () => ({ label: SM[S.subject].name + (S.topic && T[S.topic] ? " · " + T[S.topic].title : S.field !== "map" && DB.fields[S.field] ? " · " + DB.fields[S.field].name : ""), subject: S.subject, state: { view: "math", subject: S.subject, field: S.field, topic: S.topic } });
  const setMode = m => { S.navMode = m; buildNav(nav, w); };
  function tabs(){
    // Field map and Glossary switch what the sidebar lists
    list.appendChild(h("button", { type: "button", class: "item" + (!glMode && S.field === "map" && !S.topic && !S.gword ? " sel" : ""), onclick: () => {
        if (glMode) { setMode("fields"); if (S.gword) go({ view: "math" }); return; }
        w.classList.remove("navopen"); go({ view: "math", subject: S.subject, field: "map", topic: null }); } },
      `<span class="ic">⌗</span><span style="min-width:0"><span class="nm">Field map</span><span class="lv">${glMode ? "Back to fields and topics" : esc(SM[S.subject].mapLine)}</span></span><span class="st"></span>`));
    list.appendChild(h("button", { type: "button", class: "item gl-nav" + (glMode ? " sel" : ""), "aria-pressed": String(glMode), onclick: () => { if (!glMode) setMode("glossary"); } },
      `<span class="ic">Aa</span><span style="min-width:0"><span class="nm">Glossary</span><span class="lv">${gn.length ? `${gn.length} ${esc(SM[S.subject].name)} word${gn.length === 1 ? "" : "s"}` : "Words from every subject"}</span></span><span class="st"></span>`));
  }
  function buildWords(){
    const term = q.value.trim().toLowerCase();
    list.innerHTML = "";
    if (!term) tabs();
    const sc = scope();
    const tools = h("div", { class: "nav-gl-tools" });
    const all = Object.keys(GWORDS).length;
    tools.innerHTML = (gn.length ? [[S.subject, SM[S.subject].name, gGlyph(S.subject), gColour(S.subject), gn.length], ["all", "All subjects", "◎", "var(--line-2)", all]]

      .filter(x => x.score > 0).sort((a, b) => term ? b.score - a.score || a.k.localeCompare(b.k) : a.k.localeCompare(b.k));
    if (!vis.length) { list.appendChild(h("div", { class: "gl-empty" }, term ? "No words match." + (fo ? " Try All fields." : "") : "No words yet.")); return; }

      const subs = [...new Set(blocks.map(e => e.subject))];

        `<span class="ic" style="--gc:${gColour(subs[0])}">${gGlyph(subs[0])}</span><span class="nm">${esc(GWORDS[k][0].w)}</span><span class="st">${subs.length > 1 ? subs.slice(1).map(x => `<i style="--gc:${gColour(x)}" title="${esc(gName(x))}">${gGlyph(x)}</i>`).join("") : ""}</span>`));
    });
    const sel = list.querySelector(".item.sel.nav-gw");
    if (sel && !term) requestAnimationFrame(() => { const r = sel.getBoundingClientRect(), lr = list.getBoundingClientRect(); if (r.top < lr.top || r.bottom > lr.bottom) sel.scrollIntoView({ block: "center" }); });
  }
  function build(){

    if (term) {
      const hits = gn.filter(k => k.includes(term) || GWORDS[k].some(e => e.subject === S.subject && (e.forms || []).some(f => f.toLowerCase().includes(term)))).slice(0, 6);
      if (hits.length) {

        grp.appendChild(h("div", { class: "grp-h" }, `<span class="car"></span>Glossary<span class="n">${hits.length}</span>`));

          `<span class="ic">Aa</span><span class="nm">${esc(GWORDS[k][0].w)}</span><span class="st"></span>`)));
        grp.appendChild(body); list.appendChild(grp);
      }
    }
    SM[S.subject].groups.forEach(g => {
      const ids = g.ids.filter(id => {
        if (!term) return true;
        const f = DB.fields[id];
        if (f.name.toLowerCase().includes(term)) return true;
        if (charted(id)) return fieldNodes(id).some(n => (T[n.id]?.title || "").toLowerCase().includes(term));
        return f.topics.some(t => t.toLowerCase().includes(term));
      });
      if (!ids.length) return;
      const open = term || S.openGroups.includes(g.name) || ids.includes(S.field);
      const grp = h("div", { class: "grp" + (open ? " open" : "") });
      const head = h("button", { type: "button", class: "grp-h", "aria-expanded": String(!!open) }, `<span class="car"></span>${esc(g.name)}<span class="n">${ids.length}</span>`);
      head.onclick = () => {
        const on = !grp.classList.contains("open"); grp.classList.toggle("open", on); head.setAttribute("aria-expanded", String(on));
        S.openGroups = on ? [...new Set([...S.openGroups, g.name])] : S.openGroups.filter(x => x !== g.name); store.set("groups", S.openGroups);
      };
      const body = h("div", { class: "grp-b" });
      ids.forEach(id => {
        const f = DB.fields[id];
        const isCh = charted(id);
        const it = h("button", { type: "button", class: "item" + (isCh ? " charted" : "") + (S.field === id && !S.topic ? " sel" : ""), onclick: () => { w.classList.remove("navopen"); go({ view: "math", field: id, topic: null }); } },
          `<span class="ic">${f.icon}</span><span style="min-width:0"><span class="nm">${esc(f.name)}</span><span class="lv">${esc(f.level)}</span></span><span class="st">${isCh ? (fieldNodes(id).length ? doneIn(id) + "/" + fieldNodes(id).length : "Mapped") : "Planned"}</span>`);
        body.appendChild(it);
        if (isCh && (S.field === id || term)) {
          ORDERS[id].map(x => NODE[x]).forEach(n => {
            const t = T[n.id]; if (!t) return;
            if (term && !t.title.toLowerCase().includes(term)) return;
            const st = stateOf(n.id);
            const sub = h("button", { type: "button", class: "item sub" + (st === "mastered" ? " mastered" : "") + (S.topic === n.id ? " sel" : ""), onclick: () => { w.classList.remove("navopen"); go({ view: "math", field: id, topic: n.id }); } },
              `<span class="ic"${[...n.icon].length > 3 ? ' style="font-size:8px;letter-spacing:-.03em"' : [...n.icon].length > 2 ? ' style="font-size:9.5px"' : ""}>${n.icon}</span><span class="nm">${esc(t.title)}</span><span class="st">${st === "mastered" ? "✓" : ""}</span>`);
            body.appendChild(sub);
          });
        }
      });
      grp.append(head, body); list.appendChild(grp);
    });
    const sel = list.querySelector(".item.sel");
    if (sel && !term) requestAnimationFrame(() => { const r = sel.getBoundingClientRect(), lr = list.getBoundingClientRect(); if (r.top < lr.top || r.bottom > lr.bottom) sel.scrollIntoView({ block: "center" }); });
  }
  q.addEventListener("input", glMode ? buildWords : build);
  (glMode ? buildWords : build)();
}

/* ---------- generic pannable tree (Civ-style) ---------- */
const COLW = 364, ROWH = 92, PADX = 40, PADY = 58, NW = 312, NH = 70;
function buildTree(main, cfg){
  const { nodes, eras, key, stateFn, title, onOpen, infoFn } = cfg;
  const maxCol = Math.max(...nodes.map(n => n.col)), maxRow = Math.max(...nodes.map(n => n.row));
  const W = PADX * 2 + (maxCol + 1) * COLW - (COLW - NW), H = PADY + (maxRow + 1) * ROWH + 10;
  const vp = h("div", { class: "tree-vp", role: "region", "aria-label": title + " skill tree. Drag or scroll to pan." });
  const cv = h("div", { class: "tree-canvas" });
  cv.style.width = W + "px"; cv.style.height = H + "px";
  // eras
  const erasEl = h("div", { class: "eras" }); erasEl.style.width = W + "px";
  eras.forEach((e, i) => {
    const x0 = i === 0 ? 0 : PADX + e.from * COLW - (COLW - NW) / 2;
    const x1 = i === eras.length - 1 ? W : PADX + (e.to + 1) * COLW - (COLW - NW) / 2;
    const el = h("div", { class: "era" }, esc(e.name)); el.style.width = (x1 - x0) + "px"; erasEl.appendChild(el);
    const band = h("div", { class: "era-band" }); band.style.left = x0 + "px"; band.style.width = (x1 - x0) + "px"; cv.appendChild(band);
  });
  const pos = id => { const n = nodes.find(x => x.id === id); return { x: PADX + n.col * COLW, y: PADY + n.row * ROWH }; };
  // edges
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg"); svg.setAttribute("width", W); svg.setAttribute("height", H);
  const edges = [];
  nodes.forEach(n => n.pre.forEach(p => {
    const a = pos(p), b = pos(n.id);
    const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x + 22, y2 = b.y + NH / 2;
    const xm = x2 - 26;
    const r = Math.min(8, Math.abs(y2 - y1) / 2);
    let d;
    if (Math.abs(y2 - y1) < 1) d = `M${x1} ${y1}H${x2}`;
    else { const s = y2 > y1 ? 1 : -1; d = `M${x1} ${y1}H${xm - r}Q${xm} ${y1} ${xm} ${y1 + s*r}V${y2 - s*r}Q${xm} ${y2} ${xm + r} ${y2}H${x2}`; }
    const path = document.createElementNS(svgNS, "path"); path.setAttribute("d", d); path.setAttribute("class", "edge");
    svg.appendChild(path); edges.push({ from: p, to: n.id, el: path });
  }));
  cv.appendChild(svg);
  // nodes
  const els = {};
  nodes.forEach(n => {
    const p = pos(n.id), st = stateFn(n.id);
    const el = h("button", { type: "button", class: "node", "data-st": st, "data-id": n.id, "aria-label": n.label + " (" + ({mastered:"mastered",avail:"ready to study",locked:"prerequisites not yet mastered",planned:"planned"}[st]) + ")" },
      `<span class="box"><span class="ttl"><span>${esc(n.label)}</span><span class="hrs">${n.right || ""}</span></span><span class="chips">${(n.chips||[]).map(c => `<span class="chip">${c}</span>`).join("")}</span></span><span class="orb" style="font-size:${[...n.icon].length > 5 ? 12 : [...n.icon].length > 3 ? 14 : [...n.icon].length > 2 ? 17 : 20}px">${n.icon}</span>`);
    el.style.left = p.x + "px"; el.style.top = p.y + "px";
    els[n.id] = el; cv.appendChild(el);
  });
  edges.forEach(e => { if (stateFn(e.from) === "mastered" && stateFn(e.to) === "mastered") e.el.classList.add("done"); });
  vp.appendChild(cv); vp.appendChild(erasEl);
  const info = h("div", { class: "info-card win" }); info.innerHTML = `<div class="in"></div>`; vp.appendChild(info);
  // highlight ancestry
  function ancestors(id, acc = new Set()){ const n = nodes.find(x => x.id === id); n.pre.forEach(p => { if (!acc.has(p)) { acc.add(p); ancestors(p, acc); } }); return acc; }
  function hl(id){
    Object.values(els).forEach(e => e.classList.remove("hl"));
    edges.forEach(e => e.el.classList.remove("hl"));
    if (!id) { info.classList.remove("on"); return; }
    const anc = ancestors(id); anc.forEach(a => els[a].classList.add("hl"));
    edges.forEach(e => { if ((e.to === id || anc.has(e.to)) && (anc.has(e.from))) e.el.classList.add("hl"); });
    if (infoFn) { info.firstChild.innerHTML = infoFn(id, anc); info.classList.add("on"); }
  }
  // bottom bar
  const bar = h("div", { class: "tree-bar" });
  bar.innerHTML = `<button type="button" class="btn-s" data-d="-1" aria-label="Pan left">◀</button><div class="track" aria-hidden="true"><div class="thumb"></div></div><button type="button" class="btn-s" data-d="1" aria-label="Pan right">▶</button><span class="hint">Drag to pan · scroll · click a node to open</span>`;
  main.append(vp, bar);
  // pan logic
  let px = S.pan[key]?.x ?? 0, py = S.pan[key]?.y ?? 0, vw = 1, vh = 1;
  const track = $(".track", bar), thumb = $(".thumb", bar);
  function clamp(){ px = Math.min(0, Math.max(px, Math.min(0, vw - W))); if (H <= vh) py = Math.round((vh - H) / 2); else py = Math.min(0, Math.max(py, vh - H)); }
  function apply(){
    clamp(); cv.style.transform = `translate(${px}px,${py}px)`; erasEl.style.transform = `translateX(${px}px)`;
    const tw = track.clientWidth, frac = Math.min(1, vw / W);
    thumb.style.width = Math.max(24, tw * frac) + "px";
    const maxT = tw - thumb.offsetWidth; const t = W > vw ? (-px) / (W - vw) : 0;
    thumb.style.left = (maxT * t) + "px";
    S.pan[key] = { x: px, y: py };
  }
  const ro = new ResizeObserver(() => { vw = vp.clientWidth; vh = vp.clientHeight; apply(); });
  ro.observe(vp); cleanup.push(() => ro.disconnect());
  let drag = null, moved = false;
  vp.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, px, py, id: e.pointerId }; moved = false;
  });
  vp.addEventListener("pointermove", e => {
    if (!drag) {
      const n = e.target.closest(".node"); hl(n ? n.dataset.id : null); return;
    }
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) > 5) { moved = true; vp.classList.add("drag"); try { vp.setPointerCapture(drag.id); } catch(_){} hl(null); }
    if (moved) { px = drag.px + dx; py = drag.py + dy; apply(); }
  });
  const end = e => {
    if (!drag) return;
    const wasMoved = moved; drag = null; vp.classList.remove("drag");
    if (!wasMoved) { const n = e.target.closest && e.target.closest(".node"); if (n) onOpen(n.dataset.id); }
  };
  vp.addEventListener("pointerup", end);
  vp.addEventListener("pointercancel", () => { drag = null; vp.classList.remove("drag"); });
  vp.addEventListener("pointerleave", () => { if (!drag) hl(null); });
  vp.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList.contains("node")) { e.preventDefault(); onOpen(e.target.dataset.id); } });
  cv.querySelectorAll(".node").forEach(n => { n.addEventListener("click", e => e.preventDefault()); n.addEventListener("focus", () => { hl(n.dataset.id); const x = parseFloat(n.style.left); if (x + px < 0 || x + px + NW > vw) { px = -(x - vw / 2 + NW / 2); apply(); } }); n.addEventListener("blur", () => hl(null)); });
  vp.addEventListener("wheel", e => { e.preventDefault(); const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY) || H <= vh) px -= d; else { px -= d; } apply(); }, { passive: false });
  bar.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { const target = px - (+b.dataset.d) * COLW * 2; animatePan(target); });
  function animatePan(target){ const start = px, t0 = performance.now(); const step = now => { const k = Math.min(1, (now - t0) / 350); const e = 1 - Math.pow(1 - k, 3); px = start + (target - start) * e; apply(); if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
  let tdrag = null;
  thumb.addEventListener("pointerdown", e => { e.stopPropagation(); tdrag = { x: e.clientX, left: thumb.offsetLeft }; thumb.setPointerCapture(e.pointerId); });
  thumb.addEventListener("pointermove", e => { if (!tdrag) return; const maxT = track.clientWidth - thumb.offsetWidth; const l = Math.max(0, Math.min(maxT, tdrag.left + e.clientX - tdrag.x)); px = -(l / (maxT || 1)) * (W - vw); apply(); });
  thumb.addEventListener("pointerup", () => tdrag = null);
  track.addEventListener("pointerdown", e => { if (e.target !== track) return; const r = track.getBoundingClientRect(); const t = (e.clientX - r.left) / r.width; animatePan(-(t * W - vw / 2)); });
  return { els, focus(id){ const p = pos(id); px = -(p.x - vw / 2 + NW / 2); py = -(p.y - vh / 2 + NH / 2); apply(); els[id].classList.add("sel"); } };
}

function renderFieldTree(main, f){
  const F = DB.fields[f], TR = TREES[f], FN = fieldNodes(f);
  const head = h("div", { class: "tree-head" });
  const done = doneIn(f);
  const hrs = FN.reduce((s, n) => s + (T[n.id]?.hours || 0), 0);
  head.innerHTML = `<button type="button" class="btn-s navtoggle" id="navtoggle2">☰ Fields</button><button type="button" class="btn-s" id="tback">◀ ${esc(SM[subjOf(f)].name)} field map</button><div><h2>${esc(F.name)}</h2><div class="sub">${FN.length ? `${FN.length} topic${FN.length === 1 ? "" : "s"}${TR.planned && TR.planned.length ? ` written, ${TR.planned.length} planned` : ""} · about ${hrs} study hours · ${done} mastered` : `${(TR.planned || []).length} planned topics · the tree is mapped and the pages are being written`}</div></div>
   <div class="legend-chips"><span><i class="lg-m"></i>Mastered</span><span><i class="lg-a"></i>Ready</span><span><i class="lg-l"></i>Locked</span>${TR.planned && TR.planned.length ? '<span><i class="lg-p"></i>Planned</span>' : ""}<span><i class="lg-s"></i>Last opened</span></div>`;
  main.appendChild(head);
  $("h2", head).appendChild(starBtn("f:" + f));
  $("#navtoggle2", head).onclick = () => main.parentElement.classList.toggle("navopen");
  $("#tback", head).onclick = () => go({ view: "math", subject: subjOf(f), field: "map", topic: null });
  const inTree = new Set(FN.map(n => n.id));
  // Planned nodes (TR.planned) show the rest of a partly written tree, dashed and not openable.
  const PL = TR.planned || [], PLAN = Object.fromEntries(PL.map(n => [n.id, n]));
  const nodes = FN.map(n => ({ ...n, pre: n.pre.filter(p => inTree.has(p)), ext: n.pre.filter(p => !inTree.has(p)), label: T[n.id]?.title || n.id, right: T[n.id] ? T[n.id].hours + " h" : "" }))
    .concat(PL.map(n => ({ ...n, pre: n.pre.filter(p => inTree.has(p) || PLAN[p]), ext: n.pre.filter(p => !inTree.has(p) && !PLAN[p]), right: "Planned" })));
  const tree = buildTree(main, {
    nodes, eras: TR.eras, key: "tree-" + f, title: F.name, stateFn: id => PLAN[id] ? "planned" : stateOf(id),
    onOpen: id => { if (!PLAN[id]) go({ view: "math", field: f, topic: id }); },
    infoFn: (id, anc) => {
      if (PLAN[id]) { const lb = p => esc(PLAN[p] ? PLAN[p].label : (T[p]?.title || p));
        return `<div><span class="pill l">Planned</span></div><h4>${esc(PLAN[id].label)}</h4><p>This topic's page is not written yet. It is shown so you can see the whole path.</p><div class="req">${PLAN[id].pre.length ? "Requires: " + PLAN[id].pre.map(lb).join(", ") : ""}</div>`; }
      const t = T[id], st = stateOf(id), nd = NODE[id];
      const pill = st === "mastered" ? `<span class="pill m">Mastered</span>` : st === "avail" ? `<span class="pill a">Ready to study</span>` : `<span class="pill l">Locked</span>`;
      const nm = p => esc(T[p]?.title || p) + (NODE[p].field !== f ? ` <span style="color:var(--faint)">(${esc(DB.fields[NODE[p].field].name)})</span>` : "");
      const need = nd.pre.filter(p => !mastered.has(p)).map(nm);
      return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pill}<span class="pill l">${esc(t?.grade || "")}</span></div><h4>${esc(t?.title || id)}</h4><p>${esc(t?.short || "")}</p>
        <div class="req">${nd.pre.length ? "Requires: " + nd.pre.map(nm).join(", ") : "Starting point, no prerequisites"}${need.length && st !== "mastered" ? "<br>Still to master: " + need.join(", ") : ""}<br>Path length: ${anc.size} topic${anc.size === 1 ? "" : "s"} before this one in this tree</div>`;
    }
  });
  const last = store.get("lastTopic." + f, f === DB.defaultField ? store.get("lastTopic", null) : null);
  if (last && inTree.has(last) && !S.pan["tree-" + f]) requestAnimationFrame(() => tree.focus(last));
  else if (last && inTree.has(last)) tree.els[last].classList.add("sel");
}

// A story: { title, book, author, year, kind, where, scene, focus: [tags], tokens, notes, note, tags? }.
// Focus words are coloured by their tag: parts of speech (DB.posTags) unless the story defines its own
// `tags` (subject/predicate, clause types, comma rules …). The art comes from DB.scenes.
function storyPassage(st){
  const P = st.tags || DB.posTags, focus = new Set(st.focus || []);
  let html = "<p>";
  DB.parseStory(st.tokens).forEach(x => {
    if (x.br) { html += "</p><p>"; return; }
    let w = esc(x.w); if (x.it) w = `<i>${w}</i>`;
    // a tagged word links only to a sense with the same part of speech (verb "work" ≠ noun "work")
    let gk = /[A-Za-z]/.test(x.w) ? gLookup(x.w) : null; const gp = !st.tags && x.tag && DB.posTags[x.tag] ? x.tag : null;
    if (gk && gp && !GWORDS[gk].some(e => e.pos === gp)) gk = null;
    const ga = gk ? ` data-gw="${esc(gk)}"${gp ? ` data-gp="${gp}"` : ""} tabindex="0" role="button" aria-label="${esc(x.w)}: open glossary card"` : "";
    if (x.tag && focus.has(x.tag)) { const note = (st.notes || {})[x.key]; w = `<span class="sw ${P[x.tag].c}${gk ? " gw" : ""}" title="${esc(P[x.tag].name + (note ? ": " + note : ""))}"${ga}>${w}</span>`; }
    else if (gk) w = `<span class="gw"${ga}>${w}</span>`;
    html += (x.glue ? "" : " ") + w;
  });
  return html + "</p>";
}
function storyPanel(st){
  const P = st.tags || DB.posTags, art = (DB.scenes || {})[st.scene] || "";

/* The "why" block in an Inquire Law console panel. With a second block (where it goes wrong) the two share the panel:
   side by side with a red rule between them (Concept), or stacked with the rule across (Formal, stack = true).
   Lesson order everywhere: what (question, ideas) → why → where it goes wrong (wrong vs right) → the rest. */
const whyKey = (label, tone) => `<div class="why-k${tone ? " " + tone : ""}"><i aria-hidden="true"></i>${esc(label)}</div>`;
const whyHTML = (M, where, stack) => !M && !where ? "" : `<section class="win why${M && where ? " why-pair" : ""}${stack ? " stack" : ""}">${M ? `<div class="matters">${whyKey("Why it matters")}<h2>${esc(M.title)}</h2>${M.text}</div>` : ""}${where || ""}</section>`;
/* Answer checker shared by the Intermediate and Formal blocks. k = {parts: [{label, ans}], hint} for typed numbers
   (commas, spaces and words ignored) or {choices: [{t, ok, why}], hint} for a pick. */
// Stable order for a pick: seeded by the question's text, so a learner sees the same order every visit.
function pzOrder(k){ const n = k.choices.length, idx = [...Array(n).keys()]; let h = 0; for (const ch of String(k.ask || k.q || "") + k.choices.map(c => c.t).join("|")) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  for (let i = n - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; }
function pzHTML(k){
  const order = k.choices ? pzOrder(k) : [];   // picks are shown in a stable shuffled order, so the right one is not always first
  const body = k.choices ? `<div class="pz-ch" role="group">${order.map(j => `<button type="button" class="pz-opt" data-j="${j}">${k.choices[j].t}</button>`).join("")}</div>`
    : `<form class="pz-form" novalidate>${k.parts.map((x, j) => `<label class="pz-in"><span>${esc(x.label)}</span><input type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-j="${j}" aria-label="${esc(x.label)}"></label>`).join("")}<button type="submit" class="btn-s good pz-check">Check</button></form>`;
  return `${body}<p class="pz-fb" aria-live="polite"></p>${k.hint ? `<p class="pz-hint" hidden><b>Hint.</b> ${k.hint}</p>` : ""}

}
let pzNudge = "";   // a lesson's own first "Not yet" (layers.nudge, set by layerHTML); a question's k.nudge wins
const pzNum = s => { const m = String(s).replace(/[,\s]/g, "").replace(/[\u2212\u2013]/g, "-").match(/-?\d+(\.\d+)?/);   // a typed − (U+2212) or – counts as a minus sign
   return m ? +m[0] : NaN; };
// Wires one checker inside c. o.right() after a right answer, o.show() when the learner asks for the answer.
function pzWire(c, k, o){
  const fb = c.querySelector(".pz-fb"), hint = c.querySelector(".pz-hint"), hb = c.querySelector("[data-pz-hint]"), show = c.querySelector("[data-pz-show]");
  let tries = 0, over = false;
  const showHint = () => { if (hint) hint.hidden = false; if (hb) hb.hidden = true; };
  const end = () => { over = true; if (hb) hb.hidden = true; show.hidden = true; };
  const verdict = (all, partial, why) => { tries++;
    window.dispatchEvent(new CustomEvent("inquire:quiz", { detail: { correct: all } }));
    if (all) { fb.textContent = k.right || o.rightText || "Correct."; fb.dataset.k = "ok"; end(); o.right(); return; }
    fb.textContent = why || (partial ? "One part is right. Check the other one." : tries === 1 ? (k.nudge || pzNudge || "Not yet. Check your work and try again.") : "Still off. Try the hint, or look at the answer.");
    fb.dataset.k = "no"; show.hidden = false; if (tries >= 2) showHint(); };
  const form = c.querySelector(".pz-form");
  if (form) form.onsubmit = e => { e.preventDefault(); if (over) return;
    const ins = [...form.querySelectorAll("input")]; if (ins.every(x => !x.value.trim())) { fb.textContent = "Type a number first."; fb.dataset.k = ""; return; }
    const ok = ins.map((x, j) => { const r = Math.abs(pzNum(x.value) - k.parts[j].ans) < 1e-9; x.dataset.ok = r ? "1" : "0"; return r; });
    if (ok.every(Boolean)) ins.forEach(x => x.readOnly = true);
    verdict(ok.every(Boolean), ok.length > 1 && ok.some(Boolean)); };
  c.querySelectorAll(".pz-opt").forEach(b => b.onclick = () => { if (over) return; const ch = k.choices[+b.dataset.j];
    b.dataset.ok = ch.ok ? "1" : "0"; if (ch.ok) c.querySelectorAll(".pz-opt").forEach(x => x.disabled = true); verdict(!!ch.ok, false, ch.ok ? "" : ch.why); });
  if (hb) hb.onclick = () => { showHint(); show.hidden = false; };
  show.onclick = () => { end(); o.show(); };
}

/* ---------- glossary (shared by every subject; spec web/GLOSSARY-SPEC.md) ---------- */
// One entry = one subject's sense block for one headword. Blocks are grouped by headword; each block is marked by its
// subject: stripe/chip colour = subject group (DB.glossaryGroupColour), glyph = subject, plus subject · field text.
const GL = DB.glossary || [];
const GSUB = Object.fromEntries((DB.subjects || []).map(s => [s.id, s]));
const SUBORDER = (DB.subjects || []).map(s => s.id);
const gColour = sub => (DB.glossaryGroupColour || {})[(GSUB[sub] && GSUB[sub].group) || "reference"] || "var(--line-2)";
const gGlyph = sub => (GSUB[sub] && GSUB[sub].glyph) || "·";
const gName = sub => (GSUB[sub] && GSUB[sub].name) || sub;
const GWORDS = {};
GL.forEach(e => (GWORDS[e.w.toLowerCase()] = GWORDS[e.w.toLowerCase()] || []).push(e));
const GFORM = {};
Object.keys(GWORDS).forEach(k => { GFORM[k] = k; });
Object.keys(GWORDS).forEach(k => GWORDS[k].forEach(e => (e.forms || []).forEach(f => { const x = f.toLowerCase(); if (!GFORM[x]) GFORM[x] = k; })));
const gLookup = w => { const x = String(w).toLowerCase().replace(/[’']s$/, ""); return GFORM[x] || null; };
const gSubjects = () => SUBORDER.filter(s => GL.some(e => e.subject === s));
const gStrip = s => String(s).replace(/<[^>]+>/g, "");
// blocks of a headword, the preferred subject first, then subject order
const gBlocks = (k, pref) => (GWORDS[k] || []).slice().sort((a, b) => (b.subject === pref) - (a.subject === pref) || SUBORDER.indexOf(a.subject) - SUBORDER.indexOf(b.subject));
const plannedNode = id => { for (const [f, tr] of Object.entries(TREES)) { const n = (tr.planned || []).find(x => x.id === id); if (n) return { ...n, field: f }; } return null; };
const G = { q: "", sub: "all", field: null, letter: null, word: null, ret: null, mine: store.get("glmine", false) };
function gTok(){ return "glossary" + (G.sub !== "all" ? "-" + G.sub : "") + (G.word ? "~" + encodeURIComponent(G.word) : ""); }
function openGlossary(o = {}){
  if (o.from) { G.ret = o.from; G.q = ""; G.field = null; G.letter = null; }
  if ("sub" in o) { G.sub = o.sub || "all"; if (G.field && (!DB.fields[G.field] || subjOf(G.field) !== G.sub)) G.field = null; }
  if ("field" in o && o.field && DB.fields[o.field] && subjOf(o.field) === G.sub) G.field = o.field;
  if ("q" in o) G.q = o.q || "";
  if ("word" in o) G.word = o.word;
  go({ view: "glossary", topic: null });
}
function gScore(k, blocks, q){
  if (!q) return 1;
  if (k === q) return 100; if (k.startsWith(q)) return 80; if (k.includes(q)) return 60;
  let s = 0; const qm = q.replace(/^-|-$/g, "");
  blocks.forEach(e => {
    if ((e.forms || []).some(f => f.toLowerCase().startsWith(q))) s = Math.max(s, 50);
    if (qm && (e.parts || []).some(p => p[0].toLowerCase() === qm)) s = Math.max(s, 45);
    if (qm.length > 2 && (e.parts || []).some(p => p[0].toLowerCase().startsWith(qm))) s = Math.max(s, 35);
    if (q.length > 2 && e.senses.some(x => gStrip(x).toLowerCase().includes(q))) s = Math.max(s, 10);
  });
  return s;
}
function gVisible(){
  const q = G.q.trim().toLowerCase();
  return Object.keys(GWORDS).map(k => {
    const blocks = GWORDS[k].filter(e => (G.sub === "all" || e.subject === G.sub) && (!G.field || e.field === G.field) && (!G.mine || (e.node && mastered.has(e.node))));
    return { k, blocks, score: blocks.length ? gScore(k, blocks, q) : 0 };
  }).filter(x => x.score > 0 && (!G.letter || q || x.k[0] === G.letter))
    .sort((a, b) => b.score - a.score || a.k.localeCompare(b.k));
}
// part of speech: a neutral pill with a small square in the grammar colour (subject colour stays on the stripe only)
function gPos(e){ const p = DB.posTags[e.pos]; return p ? `<span class="gl-pos"><i class="${p.c}"></i>${esc(p.name)}</span>` : ""; }
function gNodeLink(e){
  if (e.node && NODE[e.node]) return `<button type="button" class="lnk charted" data-t="${e.node}">Taught in · ${esc(T[e.node] ? T[e.node].title : e.node)}</button>`;
  const pn = e.node && plannedNode(e.node);
  if (pn) return `<button type="button" class="lnk" data-f="${pn.field}">Planned topic · ${esc(pn.label)}</button>`;
  if (e.field && DB.fields[e.field]) return `<button type="button" class="lnk${charted(e.field) ? " charted" : ""}" data-f="${e.field}">${esc(DB.fields[e.field].name)}${charted(e.field) ? "" : " (planned)"}</button>`;
  return "";
}
function gQuote(q){
  const t = T[q.topic]; const st = t && (t.stories || []).find(s => DB.storyText(s.tokens).includes(q.text));
  if (!st) return "";
  return `<blockquote class="gl-q"><p>“${esc(q.text)}”</p><footer>${esc(st.author)} · <i>${esc(st.book)}</i> (${st.year}) <button type="button" class="gl-a" data-t="${q.topic}">See the passage</button></footer></blockquote>`;
}
function gSense(e, headIpa){
  const pairs = (lb, xs) => xs && xs.length ? `<div class="gl-rel"><span class="lb">${lb}</span>${xs.map(p => Array.isArray(p) ? `<span><b>${gw(p[0])}</b> ${p[1]}</span>` : `<span><b>${gw(p)}</b></span>`).join("")}</div>` : "";
  const gw = w => GWORDS[w.toLowerCase()] ? `<button type="button" class="gl-a" data-gword="${esc(w.toLowerCase())}">${esc(w)}</button>` : esc(w);
  const f = e.field && DB.fields[e.field];
  return `<article class="gl-sense" style="--gc:${gColour(e.subject)}">
    <div class="gl-sh"><span class="gl-glyph" aria-hidden="true">${gGlyph(e.subject)}</span><span class="gl-subj">${esc(gName(e.subject))}</span>${f ? `<span class="gl-fld">${esc(f.name)}</span>` : ""}<span class="gl-tags">${gPos(e)}${e.register ? `<span class="gl-tag">${esc(DB.glossaryRegister[e.register])}</span>` : ""}${e.conno ? `<span class="gl-tag">${esc(e.conno)} connotation</span>` : ""}</span></div>
    ${e.ipa !== headIpa ? `<div class="gl-say"><span class="ipa">${esc(e.ipa)}</span>${e.syl ? `<span class="syl">${esc(e.syl)}</span>` : ""}</div>` : ""}
    <ol class="gl-defs">${e.senses.map(s => `<li>${s}</li>`).join("")}</ol>
    ${e.ex ? `<p class="gl-ex"><span class="lb">Example</span>${e.ex}</p>` : ""}
    ${e.quote ? gQuote(e.quote) : ""}
    ${e.parts ? `<div class="gl-parts" aria-label="Word parts">${e.parts.map(p => `<span class="mp"><b>${esc(p[0])}</b><small>${p[1]}</small></span>`).join('<span class="pl">+</span>')}</div>` : ""}
    ${e.origin ? `<p class="gl-orig"><span class="lb">Origin</span>${e.origin}</p>` : ""}
    ${pairs("Synonyms", e.syn)}${pairs("Antonyms", e.ant)}${pairs("Often confused with", e.confused)}
    ${gNodeLink(e) ? `<div class="gl-links">${gNodeLink(e)}</div>` : ""}
  </article>`;
}
function gEntry(k, sub = G.sub, pref = sub !== "all" ? sub : (G.ret && G.ret.subject)){
  const blocks = gBlocks(k, pref);
  if (!blocks.length) return `<div class="gl-empty">Pick a word from the list.</div>`;
  const head = blocks[0], subs = [...new Set(blocks.map(e => e.subject))];
  const see = [...new Set(blocks.flatMap(e => e.see || []))].filter(w => w.toLowerCase() !== k);
  const hidden = sub !== "all" ? GWORDS[k].filter(e => e.subject !== sub).length : 0;
  const shown = sub !== "all" ? blocks.filter(e => e.subject === sub) : blocks;
  return `<button type="button" class="btn-s gl-back" id="glback">◀ All words</button>
    <header class="gl-head"><h2>${esc(head.w)}</h2><div class="gl-say"><span class="ipa">${esc(head.ipa)}</span>${head.syl ? `<span class="syl">${esc(head.syl)}</span>` : ""}</div>
      <div class="gl-in">${subs.map(s => `<span class="gl-chip sm" style="--gc:${gColour(s)}"><span class="g">${gGlyph(s)}</span>${esc(gName(s))}</span>`).join("")}</div></header>
    ${shown.map(e => gSense(e, head.ipa)).join("")}
    ${hidden ? `<button type="button" class="btn-s gl-more" id="glall">Show ${hidden} more sense${hidden === 1 ? "" : "s"} from other subjects</button>` : ""}
    ${see.length ? `<div class="gl-rel gl-see"><span class="lb">See also</span>${see.map(w => `<button type="button" class="gl-a" data-gword="${esc(w.toLowerCase())}">${esc(w)}</button>`).join("")}</div>` : ""}`;
}

function renderGlossary(){
  const subs = gSubjects();

  s.innerHTML = `<div class="screen-in gl-wrap">
    <div class="hello gl-hello"><div class="gl-top">${G.ret ? `<button type="button" class="btn-s" id="glret">◀ ${esc(G.ret.label)}</button>` : ""}<button type="button" class="btn-s gl-menu" id="glmenu">◀ Menu</button></div>

    </div>

  <section class="dkn win" id="dk-notes" role="dialog" aria-label="Notes" hidden>

      <div class="dk-hr"><button type="button" class="dk-x dkn-home" aria-label="Dock Notes at the bottom right" title="Dock at the bottom right">⇲</button><button type="button" class="dk-x dkn-x" aria-label="Close Notes" title="Close">✕</button></div></header>

app.appendChild(root);
const win = root.querySelector("#dk-win"), nwin = root.querySelector("#dk-notes"), nh = nwin.querySelector(".dkn-h");

// the rail steps aside while a docked box covers its corner; icons show which boxes are open
function sync() {

}

/* ---------- Assist window: slides out of the right edge and back ---------- */
let slideT = null;
function setOpen(o) {

}
function setTab(t) {

  win.querySelectorAll(".dk-pane").forEach(p => { p.hidden = p.dataset.p !== t; });

const railFocus = () => { const b = root.querySelector('.dk-rail [data-go="ai"]'); if (b && !root.classList.contains("rail-off")) b.focus(); };
root.addEventListener("click", e => {
  const b = e.target.closest(".dk-ic"); if (!b) return;

  if (g === "notes") return setNotes(!st.notes.open);

win.querySelector(".dk-x").onclick = () => { setOpen(false); railFocus(); };
win.querySelectorAll(".dk-tabs [data-t]").forEach(b => b.onclick = () => setTab(b.dataset.t));
win.addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); setOpen(false); railFocus(); } });

/* ---------- AI chat ---------- */
const chat = []; // this session only
const ctx = () => (A() ? A().context() : {});
function drawCtx() {
  const c = ctx(), where = c.topicTitle || c.fieldName || c.subjectName || "";
  $(".dk-ctx").innerHTML = (c.view === "math" && where ? `<span>Context</span><b>${esc(where)}</b>` : `<span>Context</span><b>${c.view === "notes" ? "My notes" : c.view === "glossary" ? "Glossary" : "Menu"}</b>`)
    + `<span class="dk-prov">${window.InquireAI ? esc(window.InquireAI.name || "Assistant") : "not connected"}</span>`;
}
function bubble(role, text, log) {
  const d = document.createElement("div");
  d.className = "dk-msg " + role;
  d.innerHTML = `<div class="dk-t"></div>` + (role === "assistant" ? `<button type="button" class="dk-save" title="Save this reply to a note">＋ Note</button>` : "");
  d.querySelector(".dk-t").textContent = text;
  const sv = d.querySelector(".dk-save");
  if (sv) sv.onclick = () => { const c = ctx(); const n = NS.create({ title: "AI: " + (c.topicTitle || "notes"), body: d.querySelector(".dk-t").textContent, src: c.topic ? { topic: c.topic, title: c.topicTitle } : null }); sv.textContent = "Saved ✓"; sv.disabled = true; window.dispatchEvent(new CustomEvent("inquire:notes-changed", { detail: { id: n.id } })); };
  log = log || $(".dk-log"); log.appendChild(d); log.scrollTop = 1e9;

}
function hello() {
  if ($(".dk-log").childElementCount) return;
  const p = document.createElement("p"); p.className = "dk-hello";

}
$(".dk-ask").onsubmit = async e => {
  e.preventDefault();
  const ta = $(".dk-ask textarea"), q = ta.value.trim(); if (!q) return;
  ta.value = ""; bubble("user", q); chat.push({ role: "user", content: q });
  const out = bubble("assistant", "…"), t = out.querySelector(".dk-t"); out.classList.add("busy");
  const P = window.InquireAI;
  try {
    if (!P || typeof P.ask !== "function") throw new Error("The AI assistant is not connected yet.");
    const r = await P.ask({ messages: chat.slice(), context: ctx() });
    let text = "";
    if (r && typeof r[Symbol.asyncIterator] === "function") { t.textContent = ""; for await (const ch of r) { text += ch; t.textContent = text; $(".dk-log").scrollTop = 1e9; } }
    else { text = String(r == null ? "" : r); t.textContent = text; }
    chat.push({ role: "assistant", content: text });
  } catch (err) { t.textContent = err.message || "Something went wrong."; out.classList.add("err"); }
  out.classList.remove("busy"); $(".dk-log").scrollTop = 1e9;
};
$(".dk-ask textarea").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $(".dk-ask").requestSubmit(); } });

/* ---------- Chat with other users (needs window.InquireChat) ---------- */
const clog = $(".dk-clog"), cask = $(".dk-cask"), cta = cask.querySelector("textarea");
let chatOff = null;
function cmsg(m, mine) {

  if (on && !chatOff && typeof C.subscribe === "function") { clog.innerHTML = ""; chatOff = C.subscribe("general", m => cmsg(m, false)) || (() => {}); }

}
cask.onsubmit = async e => {
  e.preventDefault();
  const C = window.InquireChat, text = cta.value.trim(); if (!text || !C) return;

cta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); cask.requestSubmit(); } });

/* ---------- Notes box: docked or floating, dragged by its header ---------- */
const zoom = () => app.currentCSSZoom || parseFloat(getComputedStyle(app).zoom) || 1;
const phone = () => matchMedia("(max-width:760px)").matches;
function place() {
  const fl = st.notes.float && !phone();
  nwin.classList.toggle("docked", !fl); nwin.classList.toggle("floating", fl);
  if (!fl) { nwin.style.left = nwin.style.top = ""; return; }
  const z = zoom(), W = innerWidth / z, H = innerHeight / z, w = nwin.offsetWidth || 380;
  st.notes.x = Math.round(Math.max(120 - w, Math.min(W - 120, st.notes.x))); // keep enough of the header on screen to grab
  st.notes.y = Math.round(Math.max(0, Math.min(H - 44, st.notes.y)));
  nwin.style.left = st.notes.x + "px"; nwin.style.top = st.notes.y + "px";
}
let closeT = null;
function setNotes(o) {
  st.notes.open = o; keep(); clearTimeout(closeT);
  if (o && phone() && st.open) setOpen(false);
  if (o) { nwin.hidden = false; place(); void nwin.offsetWidth; nwin.classList.add("is-open"); drawNotes(); }
  else { flush(); nwin.classList.remove("is-open"); closeT = setTimeout(() => { if (!st.notes.open) nwin.hidden = true; }, 240); }
  sync();
}
function dockHome() { st.notes.float = false; keep(); place(); sync(); }
nwin.querySelector(".dkn-x").onclick = () => { setNotes(false); railFocus(); };
nwin.querySelector(".dkn-home").onclick = dockHome;
nh.addEventListener("dblclick", e => { if (!e.target.closest("button")) dockHome(); });
nwin.addEventListener("keydown", e => { if (e.key === "Escape" && !e.target.closest(".nr-pop, .nv-pop")) { e.stopPropagation(); setNotes(false); railFocus(); } });
nh.addEventListener("pointerdown", e => {
  if (e.button !== 0 || e.target.closest("button") || phone()) return;
  e.preventDefault();
  const z = zoom(), r = nwin.getBoundingClientRect(), ox = (e.clientX - r.left) / z, oy = (e.clientY - r.top) / z;
  let moved = false;
  const move = ev => {
    if (!moved && Math.abs(ev.clientX - e.clientX) + Math.abs(ev.clientY - e.clientY) < 4) return; // a click is not a drag
    if (!moved) { moved = true; nwin.classList.add("dragging"); st.notes.float = true; sync(); }
    st.notes.x = ev.clientX / z - ox; st.notes.y = ev.clientY / z - oy; place();
  };
  const up = () => { nh.removeEventListener("pointermove", move); nh.removeEventListener("pointerup", up); nh.removeEventListener("pointercancel", up); nwin.classList.remove("dragging"); if (moved) keep(); };
  try { nh.setPointerCapture(e.pointerId); } catch (err) {}
  nh.addEventListener("pointermove", move); nh.addEventListener("pointerup", up); nh.addEventListener("pointercancel", up);
});
window.addEventListener("resize", () => { if (st.notes.open && st.notes.float) place(); });

let edId = null, saveT = null, rich = null;
function drawNotes() {
  const pane = nwin.querySelector('[data-p="notes"]');
  if (!NS) { pane.innerHTML = "<p class=dk-hello>Notes are unavailable.</p>"; return; }
  if (rich) { rich.destroy(); rich = null; }
  const n = edId && NS.get(edId);
  if (n) {
    pane.innerHTML = `<div class="dk-nbar"><button type="button" class="btn-s" data-a="back">◀ Notes</button><span class="dk-saved">Saved</span><button type="button" class="btn-s" data-a="photo" title="Add a photo from this computer">＋ Photo</button><button type="button" class="btn-s" data-a="clip" title="Add the text you have selected on the page">Clip selection</button><button type="button" class="btn-s warn" data-a="del" title="Delete this note">Delete</button></div>
      <input class="dk-ntitle" value="${esc(n.title)}" aria-label="Title" maxlength="140"><div class="dk-nbody"></div><input type="file" accept="image/*" multiple hidden>
      <div class="dk-nfoot">${n.src ? `<button type="button" class="dk-link" data-a="src">↗ ${esc(n.src.title)}</button>` : "<span></span>"}<button type="button" class="dk-link" data-a="full">Open in My notes ▸</button></div>`;
    const ti = pane.querySelector(".dk-ntitle"), sv = pane.querySelector(".dk-saved");
    rich = NS.mountEditor(pane.querySelector(".dk-nbody"), n.id, {
      onEditing: () => { sv.textContent = "Editing…"; }, onSaved: () => { sv.textContent = "Saved"; },
      openNote: id => { edId = id; drawNotes(); }, openTopic: id => A() && A().openTopic(id)
    });
    const saveTitle = () => { clearTimeout(saveT); sv.textContent = "Editing…"; saveT = setTimeout(() => { NS.update(n.id, { title: ti.value.trim() || "Untitled note" }); sv.textContent = "Saved"; saveT = null; }, 400); };
    ti.oninput = saveTitle;
    const file = pane.querySelector('input[type="file"]');
    pane.querySelector('[data-a="photo"]').onclick = () => file.click();
    file.onchange = async () => { const k = await rich.addFiles(file.files); sv.textContent = k ? "Photo added" : "That file is not a photo"; file.value = ""; };
    pane.querySelector('[data-a="back"]').onclick = () => { flush(); edId = null; drawNotes(); };
    pane.querySelector('[data-a="full"]').onclick = () => { flush(); const id = edId; edId = null; setNotes(false); A() && A().openNotes(id); };
    const src = pane.querySelector('[data-a="src"]'); if (src) src.onclick = () => A() && A().openTopic(n.src.topic);
    pane.querySelector('[data-a="del"]').onclick = () => { // at once, with Undo (like My notes)
      flush(); if (rich) { rich.destroy(); rich = null; } edId = null;
      NS.deleteWithUndo(n.id, id => { edId = id; if (st.notes.open) drawNotes(); }); drawNotes();
    };
    pane.querySelector('[data-a="clip"]').onmousedown = e => e.preventDefault(); // keep the page selection
    pane.querySelector('[data-a="clip"]').onclick = () => {
      const sel = String(window.getSelection ? window.getSelection() : "").trim(), c = ctx();
      if (!sel) { sv.textContent = "Select text on the page first"; return; }
      flush(); NS.appendQuote(n.id, sel, c.topic, c.topicTitle); drawNotes(); sv.textContent = "Clipped";
    };
    if (!n.body) rich.el.focus();
    return;
  }
  const c = ctx(), here = n => (A() && A().noteHere ? A().noteHere(n) : { score: 0 });
  // notes linked to the lesson, field or subject on screen come first (most specific first), then favourites, then the rest by last edit
  const all = NS.list().map(n => Object.assign(n, { _h: here(n) })).sort((a, b) => (b._h.score - a._h.score) || (favTop() ? b.fav - a.fav : 0) || (b.updated - a.updated));
  const nLinked = all.filter(n => n._h.score).length;
  const item = x => `<button type="button" class="dk-nit${x._h.score ? " here" : ""}" data-id="${x.id}"><b>${x.fav ? "★ " : ""}${esc(x.title)}</b>${x._h.score ? `<small class="dk-nhere">Linked to ${esc(x._h.label)}</small>` : ""}<span>${esc(x.body.slice(0, 90))}</span></button>`;
  const list = all.slice(0, Math.max(30, nLinked));
  pane.innerHTML = `<div class="dk-nbar"><button type="button" class="btn-s" data-a="new">＋ New</button><button type="button" class="btn-s" data-a="gen"${c.topic ? "" : " disabled"} title="${c.topic ? "Make a study note from " + esc(c.topicTitle) : "Open a topic page first"}">Note from this page</button></div>
    <div class="dk-nlist">${all.length ? (nLinked ? `<p class="dk-nh">Linked to this page · ${nLinked}</p>` + list.slice(0, nLinked).map(item).join("") + (list.length > nLinked ? `<p class="dk-nh">Other notes</p>` : "") + list.slice(nLinked).map(item).join("") : list.map(item).join("")) : `<p class="dk-hello">No notes yet. Start one, or open a topic and choose <b>Note from this page</b> for a ready-made study sheet you can add to.</p>`}</div>
    <div class="dk-nfoot"><span>${all.length} note${all.length === 1 ? "" : "s"}</span><button type="button" class="dk-link" data-a="full">Open in My notes ▸</button></div>`;
  pane.querySelector('[data-a="new"]').onclick = () => { const x = NS.create({ src: c.topic ? { topic: c.topic, title: c.topicTitle } : null }); edId = x.id; drawNotes(); pane.querySelector(".dk-ntitle").select(); };
  pane.querySelector('[data-a="gen"]').onclick = () => {
    const g = NS.fromTopic(c.topic); if (!g) return; const x = NS.create(g); edId = x.id; drawNotes();
    const ed = pane.querySelector(".nb-rich"); ed.focus(); const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ed.scrollTop = 1e9;
  };
  pane.querySelector('[data-a="full"]').onclick = () => { setNotes(false); A() && A().openNotes(); };
  pane.querySelectorAll(".dk-nit").forEach(b => b.onclick = () => { edId = b.dataset.id; drawNotes(); });
}
function flush() {
  if (rich) rich.flush();
  if (!saveT) return; clearTimeout(saveT); saveT = null; const ti = nwin.querySelector(".dk-ntitle"); if (ti && edId) NS.update(edId, { title: ti.value.trim() || "Untitled note" });
}

// keep the context line and the notes list current
const refresh = () => { if (!win.hidden && st.tab === "ai") drawCtx(); if (!nwin.hidden && !edId) drawNotes(); };
window.addEventListener("hashchange", refresh);
window.addEventListener("inquire:route", refresh);
window.addEventListener("inquire:notes-changed", () => { if (!nwin.hidden && !edId) drawNotes(); });
window.addEventListener("inquire:signed-in", () => {
  edId = null; chat.length = 0; $(".dk-log").innerHTML = ""; hello();
  if (chatOff) { try { chatOff(); } catch (e) {} chatOff = null; } clog.innerHTML = "";
  if (!win.hidden) setTab(st.tab); if (!nwin.hidden) drawNotes();
});
window.InquireDock = { open: t => { st.tab = t === "chat" ? "chat" : "ai"; setOpen(true); }, close: () => setOpen(false), notes: setNotes, dockNotes: dockHome, state: () => JSON.parse(JSON.stringify(st)) };
hello();
if (st.open) setOpen(true);
if (st.notes.open) setNotes(true);
sync();
})();

</script>
<script>/* web/src/achievements.js */
/* Achievements (Main Menu → Achievements, Alt+A, route #achievements): a window over the app like Settings and My notes
   (InquireApp.modal). Two tabs: All achievements (the catalogue by category, with progress) and My Achievements (what you
   earned, newest first). Each achievement is worth Achievement Points (AP), shown as a balance in the window's header and
   on the Main Menu's Achievements slot. A toast says "Achievement unlocked" when one is earned.
   Earned + counters are per account in inqlaw.achievements.<user> (_local with no sign-in):
     { earned: { id: time }, stats: { quizRight, quizTries, streak, bestStreak, words[], maps[], themes[], days[], games, gameBest }, seeded }
   The first check for an account awards what is already done without toasts (seeded), so nobody gets a flood after updating.
   Sources: progress (InquireApp.progress), notes and folders (InquireNotes), favourites (inqlaw.favs.<user>), the theme
   (inqlaw.settings), routes (field maps and glossary words seen, days studied), and events:
     inquire:quiz  { correct }   (EngLab.quiz fires it on every answer; other kits can too)
     inquire:game  { score }     (for the Games section once it exists)
   InquireAchievements = { open(tab), close(), points(), list(), record(kind, detail), check() }. Loaded after app.js. */
(function () {
"use strict";
const A = () => window.InquireApp, NS = () => window.InquireNotes;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const user = () => (window.InquireUser ? String(window.InquireUser).toLowerCase() : "");
const key = () => "inqlaw.achievements." + (user() || "_local");
const blank = () => ({ earned: {}, stats: { quizRight: 0, quizTries: 0, streak: 0, bestStreak: 0, words: [], maps: [], themes: [], days: [], games: 0, gameBest: 0 }, seeded: false });
function load() {
  try { const v = JSON.parse(localStorage.getItem(key()) || "null"); if (v && v.earned) { const b = blank(); return Object.assign(b, v, { stats: Object.assign(b.stats, v.stats || {}) }); } } catch (e) {}
  return blank();
}
let D = load();
const save = () => { try { localStorage.setItem(key(), JSON.stringify(D)); } catch (e) {} };
// desktop: wait for sign-in so a session before it never writes into another account's file
let ready = !window.inquireDesktop;

/* ---------- the catalogue ---------- */
/* Categories and achievements are content: Inquire Law starts with none. Add categories as
   [id, name, icon, one-line description], e.g. ["lessons", "Lessons", "▤", "Master lessons in any subject."]. */
const CATS = [];
const CAT0 = ["", "", "◆", ""];
function readJ(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function facts() {
  const P = A() && A().progress ? A().progress() : { mastered: 0, bySubject: {}, byGroup: {}, fields: [] };
  const notes = NS() ? NS().list() : [], folders = NS() && NS().folders ? NS().folders() : [];
  const favs = readJ("inqlaw.favs." + (window.InquireUser || "_local"), { items: [] });
  const st = D.stats;
  return { P, notes: notes.length, linked: notes.filter(n => n.links && n.links.length).length, folders: folders.length, favs: (favs.items || []).length,
    subjects: Object.keys(P.bySubject).length, groups: Object.keys(P.byGroup).length, fieldsDone: P.fields.filter(f => f.done >= f.total).length,
    quizRight: st.quizRight, best: st.bestStreak, words: st.words.length, maps: st.maps.length, themes: st.themes.filter(t => t !== "capsuleer").length,
    days: st.days.length, games: st.games, gameBest: st.gameBest };
}
// [id, category, name, description, points, goal, value(facts)]; soon = not reachable yet
function catalogue() {
  // [id, category, name, description, points, goal, value(facts), {soon, colour}]. facts() lists every input an
  // achievement can read (mastered lessons, fields done, subjects, quiz answers and streaks, notes, maps, words, days …).
  // Example: ["first-lesson", "lessons", "First Steps", "Master your first lesson.", 10, 1, f => f.P.mastered]
  const L = [];
  return L.map(([id, cat, name, desc, pts, goal, val, o]) => Object.assign({ id, cat, name, desc, pts, goal, val }, o || {}));
}
const points = () => catalogue().reduce((t, a) => t + (D.earned[a.id] ? a.pts : 0), 0);

/* ---------- checking ---------- */
let checkT = null;
const soon = () => { clearTimeout(checkT); checkT = setTimeout(check, 250); };
function check() {
  if (!ready) return [];
  const f = facts(), fresh = [];
  catalogue().forEach(a => { if (!a.soon && !D.earned[a.id] && a.val(f) >= a.goal) { D.earned[a.id] = Date.now(); fresh.push(a); } });
  const quiet = !D.seeded; D.seeded = true;
  if (fresh.length || quiet) save();
  if (fresh.length && !quiet) { toast(fresh); window.dispatchEvent(new CustomEvent("inquire:achievements", { detail: { ids: fresh.map(a => a.id) } })); }
  if (win) draw();
  paintSlot();
  return fresh;
}
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function seen() {
  if (!ready) return;
  const st = D.stats, c = A() ? A().context() : {}, add = (arr, v) => { if (v && !arr.includes(v)) { arr.push(v); return true; } return false; };
  let ch = add(st.days, today());
  if (c.view === "math" && c.subject) ch = add(st.maps, c.subject) || ch;
  if (c.gword) ch = add(st.words, c.gword) || ch;
  const th = readJ("inqlaw.settings", {}).theme; if (th) ch = add(st.themes, th) || ch;
  if (ch) save();

async function linkFlow(x, y, c) {

<script>/* web/src/intro.js */

/* Unlock moment after a correct sign-in: the form's contents fade, a lock opens, "Welcome, <name>" appears, then the app.
   Timeline (ms from the click): fade 0–450, lock in 300–750, shackle opens at UNLOCK.open, welcome from 1300, app at UNLOCK.done.
   "inquire:unlock" fires at the start with these times, so sound can be scheduled to match (see Settings → sound, later). */
const UNLOCK = { lockIn: 300, open: 1150, welcome: 1300, done: 2300 };

/* Unlock sound: a soft ambient swell, synthesised live with Web Audio (no file), so it starts on the same frame as the animation.
   Only sine and triangle tones through a gentle low-pass and a generated reverb. The pitch keeps the "opening" shape:
   a low tone glides quickly to a mid tone, then the rise slows and drags up to a high tone that lands as the shackle opens
   (UNLOCK.open), with a soft gliding bell layered on top; a quiet, bell-like chord then blooms and fades. Off with Settings → Display → Sound effects.
   unlockSound(ac, t0) works on any BaseAudioContext, so it can also be rendered offline to a file for review. */
function unlockSound(ac, t0) {
  const T = UNLOCK.open / 1000, END = UNLOCK.done / 1000;   // the sound lasts exactly as long as the lock animation
  const LOW = 110, MID = 220, HIGH = 660, QUICK = .22;   // A2 → A3, easing up to E5
  const N = 400, curve = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1) * T;
    if (t < QUICK) { const u = t / QUICK; curve[i] = LOW * Math.pow(MID / LOW, 1 - Math.pow(1 - u, 2)); }
    else { const u = (t - QUICK) / (T - QUICK); curve[i] = MID * Math.pow(HIGH / MID, 1 - Math.pow(1 - u, 2.4)); }
  }
  // master: soft low-pass, then a dry/wet split into a generated reverb (decaying stereo noise)
  const master = ac.createGain(); master.gain.value = 1.5;
  { // smooth fade-out: a raised-cosine curve from just after the open to the end of the animation (no sudden drop at either end)
    const F0 = T + .12, n = 128, fade = new Float32Array(n);
    for (let i = 0; i < n; i++) fade[i] = 1.5 * Math.pow(.5 * (1 + Math.cos(Math.PI * i / (n - 1))), 1.6);
    master.gain.setValueCurveAtTime(fade, t0 + F0, END - F0);
  }
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1500; lp.Q.value = .5;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3; comp.attack.value = .02; comp.release.value = .3;
  master.connect(lp); lp.connect(comp); comp.connect(ac.destination);
  const rev = ac.createConvolver(), wet = ac.createGain(); wet.gain.value = .55;
  const rl = Math.ceil(ac.sampleRate * 2.6), ir = ac.createBuffer(2, rl, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let k = 0; k < rl; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / rl, 3.2); }
  rev.buffer = ir; rev.connect(wet); wet.connect(master);
  const bus = ac.createGain(); bus.connect(master); bus.connect(rev);
  const pan = (node, p) => { if (!ac.createStereoPanner) return node; const sp = ac.createStereoPanner(); sp.pan.value = p; node.connect(sp); return sp; };

  // gliding pad: the tone, a soft fifth above, a gentle octave below; slightly detuned for a slow shimmer
  const pad = ac.createGain();
  pad.gain.setValueAtTime(0, t0); pad.gain.linearRampToValueAtTime(.132, t0 + .28); pad.gain.linearRampToValueAtTime(.156, t0 + T);   // pad 40% under the first version
  pad.gain.setTargetAtTime(0, t0 + T + .05, .35);
  const trem = ac.createGain(); trem.gain.value = .9; pad.connect(trem); trem.connect(bus);
  [[1, "sine", 0, .5, -.25], [1, "triangle", 7, .22, .25], [1.5, "sine", -5, .16, .35], [.5, "sine", 0, .3, 0]].forEach(([mult, type, cents, g, p]) => {
    const o = ac.createOscillator(), v = ac.createGain(); o.type = type; o.detune.value = cents; v.gain.value = g;
    o.frequency.setValueCurveAtTime(mult === 1 ? curve : curve.map(f => f * mult), t0, T);
    // (no setValueAtTime after the curve: the curve holds its last value, and a call at its end time throws in live contexts)
    o.connect(v); pan(v, p).connect(pad); o.start(t0); o.stop(t0 + END + .15);
  });
  // slow tremolo on the pad (a breath, not a wobble)
  const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 3.2; lg.gain.value = .1;
  lfo.connect(lg); lg.connect(trem.gain); lfo.start(t0); lfo.stop(t0 + END + .15);

  // soft bell layer: struck like a felt mallet chime, gliding on the same pitch curve and octave as the pad.
  // Strikes come quickly at first and space out as the climb slows; the last one lands as the shackle opens.
  const strikes = [0, .1, .21, .34, .49, .66, .86, T];
  [[1, .045, .75], [2, .016, .45], [3, .0035, .26], [4.07, .0015, .16]].forEach(([mult, g, tau], k) => {
    const o = ac.createOscillator(), v = ac.createGain(); o.type = "sine"; v.gain.value = 0;
    o.frequency.setValueCurveAtTime(mult === 1 ? curve : curve.map(f => f * mult), t0, T);
    // (no setValueAtTime after the curve: the curve holds its last value, and a call at its end time throws in live contexts)
    strikes.forEach((st, n) => {
      const at = t0 + .02 + st, peak = g * (n === strikes.length - 1 ? 1.15 : .75 + .25 * n / strikes.length);
      v.gain.setTargetAtTime(peak, at, .006);                         // soft mallet: ~20 ms rise, no click
      v.gain.setTargetAtTime(0, at + .03, tau * (n === strikes.length - 1 ? 3 : 1));
    });
    o.connect(v); pan(v, k % 2 ? .12 : -.12).connect(bus); o.start(t0); o.stop(t0 + END + .15);
  });
  // the open: a quiet bell-like chord on the high tone (E5, B5, E6, G#6), each partial fading at its own pace
  [[HIGH, .04, 1.1, -.3], [HIGH * 1.5, .028, .9, .3], [HIGH * 2, .018, .7, -.15], [HIGH * 2.52, .01, .6, .2]].forEach(([f, g, tau, p], k) => {
    const o = ac.createOscillator(), v = ac.createGain(); o.type = "sine"; o.frequency.value = f; v.gain.value = 0;
    const at = t0 + T + k * .045;                          // a soft strum, low to high
    v.gain.setValueAtTime(0, at); v.gain.linearRampToValueAtTime(g, at + .06); v.gain.setTargetAtTime(0, at + .08, tau * .5);
    o.connect(v); pan(v, p).connect(bus); o.start(at - .01); o.stop(t0 + END + .15);
  });
  return END;
}
window.InquireUnlockSound = unlockSound; // used by tools to render a preview file
let actx = null, soundOn = false;
function primeAudio() { // called inside the click, so the browser allows sound
  const cur = window.InquireSettings ? window.InquireSettings.get() : SET;
  soundOn = cur.soundFx !== false;
  if (!soundOn || !(window.AudioContext || window.webkitAudioContext)) return;

function unlock(display) {

  window.dispatchEvent(new CustomEvent("inquire:signed-in", { detail: { user: name } }));
}
function signOut() {

/* account tools for Settings → Account */
async function changePassword(oldPw, newPw) {
  const name = window.InquireUser; if (!name) throw new Error("Nobody is signed in.");
  await checkLogin(name, oldPw).catch(() => { throw new Error("The current password is not right."); });
  const all = accounts(), id = name.toLowerCase(), salt = crypto.getRandomValues(new Uint8Array(16));

}
async function removeAccount(pw) {
  const name = window.InquireUser; if (!name) throw new Error("Nobody is signed in.");
  await checkLogin(name, pw).catch(() => { throw new Error("The password is not right."); });
  const all = accounts(); delete all[name.toLowerCase()]; ls.set(ACC_KEY, all);
  if (window.InquireKeys) { const k = InquireKeys.forUser(name); ls.del(k.progress); ls.del(k.notes); ls.del("inqlaw.achievements." + String(name).toLowerCase()); } // the account's own progress and notes go with it

}
function rename(display) {
  const name = window.InquireUser, n = cleanName(display); if (!name) throw new Error("Nobody is signed in.");
  if (!n) throw new Error("Enter a name.");
  const all = accounts(), id = name.toLowerCase(); all[id] = Object.assign({}, all[id], { display: n }); ls.set(ACC_KEY, all);
  window.InquireUserName = n; if (who) { who.textContent = n + " · sign out"; who.setAttribute("aria-label", "Signed in as " + n + ". Sign out"); }

window.InquireAccounts = { changePassword, remove: removeAccount, signOut, rename, displayName: () => window.InquireUserName || window.InquireUser || "" };

/* ---------- background video (optional) ---------- */

(function tryVideo() {

  const v = $(".inqi-video"); let missing = 0;
  const kinds = [["inq-intro.webm", "video/webm"], ["inq-intro.mp4", "video/mp4"]];

/* ---------- neuron sparks (used while there is no video) ---------- */
// Positions are in the 1672×941 source image; the plate is drawn "cover", so they are mapped the same way.
const IW = 1672, IH = 941;
const NODES = [[100, 322], [215, 415], [205, 385], [385, 235], [330, 215], [60, 290], [250, 150], [470, 175], [150, 520], [520, 640],
  [620, 700], [870, 705], [1250, 650], [1330, 520], [1385, 598], [1497, 688], [1545, 645], [1600, 720], [1450, 470], [1620, 420]];
let edges = null;
function buildEdges(rng) {
  const E = [];

      if (E.some(e => (e.a === i && e.b === o.j) || (e.a === o.j && e.b === i))) return;
      const b = NODES[o.j], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, nx = -(b[1] - a[1]), ny = b[0] - a[0], k = (rng() - .5) * .5;

    });
  });

}

  const fires = [], sigs = [];

  if (!edges) edges = buildEdges(rnd);
  const size = () => { dpr = Math.min(window.devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; };
  size(); addEventListener("resize", size);

  const bez = (e, t) => { const a = NODES[e.a], b = NODES[e.b], u = 1 - t; return [u * u * a[0] + 2 * u * t * e.cx + t * t * b[0], u * u * a[1] + 2 * u * t * e.cy + t * t * b[1]]; };

    const out = edges.filter(e => e.a === i || e.b === i).sort(() => rnd() - .5).slice(0, 1 + (rnd() < .4));
    out.forEach(e => sigs.push({ e, fwd: e.a === i, t0: now + 120, dur: 900 + rnd() * 900, hit: false }));
  }

    if (!alive) return;

    if (document.hidden) { last = now; return; }
    if (now >= next) { spawn(now); next = now + 380 + rnd() * 1100; }
    cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H);
    cx.globalCompositeOperation = "lighter"; cx.lineCap = "round";

      const s = sigs[k], p = (now - s.t0) / s.dur;

      if (p >= 1) { if (!s.hit) fire(s.fwd ? s.e.b : s.e.a, .45, now); sigs.splice(k, 1); continue; }
      const t1 = s.fwd ? p : 1 - p, tail = s.fwd ? Math.max(0, p - .22) : Math.min(1, 1 - p + .22);
      const env = Math.sin(Math.PI * p);
      cx.beginPath();
      for (let n = 0; n <= 10; n++) { const t = tail + (t1 - tail) * n / 10, q = bez(s.e, t), m = map(q[0], q[1]); n ? cx.lineTo(m[0], m[1]) : cx.moveTo(m[0], m[1]); }

      cx.strokeStyle = `rgba(160,235,255,${.55 * env})`; cx.lineWidth = Math.max(1, 1.5 * sc); cx.shadowColor = "rgba(92,200,224,.9)"; cx.shadowBlur = 8 * sc; cx.stroke();
    }

  fxStop = () => { alive = false; cancelAnimationFrame(raf); removeEventListener("resize", size); cx.clearRect(0, 0, W, H); fxStop = null; };
}

/* ---------- go ---------- */
/* "Remember my username": kept in inqlaw.rememberedUser until the box is unticked (signing out keeps it).
   Unticking forgets it at once; ticking with a username typed remembers it at once (sign-in then stores the account's own spelling). */

fillRemembered();
window.InquireIntro = { skip, isOpen: () => !done };
play();
})();

<script>/* web/src/settings.js */

   Shortcuts are rebindable (Shortcuts tab): KEYACTS below, combos like "Alt+KeyN" (modifiers + KeyboardEvent.code) in

"use strict";

  delete o.textScale;

  { id: "obsidian", fam: "Dark", name: "Obsidian", bg: "#050506", surface: "#151517", accent: "#F2B84B", tint: "#8A6A22", text: "#E8E4DC", note: "Neutral black, brass trim" },
  { id: "old-growth", fam: "Nature", name: "Old Growth", bg: "#060D09", surface: "#11211A", accent: "#7BD88F", tint: "#3F7A4F", text: "#DCEBDF", note: "Deep forest canopy" },
  { id: "moss", fam: "Nature", name: "Moss & Lichen", bg: "#0B0F08", surface: "#1C2515", accent: "#B5D65A", tint: "#C9B458", text: "#E5EAD8", note: "Olive, moss and sunlit lichen" },
  { id: "abyssal", fam: "Water", name: "Abyssal", bg: "#030B14", surface: "#0B1F32", accent: "#4FC3F7", tint: "#2C5DA8", text: "#D8E8F4", note: "Open ocean at depth" },
  { id: "tidepool", fam: "Water", name: "Tidepool", bg: "#04110F", surface: "#0D2927", accent: "#5EE0C8", tint: "#3B8FA8", text: "#D6EFEA", note: "Teal shallows and sea glass" },
  { id: "ember", fam: "Earth", name: "Ember", bg: "#0F0606", surface: "#251111", accent: "#E5675B", tint: "#F2B84B", text: "#F1E0DB", note: "Banked coals, warm red" },
  { id: "canyon", fam: "Earth", name: "Canyon Clay", bg: "#120B07", surface: "#2B1B12", accent: "#E0975A", tint: "#B5653A", text: "#F1E4D7", note: "Terracotta and desert stone" },
  { id: "mist", fam: "Airy", name: "Morning Mist", bg: "#1D2734", surface: "#2C3B50", accent: "#A6D8F4", tint: "#E3EEF8", text: "#F0F4FA", muted: "#B6C3D5", faint: "#8796AC", note: "Soft blue-grey, lighter" },
  { id: "dusk", fam: "Airy", name: "Lavender Dusk", bg: "#231E31", surface: "#372F4C", accent: "#D4BBFF", tint: "#F3C6E0", text: "#F3EFFB", muted: "#C0B6D6", faint: "#9187A9", note: "Pale violet evening sky" },
  { id: "frost", fam: "Glass", name: "Frosted Glass", bg: "#0A1424", surface: "#1C2D48", accent: "#C4E8FF", tint: "#B49BFF", glow: "#5CC8E0", glass: true, note: "Clear panels over blue light" },
  { id: "aurora", fam: "Glass", name: "Aurora Glass", bg: "#06100F", surface: "#15282B", accent: "#9CF0C8", tint: "#D97AE6", glow: "#4FD1A5", glass: true, note: "Smoked glass, northern lights" }

const FAMS = [["Dark", "Darker tones"], ["Nature", "Nature tones"], ["Water", "Watery tones"], ["Earth", "Red & earthy tones"], ["Airy", "Lighter, airy tones"], ["Glass", "Glassy tones"]];
const VARS = ["--void", "--ink", "--panel", "--panel-2", "--panel-3", "--line", "--line-2", "--text", "--muted", "--faint", "--tint-1", "--tint-2",
  "--chrome-1", "--chrome-2", "--win-1", "--win-2", "--slot-1", "--slot-2", "--slot-h1", "--slot-h2", "--wash", "--sky", "--stage-sky", "--frame", "--blur", "--glow",
  "--node-1", "--node-2", "--node-line", "--node-line-2", "--node-text", "--orb-1", "--orb-2", "--era-1", "--era-2"];

    "--void": t.bg, "--ink": mix(t.bg, t.surface, .3), "--panel": t.surface, "--panel-2": panel2, "--panel-3": panel3,
    "--line": mix(t.surface, text, .13), "--line-2": mix(t.surface, text, .23), "--text": text,
    "--muted": t.muted || mix(text, t.bg, .38), "--faint": t.faint || mix(text, t.bg, .6),
    "--tint-1": rgba(t.glow || t.accent, g ? .34 : .11), "--tint-2": rgba(t.tint, g ? .3 : .09),
    "--chrome-1": g ? rgba(mix(t.bg, t.surface, .6), .55) : mix(t.bg, t.surface, .6), "--chrome-2": g ? rgba(mix(t.bg, t.surface, .2), .6) : mix(t.bg, t.surface, .2),
    "--win-1": rgba(panel2, al), "--win-2": rgba(mix(t.bg, t.surface, .4), al + .02),
    "--slot-1": rgba(panel3, g ? .45 : .85), "--slot-2": rgba(mix(t.bg, t.surface, .5), g ? .5 : .9),
    "--slot-h1": rgba(mix(panel3, t.accent, .14), g ? .6 : .9), "--slot-h2": rgba(mix(t.bg, t.surface, .55), g ? .6 : .95),
    "--wash": rgba(mix(t.bg, t.surface, .3), g ? .45 : .75), "--sky": mix(mix(t.bg, t.surface, .3), t.accent, .05), "--stage-sky": mix(panel2, t.accent, .05),
    "--frame": t.accent, "--blur": g ? "14px" : "0px", "--glow": rgba(t.accent, .35),
    // neutral tree nodes (locked / planned), node orbs and the era bar take the theme's surface, lightly tinted with its accent
    "--node-1": mix(mix(t.surface, text, .06), t.accent, .05), "--node-2": mix(t.bg, t.surface, .7), "--node-line": mix(mix(t.surface, text, .22), t.accent, .1),
    "--node-line-2": mix(mix(t.surface, text, .3), t.accent, .12), "--node-text": mix(text, t.surface, .3),
    "--orb-1": mix(mix(t.surface, text, .17), t.accent, .14), "--orb-2": mix(t.bg, t.surface, .35),
    "--era-1": rgba(mix(mix(t.surface, text, .05), t.accent, .1), g ? .8 : .95), "--era-2": rgba(mix(t.bg, t.surface, .6), g ? .8 : .95)
  };
}
/* Your colours (Appearance → Your colours): S.custom = { bg, surface, accent, glass } is the live "custom" theme while you
   pick; S.presets = 3 × (null | { name, bg, surface, accent, glass }) are saved as themes "preset-1" … "preset-3".
   Text, lines and the second glow are derived; a light secondary colour gets dark text. */
const lum = c => { const [r, g, b] = hex(c).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
function userTheme(c, id, name) {
  if (!c || !hexOk(c.bg) || !hexOk(c.surface) || !hexOk(c.accent)) return null;
  const light = lum(c.surface) > .4;
  return { id, fam: "Custom", name, bg: c.bg, surface: c.surface, accent: c.accent, tint: mix(c.accent, light ? "#000000" : c.surface, .45), glass: !!c.glass,
    text: light ? "#151A22" : lum(c.surface) > .18 ? "#F6F8FB" : undefined, note: id === "custom" ? "Not saved yet" : "Your preset" };
}
function findTheme(id) {

  if (m) { const p = S.presets[m[1] - 1]; return userTheme(p, id, p ? p.name : "") || THEMES[0]; }
  if (id === "custom") return userTheme(S.custom, "custom", "Custom") || THEMES[0];

/* Invert scroll: every wheel event is swapped for a copy with deltaY reversed. Handlers that take the wheel themselves
   (tree panning, labs) get the copy; if none of them cancels it, the nearest scrollable box is scrolled by hand. */

    const canX = dx && /(auto|scroll|overlay)/.test(cs.overflowX) && n.scrollWidth > n.clientWidth + 1 && (dx < 0 ? n.scrollLeft > 0 : n.scrollLeft + n.clientWidth < n.scrollWidth - 1);
    if (canY || canX) { n.scrollBy({ top: canY ? dy : 0, left: canX ? dx : 0 }); return; }
  }
