/* Intro / sign-in screen (web/src/intro.js). Same look as the app: void black, cyan accent, Saira caps, clipped corners.
   Sequence (classes on #intro): is-bg → is-logo → is-form. Everything is skipped for reduced motion or a click/key press. */
.inqi{position:fixed;inset:0;z-index:1000;background:#03060B;color:var(--text);overflow:hidden;display:grid;place-items:center;
  opacity:1;transition:opacity .9s ease}
.inqi.is-leaving{opacity:0;pointer-events:none}
.inqi[hidden]{display:none!important}

/* background world: clean plate (or video) + neuron sparks, all drifting together */
.inqi-world{position:absolute;inset:-3%;transform-origin:50% 45%;opacity:0;transition:opacity 2.6s ease 0.2s;
  animation:intro-drift 46s ease-in-out infinite alternate}
.inqi.is-bg .inqi-world{opacity:1}
.inqi-plate,.inqi-video,.inqi-fx{position:absolute;inset:0;width:100%;height:100%}
.inqi-plate{background:#050a14 url("intro/inq-intro-clean.jpg") center/cover no-repeat}
.inqi-video{object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.inqi.has-video .inqi-video{opacity:1}
.inqi-fx{pointer-events:none}
.inqi.has-video .inqi-fx{display:none}
@keyframes intro-drift{from{transform:scale(1.02) translate3d(-.6%,.3%,0)}to{transform:scale(1.08) translate3d(.8%,-.5%,0)}}
.inqi-shade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 55% at 50% 48%,rgba(3,6,11,.55),transparent 70%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(3,6,11,.7))}

/* centre column: logo, then the form */
.inqi-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3.4vh,30px);width:min(420px,calc(100% - 32px));
  padding:16px 0;max-height:100%}
.inqi-logo{display:block;height:min(34vh,320px);width:auto;max-width:78vw;mix-blend-mode:screen;opacity:0;transform:scale(.97);filter:blur(6px);
  transition:opacity 3.4s ease,transform 4.2s cubic-bezier(.2,.7,.2,1),filter 3.4s ease}
.inqi.is-logo .inqi-logo{opacity:1;transform:none;filter:none}
/* Inquire Law: "LAW" under the Inquire lockup until Inquire Law has its own logo */
.inqi-brand{display:flex;flex-direction:column;align-items:center}
.inqi-sub{margin-top:6px;font:600 clamp(14px,2.4vh,22px)/1 "Saira Semi Condensed",sans-serif;letter-spacing:.9em;padding-left:.9em;text-transform:uppercase;
  color:#cfd8e6;text-shadow:0 0 14px rgba(150,190,255,.45);opacity:0;filter:blur(6px);transition:opacity 3.4s ease 1.2s,filter 3.4s ease 1.2s}
.inqi.is-logo .inqi-sub{opacity:.92;filter:none}

.inqi-form{width:100%;opacity:0;transform:translateY(14px);visibility:hidden;
  transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.7,.2,1),visibility 0s linear 1.2s;
  background:linear-gradient(180deg,rgba(15,22,36,.78),rgba(8,12,20,.82));border:1px solid var(--line-2);border-top-color:var(--frame);
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:18px 22px 16px}
.inqi.is-form .inqi-form{opacity:1;transform:none;visibility:visible;transition-delay:0s}
.inqi-tabs{display:flex;gap:18px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.inqi-tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:2px 0 8px;cursor:pointer;
  font:600 12px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.inqi-tab:hover{color:var(--text)}
.inqi-tab[aria-selected="true"]{color:var(--frame);border-bottom-color:var(--frame)}
.inqi-field{display:block;margin:0 0 12px}
.inqi-field>span{display:block;font:600 11px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.inqi-field input{width:100%;background:rgba(7,10,16,.85);color:var(--text);border:1px solid var(--line-2);border-radius:2px;
  padding:9px 11px;font:400 15px/1.3 var(--sans);transition:border-color .15s,box-shadow .15s}
.inqi-field input:hover{border-color:var(--faint)}
.inqi-field input:focus{outline:none;border-color:var(--frame);box-shadow:0 0 0 1px var(--frame),0 0 14px var(--glow)}
.inqi-field input[aria-invalid="true"]{border-color:var(--red)}
.inqi-check{display:flex;align-items:center;gap:8px;margin:2px 0 14px;font:500 13px/1 var(--sans);color:var(--muted);cursor:pointer}
.inqi-check input{accent-color:var(--frame);width:15px;height:15px;margin:0}
.inqi-go{width:100%;cursor:pointer;padding:11px 14px;border:1px solid var(--frame);color:var(--frame);background:color-mix(in srgb,var(--frame) 10%,transparent);
  font:600 13px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;border-radius:2px;transition:background .15s,box-shadow .15s,color .15s}
.inqi-go:hover:not(:disabled){background:color-mix(in srgb,var(--frame) 20%,transparent);box-shadow:0 0 18px var(--glow);color:#fff}
.inqi-go:disabled{opacity:.55;cursor:progress}
.inqi-msg{min-height:20px;margin:10px 0 0;font:500 13px/1.4 var(--sans);color:var(--red)}
.inqi-msg.ok{color:var(--green)}
.inqi-note{margin:6px 0 0;font:400 12px/1.45 var(--sans);color:var(--faint)}
.inqi-skip{position:absolute;right:18px;bottom:16px;background:none;border:0;cursor:pointer;color:var(--faint);
  font:600 11px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;padding:6px;transition:opacity .6s}
.inqi-skip:hover{color:var(--text)}
.inqi.is-form .inqi-skip{opacity:0;pointer-events:none}
.inqi.is-fast .inqi-world,.inqi.is-fast .inqi-logo,.inqi.is-fast .inqi-sub,.inqi.is-fast .inqi-form{transition-duration:.01s!important;transition-delay:0s!important}

/* signed-in chip in the top bar */
.whoami{background:none;border:1px solid var(--line-2);color:var(--muted);cursor:pointer;padding:4px 10px;border-radius:2px;
  font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.whoami:hover{color:var(--text);border-color:var(--frame)}

@media (max-height:640px){.inqi-logo{height:26vh}.inqi-sub{margin-top:4px}.inqi-form{padding:12px 18px 12px}.inqi-field{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){
  .inqi-world{animation:none}
  .inqi-world,.inqi-logo,.inqi-sub,.inqi-form{transition-duration:.01s!important;transition-delay:0s!important}
  .inqi-logo{filter:none;transform:none}
}

/* sign-in footer links (Settings, EULA) and the social corner */
.inqi-links{display:flex;justify-content:space-between;gap:12px;margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.inqi-lnk{background:none;border:0;padding:2px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  font:600 11px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.inqi-lnk:hover{color:var(--frame)}
.inqi-lnk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.inqi-note .inqi-lnk{font:inherit;letter-spacing:0;text-transform:none;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.inqi-corner{position:absolute;left:18px;bottom:16px;display:flex;gap:8px;opacity:0;transition:opacity 1.2s ease .3s}
.inqi.is-form .inqi-corner{opacity:1}
.inqi-soc{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--muted);background:rgba(7,10,16,.55);
  clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px));transition:color .15s,border-color .15s,box-shadow .15s}
a.inqi-soc:hover{color:#fff;border-color:var(--frame);box-shadow:0 0 14px var(--glow)}
.inqi-soc svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.inqi-soc.off{opacity:.38;cursor:default}
@media (max-width:520px){.inqi-corner{left:12px;bottom:10px}.inqi-soc{width:30px;height:30px}}

/* unlock moment after sign-in (intro.js unlock()) */
.inqi-form{position:relative}
.inqi-form>*:not(.inqi-unlock){transition:opacity .45s ease}
.inqi-form.is-unlocking>*:not(.inqi-unlock){opacity:0;pointer-events:none}
.inqi-unlock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;opacity:0;visibility:hidden}
.inqi-form.is-unlocking .inqi-unlock{opacity:1;visibility:visible;transition:opacity .45s ease .3s}
.inqi-lock{width:104px;height:auto;overflow:visible;transform:scale(.9);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1) .3s,opacity .45s ease .3s}
.inqi-form.is-unlocking .inqi-lock{transform:none;opacity:1}
.inqi-ring{fill:none;stroke:var(--frame);stroke-width:1.5;opacity:0;transform-origin:60px 84px;transform:scale(.7)}
.inqi-shackle{fill:none;stroke:url(#inqi-lk);stroke-width:9;stroke-linecap:round;transform-origin:86px 66px}
.inqi-body{fill:url(#inqi-lk);stroke:rgba(255,255,255,.5);stroke-width:1}
.inqi-hole{fill:#0A1220;transition:fill .4s ease}
.inqi-glint{stroke:rgba(255,255,255,.8);stroke-width:1.5;stroke-linecap:round;opacity:.5}
/* the key turns (small shake), then the shackle springs up and swings open */
.inqi-form.is-unlocking .inqi-lock{animation:inqi-turn .3s ease-in-out .85s 1}
.inqi-form.is-open .inqi-shackle{animation:inqi-open .55s cubic-bezier(.3,1.5,.5,1) forwards}
.inqi-form.is-open .inqi-hole{fill:var(--frame)}
.inqi-form.is-open .inqi-ring{animation:inqi-ring .9s ease-out forwards}
.inqi-form.is-open .inqi-lock{filter:drop-shadow(0 0 14px var(--glow))}
@keyframes inqi-turn{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes inqi-open{0%{transform:none}55%{transform:translateY(-16px)}100%{transform:translateY(-14px) rotate(28deg)}}
@keyframes inqi-ring{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.35)}}
.inqi-welcome{margin:0;font:400 24px/1.2 var(--math);color:var(--text);opacity:0;transform:translateY(6px);transition:opacity .6s ease,transform .6s ease;text-align:center;padding:0 12px}
.inqi-welcome b{font-weight:600;color:#fff;text-shadow:0 0 14px var(--glow)}
.inqi-form.is-open .inqi-welcome{opacity:1;transform:none;transition-delay:.15s}
.inqi-msg.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0}
@media (prefers-reduced-motion:reduce){.inqi-form.is-open .inqi-shackle{animation:none;transform:translateY(-14px) rotate(28deg)}.inqi-form.is-unlocking .inqi-lock{animation:none}}
:root[data-reduce-motion] .inqi-form.is-open .inqi-shackle{animation:none;transform:translateY(-14px) rotate(28deg)}

/* Settings window (web/src/settings.js) + top-bar gear + theme helpers. */
.gear{background:none;border:1px solid var(--line-2);color:var(--muted);cursor:pointer;width:30px;height:26px;display:grid;place-items:center;border-radius:2px;padding:0;flex:none}
.gear:hover{color:var(--text);border-color:var(--frame)}
.gear svg{width:16px;height:16px}
.topstat+.gear{margin-left:0}

/* the app behind the window fogs and eases back */
#app,.inqi-stage,.inqi-corner{transition:filter .35s ease,transform .35s ease}
body.set-open #app,body.set-open .inqi-stage,body.set-open .inqi-corner,body.ask-open #app,body.mw-open #app{filter:blur(3px) saturate(.75) brightness(.72);transform:scale(.985)}
.set-ov{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:16px;
  background:radial-gradient(ellipse at 50% 40%,rgba(200,220,255,.06),rgba(3,6,11,.55));opacity:0;transition:opacity .3s ease}
body.set-open .set-ov{opacity:1}
.set-win{width:min(880px,100%);height:min(640px,calc(100dvh - 32px));display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03),0 0 40px var(--glow);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transform:translateY(10px) scale(.98);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
body.set-open .set-win{transform:none}
.set-win.is-doc{width:min(760px,100%)}
.set-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),transparent)}
.set-h .dot{width:7px;height:7px;background:var(--frame);box-shadow:0 0 8px var(--frame)}
.set-h h2{margin:0;font:600 14px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--text)}
.set-x{margin-left:auto;background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;width:30px;height:30px;font-size:15px;border-radius:2px}
.set-x:hover{color:var(--text);border-color:var(--line-2)}
.set-body{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr)}
.set-win.is-doc .set-body{grid-template-columns:minmax(0,1fr)}
.set-tabs{display:flex;flex-direction:column;gap:2px;padding:12px 8px;border-right:1px solid var(--line);background:rgba(0,0,0,.12)}
.set-tab{background:none;border:0;text-align:left;cursor:pointer;padding:9px 12px;font:600 12px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);position:relative}
.set-tab:hover{color:var(--text);background:rgba(255,255,255,.03)}
.set-tab[aria-selected="true"]{color:var(--text);background:linear-gradient(90deg,color-mix(in srgb,var(--frame) 18%,transparent),transparent)}
.set-tab[aria-selected="true"]::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;background:var(--frame);box-shadow:0 0 10px var(--frame)}
.set-pane{overflow:auto;padding:18px 22px 24px;outline:none}
.set-pane h3{margin:0 0 4px;font:600 12px/1.2 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--text)}
.set-lede{margin:0 0 18px;color:var(--muted);font-size:14px;max-width:62ch}
.set-lede b{color:var(--text);font-weight:600}
.set-small{font-size:12px;color:var(--faint);margin:16px 0 0}
.set-msg{min-height:20px;margin:12px 0 0;font:500 13px/1.4 var(--sans);color:var(--red)}
.set-msg.ok{color:var(--green)}
.set-row{margin:18px 0 0}

/* theme squares */
.set-thfam{margin:0 0 16px}
.set-thfam>h3{color:var(--muted);margin-bottom:8px}
.set-thgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.set-th{display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:12px;row-gap:2px;align-items:start;text-align:left;cursor:pointer;
  padding:10px;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:3px;transition:border-color .15s,background .15s}
.set-th:hover{border-color:var(--line-2);background:rgba(255,255,255,.03)}
.set-th[aria-checked="true"]{border-color:var(--frame);box-shadow:0 0 0 1px var(--frame),0 0 16px var(--glow)}
.set-sw{grid-row:1/4;width:64px;height:64px;position:relative;display:block;background:var(--p);border:1px solid rgba(255,255,255,.14);overflow:hidden}
.set-sw i{position:absolute;display:block}
.set-swp{inset:0;background:radial-gradient(70% 60% at 85% 0%,color-mix(in srgb,var(--d) 30%,transparent),transparent 70%),radial-gradient(70% 60% at 0% 100%,color-mix(in srgb,var(--t) 22%,transparent),transparent 70%)}
.set-sws{left:12px;top:14px;right:8px;bottom:8px;background:var(--s);border:1px solid color-mix(in srgb,var(--s) 70%,#fff 30%)}
.set-swd{left:12px;top:14px;width:10px;height:10px;border-left:2px solid var(--d);border-top:2px solid var(--d);box-shadow:-2px -2px 8px color-mix(in srgb,var(--d) 60%,transparent)}
.set-swd::after{content:"";position:absolute;left:8px;top:8px;width:30px;height:3px;background:var(--d);opacity:.9}
.set-sw.set-glass .set-swp{background:radial-gradient(80% 70% at 85% 10%,color-mix(in srgb,var(--t) 70%,transparent),transparent 70%),radial-gradient(80% 70% at 10% 95%,color-mix(in srgb,var(--d) 55%,transparent),transparent 70%)}
.set-sw.set-glass .set-sws{background:color-mix(in srgb,var(--s) 45%,transparent);backdrop-filter:blur(6px);border-color:rgba(255,255,255,.35)}
.set-thname{font:600 13px/1.2 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--text);margin-top:2px}
.set-thnote{font-size:12px;line-height:1.35;color:var(--muted)}
.set-thchips{display:flex;gap:4px;align-self:end}
.set-thchips i{width:14px;height:14px;border:1px solid rgba(255,255,255,.25)}

/* rows, toggles, segmented control, forms */
.set-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-item p{margin:0;font-size:13px;color:var(--muted)}
.set-item>:last-child{flex:none}
.set-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
.set-seg button{background:none;border:0;border-left:1px solid var(--line-2);padding:7px 10px;cursor:pointer;font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.set-seg button:first-child{border-left:0}
.set-seg button[aria-checked="true"]{background:var(--frame);color:var(--ink)}
.set-tog{position:relative;width:42px;height:22px;cursor:pointer;display:inline-block}
.set-tog input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.set-tog span{position:absolute;inset:0;border:1px solid var(--line-2);border-radius:11px;background:var(--ink);transition:background .2s,border-color .2s}
.set-tog span::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.set-tog input:checked+span{background:color-mix(in srgb,var(--frame) 30%,var(--ink));border-color:var(--frame)}
.set-tog input:checked+span::after{transform:translateX(20px);background:var(--frame)}
.set-tog input:focus-visible+span{outline:2px solid var(--frame);outline-offset:2px}
.set-form{display:grid;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);max-width:420px}
.set-form p{margin:0;font-size:13px;color:var(--muted)}
.set-form label{display:grid;gap:5px;font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.set-form input{background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:8px 10px;font:400 14px/1.3 var(--sans);text-transform:none;letter-spacing:0}
.set-form input:focus{outline:none;border-color:var(--frame);box-shadow:0 0 0 1px var(--frame)}
.set-form .btn-s{justify-self:start}
.btn-s.warn{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.btn-s.warn:hover{background:color-mix(in srgb,var(--red) 15%,transparent)}
.btn-s.file{display:inline-block}
a.btn-s{text-decoration:none;display:inline-block}

/* documents (EULA) */
.set-doc{max-width:66ch;font-size:14px;line-height:1.65}
.set-doc h3{margin:18px 0 6px}
.set-doc p{margin:0 0 10px;color:var(--text)}

@media (max-width:700px){
  .set-ov{padding:8px}
  .set-win{height:calc(100dvh - 16px)}
  .set-body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .set-tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .set-tab{white-space:nowrap;padding:8px 10px}
  .set-tab[aria-selected="true"]::before{left:6px;right:6px;top:auto;bottom:0;width:auto;height:2px}
  .set-pane{padding:14px 14px 20px}
  .set-item{flex-wrap:wrap}
  .set-thgrid{grid-template-columns:minmax(0,1fr)}
}

/* Reduce motion (Settings → Display) */
:root[data-reduce-motion] *,:root[data-reduce-motion] *::before,:root[data-reduce-motion] *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}

/* top-bar Settings button (word, not an icon) */
.gear{width:auto;height:26px;padding:0 10px;font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}

/* faders (Display → Text size / Interface size) */
.set-faditem{flex-direction:column;align-items:stretch;gap:12px}
.set-faditem>:last-child{flex:initial}
.set-fader{width:min(520px,100%);padding-top:2px}
.set-fadrow{display:flex;align-items:flex-start;gap:8px}
.set-fadrow>.set-fstep,.set-fadrow>.set-fval,.set-fadrow>.set-freset{margin-top:0;align-self:flex-start;height:22px}
.set-fadrow>.set-fval,.set-fadrow>.set-freset{display:grid;place-items:center}
.set-fstep{flex:none;width:24px;height:24px;display:grid;place-items:center;padding:0;background:none;border:1px solid var(--line-2);border-radius:2px;color:var(--muted);cursor:pointer;font:600 14px/1 var(--ui)}
.set-fstep:hover{color:var(--text);border-color:var(--frame)}
.set-fval{flex:none;min-width:44px;text-align:right;font:600 12px/1 var(--mono,var(--ui));color:var(--text);letter-spacing:.04em}
.set-freset{flex:none;background:none;border:0;padding:4px 2px;cursor:pointer;font:600 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.set-freset:hover:not(:disabled){color:var(--frame)}
.set-freset:disabled{opacity:.35;cursor:default}
.set-fader input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;margin:8px 0;background:transparent;cursor:pointer}
.set-fader input[type=range]::-webkit-slider-runnable-track{height:4px;border:1px solid var(--line-2);border-radius:0;
  background:linear-gradient(90deg,var(--frame) var(--f),transparent var(--f)),repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--n) - 1px),var(--line-2) calc(100%/var(--n) - 1px) calc(100%/var(--n))),var(--ink);
  box-shadow:0 0 8px color-mix(in srgb,var(--frame) 25%,transparent)}
.set-fader input[type=range]::-moz-range-track{height:4px;border:1px solid var(--line-2);background:var(--ink)}
.set-fader input[type=range]::-moz-range-progress{height:4px;background:var(--frame)}
.set-fader input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:20px;margin-top:-9px;background:var(--panel-3);border:1px solid var(--frame);border-radius:1px;box-shadow:0 0 10px var(--glow),inset 0 0 0 2px var(--ink)}
.set-fader input[type=range]::-moz-range-thumb{width:10px;height:18px;background:var(--panel-3);border:1px solid var(--frame);border-radius:1px;box-shadow:0 0 10px var(--glow)}
.set-fader input[type=range]:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.set-frange{flex:1;min-width:0;display:flex;flex-direction:column}
.set-fmarks{position:relative;height:12px;margin:6px 6px 0}
.set-fmarks span{position:absolute;transform:translateX(-50%);font:500 10px/1 var(--ui);letter-spacing:.06em;color:var(--faint)}

/* Shortcuts */
.set-keys{margin:14px 0 0;display:grid;gap:0}
.set-keys>div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.set-keys dt{display:flex;gap:4px;flex-wrap:wrap}
.set-keys dd{margin:0;font-size:13px;color:var(--muted)}
.set-kbd{display:inline-block;min-width:26px;padding:4px 7px;text-align:center;font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--text);
  background:var(--panel-2);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px}
@media (max-width:700px){ .set-fader{width:100%} .set-keys>div{grid-template-columns:minmax(0,1fr);gap:6px} }

/* Usage: scroll test box */
.set-scrolltry{margin-top:14px;height:120px;overflow:auto;border:1px dashed var(--line-2);border-radius:2px;padding:4px 12px;background:rgba(0,0,0,.15);font-size:13px;color:var(--muted)}
.set-scrolltry p{margin:6px 0}
.set-scrolltry:focus-visible{outline:2px solid var(--frame);outline-offset:2px}

/* Appearance → Note links */
.set-lcitem{align-items:flex-start}
.set-lcdemo{display:block;margin-top:6px;color:var(--text)}
.set-lc{display:flex;flex-wrap:wrap;gap:6px;max-width:230px;justify-content:flex-end}
.set-lcs{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-2);background:var(--c);cursor:pointer;padding:0;position:relative;overflow:hidden}
.set-lcs[aria-checked="true"]{box-shadow:0 0 0 2px var(--text),0 0 12px var(--c)}
.set-lcs:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.set-lcpick{background:conic-gradient(#F07CA0,#F2B84B,#7BD88F,#5CC8E0,#B49BFF,#F07CA0);display:inline-block}
.set-lcpick input{position:absolute;inset:-4px;opacity:0;cursor:pointer;width:40px;height:40px}

/* Updates in About: Install & Relaunch from Settings (sign-in screen or app) */
.set-upd-btns:empty{display:none}
.set-upd.is-ready h3{color:var(--green)}
.set-upd .btn{padding:8px 12px;white-space:nowrap}
.set-tab.has-upd::after{content:"";display:inline-block;width:7px;height:7px;margin-left:8px;vertical-align:middle;background:var(--green);box-shadow:0 0 8px var(--green)}

/* small dialog in the same style (askText in app.js: New note title) */
.ask-ov{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:16px;
  background:radial-gradient(ellipse at 50% 40%,rgba(200,220,255,.06),rgba(3,6,11,.55));opacity:0;transition:opacity .25s ease}
body.ask-open .ask-ov{opacity:1}
.ask-ov.out{opacity:0}
.ask-win{width:min(460px,100%);margin:0;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03),0 0 40px var(--glow);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transform:translateY(10px) scale(.98);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
body.ask-open .ask-win{transform:none}
.ask-body{display:grid;gap:10px;padding:18px 20px 20px}
.ask-l{font:600 12px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ask-in{background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:10px 12px;font:400 16px/1.3 var(--sans);outline:none}
.ask-in:focus{border-color:var(--frame);box-shadow:0 0 0 1px var(--frame)}
.ask-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.ask-btns .btn{padding:9px 14px}
.set-msg.warn{color:var(--amber)}

/* rebindable shortcuts (Shortcuts tab) */
.set-binds{display:grid;border-top:1px solid var(--line)}
.set-bind{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.set-bind h3{margin:0}
.set-bind p{margin:3px 0 0;font-size:12px;color:var(--faint)}
.set-bk{min-width:120px;min-height:32px;display:flex;gap:4px;justify-content:center;align-items:center;padding:4px 8px;cursor:pointer;background:var(--panel-2);border:1px solid var(--line-2);border-radius:2px}
.set-bk:hover,.set-bk:focus-visible{border-color:var(--frame);outline:none}
.set-bk.off .set-kbd{color:var(--faint);border-style:dashed}
.set-bk.rec{border-color:var(--frame);box-shadow:0 0 0 1px var(--frame),0 0 14px var(--glow)}
.set-rec{font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--frame);animation:dk-gem 1.2s ease-in-out infinite}
.set-bx{width:30px;height:30px;background:none;border:1px solid transparent;border-radius:2px;color:var(--muted);cursor:pointer;font-size:15px}
.set-bx:hover:not(:disabled){color:var(--text);border-color:var(--line-2)}
.set-bx:disabled{opacity:.25;cursor:default}
.set-fixh{margin:26px 0 0!important}

/* Your colours + presets (Appearance) */
.set-cl{margin:0 0 12px;font-size:13px;color:var(--muted);max-width:66ch}
.set-cl b{color:var(--text);font-weight:600}
.set-cedit{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:start;padding:14px;border:1px solid var(--line);background:rgba(0,0,0,.18);border-radius:3px}
.set-cprev .set-sw{width:96px;height:96px}
.set-cfields{display:grid;gap:8px}
.set-cf{display:grid;grid-template-columns:150px 40px 96px;gap:10px;align-items:center}
.set-cfl{font:600 12px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text);display:flex;flex-direction:column;gap:3px}
.set-cfl small,.set-cglass small{font:400 12px/1.2 var(--sans);letter-spacing:0;text-transform:none;color:var(--faint)}
.set-cpick{width:40px;height:30px;border-radius:3px;border:1px solid var(--line-2);background:var(--c);position:relative;cursor:pointer;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.set-cpick:hover,.set-cpick:focus-within{border-color:var(--frame)}
.set-cpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.set-hex{width:96px;box-sizing:border-box;padding:6px 8px;font:500 12.5px/1 var(--mono);letter-spacing:.06em;color:var(--text);background:var(--ink);border:1px solid var(--line-2);border-radius:2px}
.set-hex:focus{outline:none;border-color:var(--frame)}
.set-hex.bad{border-color:var(--red)}
.set-cglass{display:flex;align-items:center;gap:8px;font:600 12px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text);margin-top:4px;cursor:pointer}
.set-cglass input{accent-color:var(--frame)}
.set-csave{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0}
.set-cname{flex:1 1 180px;max-width:240px;padding:7px 10px;font:400 13px/1.2 var(--sans);color:var(--text);background:var(--ink);border:1px solid var(--line-2);border-radius:2px}
.set-cname:focus{outline:none;border-color:var(--frame)}
.set-cto{font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-left:4px}
.set-csave .set-msg{flex-basis:100%;margin:2px 0 0;min-height:0}
.set-presets{grid-template-columns:repeat(3,minmax(0,1fr))}
.set-pwrap{position:relative;display:grid}
.set-pwrap>.set-th{width:100%}
.set-pwrap>button.set-th{padding-right:36px}
.set-pempty{cursor:default;border-style:dashed;background:transparent}
.set-pempty:hover{border-color:var(--line);background:transparent}
.set-swempty{display:grid!important;place-items:center;background:transparent!important;border-style:dashed!important;font:600 20px/1 var(--ui);color:var(--faint)}
.set-pdel{position:absolute;top:6px;right:6px;min-width:24px;height:24px;padding:0 6px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:2px;color:var(--muted);cursor:pointer;font:600 11px/1 var(--ui);letter-spacing:.08em}
.set-pdel:hover,.set-pdel.armed{color:var(--red);border-color:var(--red)}
@media (max-width:900px){ .set-presets{grid-template-columns:minmax(0,1fr)} }
@media (max-width:700px){ .set-cedit{grid-template-columns:minmax(0,1fr)} .set-cf{grid-template-columns:minmax(0,1fr) 40px 96px} }

/* Main menu display box (.mx), bottom slots, menu notes strip (.mnotes), Notes screen (.nb), corner dock (.dk). */
.slots.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.slots.three .slot.big{grid-template-columns:auto 1fr;min-height:132px}

/* ---- display box ---- */
.mx{display:flex;flex-direction:column;overflow:hidden}
.mx-h{gap:12px}
.mx-count{margin-left:auto;font:500 12px/1 var(--mono);letter-spacing:.06em;color:var(--faint)}
.mx-all{order:-1;margin:0 6px 0 0;font:600 13px/1 var(--ui);letter-spacing:.16em;padding:10px 16px;color:var(--text);border-color:color-mix(in srgb,var(--frame) 55%,var(--line-2));background:color-mix(in srgb,var(--frame) 12%,var(--panel-2))}
.mx-all:hover{color:var(--ink);background:var(--frame);border-color:var(--frame);box-shadow:0 0 16px color-mix(in srgb,var(--frame) 45%,transparent)}
.mx-all:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.mx-stage{position:relative;height:clamp(300px,38vh,380px)}
.mx-slide{all:unset;box-sizing:border-box;position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);cursor:pointer;
  opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s;--acc:var(--cyan)}
.mx-slide[data-accent="magenta"]{--acc:var(--magenta)} .mx-slide[data-accent="lime"]{--acc:var(--lime)}
.mx-slide.on{opacity:1;visibility:visible;transition-delay:0s}
.mx-slide:focus-visible{outline:2px solid var(--acc);outline-offset:-4px}
.mx-text{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:24px 26px;
  background:linear-gradient(90deg,var(--win-1) 70%,transparent)}
.mx-kicker{font:500 11px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--acc)}
.mx-title{display:flex;align-items:center;gap:14px;font:400 clamp(30px,3.6vw,44px)/1.05 var(--math);color:var(--text)}
.mx-glyph{width:52px;height:52px;flex:none;display:grid;place-items:center;font:400 26px/1 var(--math);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line-2));border-radius:50%;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--acc) 26%,transparent),rgba(11,16,25,.8) 70%);box-shadow:0 0 18px color-mix(in srgb,var(--acc) 25%,transparent)}
.mx-line{color:var(--muted);font-size:14.5px;line-height:1.55;max-width:44ch}
.mx-tags{display:flex;flex-wrap:wrap;gap:6px}
.mx-tags i{font:500 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;font-style:normal;color:var(--text);padding:5px 8px;border:1px solid var(--line-2);background:rgba(255,255,255,.03)}
.mx-go{align-self:flex-start;margin-top:4px;font:600 12px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:var(--acc);padding:9px 14px;border-radius:2px;transition:box-shadow .2s}
.mx-slide:hover .mx-go{box-shadow:0 0 18px color-mix(in srgb,var(--acc) 55%,transparent)}
/* collage: one large screenshot, up to two inset ones, a scanline sweep */
.mx-art{position:relative;overflow:hidden;background:var(--ink);border-left:1px solid var(--line)}
.mx-i{position:absolute;display:block;object-fit:cover;object-position:left top;border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.55)}
.mx-i0{inset:0;width:100%;height:100%;border:0;box-shadow:none;opacity:.92;transform:scale(1.04);transition:transform 8s ease-out}
.mx-slide.on .mx-i0{transform:scale(1)}
.mx-i1,.mx-i2{width:38%;aspect-ratio:16/10;right:4%;opacity:0;transform:translateY(10px);transition:opacity .8s ease .5s,transform .8s ease .5s;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.mx-i1{top:7%} .mx-i2{bottom:7%;right:12%;transition-delay:.8s}
.mx-slide.on .mx-i1,.mx-slide.on .mx-i2{opacity:1;transform:none}
.mx-art::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,var(--win-1),transparent 30%),linear-gradient(0deg,rgba(0,0,0,.35),transparent 40%)}
.mx-art::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;border:1px solid transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 20%,transparent)}
.mx-scan{position:absolute;left:0;right:0;height:30%;top:-30%;z-index:1;pointer-events:none;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--acc) 9%,transparent),transparent)}
.mx-slide.on .mx-scan{animation:mx-scan 7s linear infinite}
@keyframes mx-scan{to{top:110%}}
.mx-foot{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);background:var(--wash);position:relative}
.mx-arrow{background:none;border:1px solid var(--line-2);color:var(--muted);width:28px;height:24px;cursor:pointer;font-size:10px;border-radius:2px}
.mx-arrow:hover{color:var(--text);border-color:var(--frame)}
.mx-dots{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
.mx-dot{background:none;border:1px solid var(--line);color:var(--faint);cursor:pointer;padding:5px 9px;border-radius:2px;font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.mx-dot:hover{color:var(--text)}
.mx-dot[aria-selected="true"]{color:var(--text);border-color:var(--frame);background:color-mix(in srgb,var(--frame) 12%,transparent)}
.mx-bar{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
.mx-bar i{display:block;height:100%;width:0;background:var(--frame);box-shadow:0 0 8px var(--frame)}

/* ---- notes on the menu ---- */
.mnotes{border:1px solid var(--line);background:linear-gradient(180deg,var(--slot-1),var(--slot-2));padding:14px 16px}
.mnotes-h{display:flex;align-items:center;gap:10px;margin:-14px -16px 12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);transition:background .15s}
.mnotes-h:hover{background:linear-gradient(180deg,color-mix(in srgb,var(--frame) 12%,transparent),transparent)}
.mnotes-h:hover h2{color:var(--frame)}
.mnotes-h:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.mnotes-go{margin-right:auto;font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);transition:color .15s}
.mnotes-h:hover .mnotes-go{color:var(--frame)}
.mnotes-new{font:600 13px/1 var(--ui);letter-spacing:.16em;padding:10px 16px;color:var(--text);border-color:color-mix(in srgb,var(--frame) 55%,var(--line-2));background:color-mix(in srgb,var(--frame) 12%,var(--panel-2))}
.mnotes-new:hover{color:var(--ink);background:var(--frame);border-color:var(--frame);box-shadow:0 0 16px color-mix(in srgb,var(--frame) 45%,transparent)}
.mnotes-h h2{margin:0;font:600 15px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase}
.mnotes-h .num{color:var(--faint);font:500 12px/1 var(--mono)}
.mnotes-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mnote{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:12px 14px;min-height:96px;border:1px solid var(--line);border-left:3px solid var(--frame);background:rgba(0,0,0,.18)}
.mnote:hover{border-color:var(--line-2);border-left-color:var(--frame);background:rgba(255,255,255,.03)}
.mnote:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.mnote-t{font:600 14px/1.3 var(--sans);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnote-b{font-size:12.5px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.mnote-m{margin-top:auto;font:500 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.mnotes-empty{margin:0;color:var(--muted);font-size:13.5px;grid-column:1/-1}

/* ---- Notes screen ---- */
.nb{--nb-fw:200px;--nb-lw:var(--nb-lw-user,270px);display:grid;grid-template-columns:var(--nb-fw) var(--nb-lw) minmax(0,1fr);height:clamp(460px,68vh,780px);position:relative;transition:grid-template-columns .32s cubic-bezier(.2,.7,.2,1)}
.nb-list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.nb-tools{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.nb-tools .search{flex:1;min-width:0}
.nb-tools input{all:unset;flex:1;min-width:0;font-size:13.5px;color:var(--text)}
.nb-items{overflow:auto;flex:1}
.nb-it{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;width:100%;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line);position:relative}
.nb-it:hover{background:rgba(255,255,255,.03)}
.nb-it[aria-selected="true"]{background:linear-gradient(90deg,color-mix(in srgb,var(--frame) 16%,transparent),transparent)}
.nb-it[aria-selected="true"]::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--frame);box-shadow:0 0 8px var(--frame)}
.nb-it:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.nb-t{font:600 14px/1.3 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-m{font:500 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.nb-empty,.nb-none p{color:var(--muted);padding:14px;margin:0}
.nb-ed{display:flex;flex-direction:column;min-height:0;min-width:0}
.nb-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nb-saved{margin-right:auto;font:500 13px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nb-title{all:unset;box-sizing:border-box;padding:14px 18px 6px;font:400 26px/1.2 var(--math);color:var(--text)}
.nb-host{flex:1;min-height:0;display:flex;flex-direction:column}
.nb-title:focus-visible{box-shadow:inset 2px 0 0 var(--frame)}

/* ---- corner dock ---- */
.dk{position:fixed;right:0;bottom:84px;z-index:45;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none}
.dk>*{pointer-events:auto}
.dk-gem{width:8px;height:8px;background:var(--frame);transform:rotate(45deg);box-shadow:0 0 8px var(--frame)}
.dk-win{position:fixed;right:16px;bottom:16px;width:min(380px,calc(100vw - 32px));height:min(540px,calc(100dvh - 90px));display:flex;flex-direction:column;
  box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 24px var(--glow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.dk-win[hidden]{display:none}
.dk-h{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 6px 0 10px;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent)}
.dk-tabs{display:flex;gap:16px}
.dk-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 0 9px;cursor:pointer;font:600 11.5px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.dk-tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--frame)}
.dk-x{margin-left:auto;background:none;border:1px solid transparent;color:var(--muted);width:30px;height:30px;cursor:pointer;border-radius:2px}
.dk-x:hover{color:var(--text);border-color:var(--line-2)}
.dk-pane{flex:1;min-height:0;display:flex;flex-direction:column}
.dk-pane[hidden]{display:none}
.dk-ctx{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font:500 10.5px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);min-width:0}
.dk-ctx b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dk-prov{margin-left:auto;flex:none;padding:3px 6px;border:1px solid var(--line-2)}
.dk-log{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.dk-hello{color:var(--muted);font-size:13px;margin:0;padding:4px 2px}
.dk-msg{max-width:88%;padding:9px 11px;border:1px solid var(--line);font-size:13.5px;line-height:1.5;white-space:pre-wrap;position:relative}
.dk-msg.user{align-self:flex-end;background:color-mix(in srgb,var(--frame) 14%,transparent);border-color:color-mix(in srgb,var(--frame) 40%,transparent)}
.dk-msg.assistant{align-self:flex-start;background:rgba(0,0,0,.2)}
.dk-msg.err{color:var(--muted);border-style:dashed}
.dk-msg.busy .dk-t{color:var(--faint)}
.dk-save{display:block;margin-top:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--faint);font:600 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase}
.dk-save:hover{color:var(--frame)}
.dk-msg.err .dk-save,.dk-msg.busy .dk-save{display:none}
.dk-ask{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.dk-ask textarea{flex:1;resize:none;background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:8px 10px;font:400 13.5px/1.4 var(--sans)}
.dk-ask textarea:focus{outline:none;border-color:var(--frame)}
.dk-nbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dk-nbar .btn-s:disabled{opacity:.45;cursor:default}
.dk-saved{margin-right:auto;font:500 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.dk-nlist{flex:1;min-height:0;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.dk-nit{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--frame);background:rgba(0,0,0,.18)}
.dk-nit:hover{background:rgba(255,255,255,.04)}
.dk-nit:focus-visible{outline:2px solid var(--frame);outline-offset:1px}
.dk-nit b{font:600 13px/1.3 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-nit span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-ntitle{all:unset;box-sizing:border-box;padding:10px 12px 4px;font:400 19px/1.25 var(--math);color:var(--text)}
.dk-nbody{flex:1;min-height:0;display:flex;flex-direction:column}
.dk-nbody .nb-rich{padding:6px 12px 10px;font-size:13.5px;line-height:1.6}
.dk-nfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font:500 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.dk-link{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-link:hover{color:var(--frame)}

/* ---------- notes: folders, list extras, editor bar, rich editor ---------- */
.nb-folders{display:flex;flex-direction:column;gap:1px;padding:10px 8px;border-right:1px solid var(--line);overflow:auto;background:rgba(0,0,0,.12);min-height:0}
.nb-fh{font:600 10px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);padding:10px 8px 6px}
.nb-fd{display:flex;align-items:center;border-radius:2px;position:relative}
.nb-fd.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--frame) 18%,transparent),transparent)}
.nb-fd.sel::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--frame);box-shadow:0 0 8px var(--frame)}
.nb-fd.drop{outline:1px dashed var(--frame);background:color-mix(in srgb,var(--frame) 12%,transparent)}
.nb-fdb{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;cursor:pointer;font:500 13px/1.2 var(--sans);color:var(--muted)}
.nb-fdb:hover,.nb-fd.sel .nb-fdb{color:var(--text)}
.nb-fdb:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.nb-fic{width:14px;text-align:center;color:var(--amber);flex:none}
.nb-fnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-fn{font:500 11px/1 var(--mono);color:var(--faint)}
.nb-fx{all:unset;cursor:pointer;font-size:11px;color:var(--faint);padding:4px 5px;opacity:0;border-radius:2px}
.nb-fd:hover .nb-fx,.nb-fx:focus-visible,.nb-fx.armed{opacity:1}
.nb-fx:hover{color:var(--text);background:rgba(255,255,255,.06)}
.nb-fx.armed{color:var(--red);font:600 10px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase}
.nb-fx:focus-visible{outline:2px solid var(--frame)}
.nb-fadd{all:unset;cursor:pointer;margin-top:8px;padding:7px 10px;font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line-2);border-radius:2px;text-align:center}
.nb-fadd:hover{color:var(--text);border-color:var(--frame)}
.nb-fname{display:flex;gap:4px;padding:4px 2px}
.nb-fname input{flex:1;min-width:0;background:var(--ink);color:var(--text);border:1px solid var(--frame);border-radius:2px;padding:5px 7px;font:400 13px/1.2 var(--sans)}
.nb-filter{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
.nb-filter select{flex:1;min-width:0}
.nb-filter select,.nb-fsel select{width:100%;background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:5px 6px;font:400 12.5px/1.2 var(--sans)}
.nb-filter select[hidden]{display:none}
.nb-star{font-style:normal;color:var(--amber);margin-right:6px}
.nb-it[draggable="true"]{cursor:grab;-webkit-user-drag:element} /* all:unset on .nb-it drops the UA rule that makes [draggable] work */
.nb-favb{all:unset;cursor:pointer;font-size:20px;line-height:1;color:var(--faint);padding:2px 4px}
.nb-favb:hover,.nb-favb.on{color:var(--amber)}
.nb-favb.on{text-shadow:0 0 10px rgba(242,184,75,.45)}
.nb-favb:focus-visible{outline:2px solid var(--frame);outline-offset:1px}
.nb-fsel{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nb-fsel select{width:auto;max-width:200px;font-size:14px;padding:6px 8px}
.nb-urlrow{display:flex;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nb-urlrow[hidden]{display:none}
.nb-urlrow input{flex:1;min-width:180px;background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:6px 8px;font:400 13px/1.2 var(--sans)}
.nb-urlmsg{font-size:12px;color:var(--red)}
.nb-links{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 18px 0}
.nb-lb{font:600 10px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.nb-chips{display:contents}
.nb-nolink{font-size:12px;color:var(--faint)}
.nb-chip{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:12px;background:var(--panel-2);overflow:hidden}
.nb-chip button{all:unset;cursor:pointer;font:500 12px/1 var(--sans);color:var(--text);padding:5px 4px 5px 9px;display:inline-flex;gap:6px;align-items:center}
.nb-chip button:hover{color:var(--frame)}
.nb-chip .nb-cx{padding:5px 8px 5px 4px;color:var(--faint)}
.nb-chip .nb-cx:hover{color:var(--red)}
.nb-chip button:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.nb-cic{font:400 12px/1 var(--math);color:var(--frame)}
.nb-ladd{padding:5px 8px;font-size:10px}
.nb-rich{flex:1;min-height:0;overflow:auto;outline:none;color:var(--text);padding:8px 18px 18px;font:400 15px/1.65 var(--sans);white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.nb-rich:focus-visible{box-shadow:inset 2px 0 0 var(--frame)}
.nb-rich.is-empty::before{content:attr(data-placeholder);color:var(--faint);pointer-events:none;position:absolute}
.nb-rich.drop{box-shadow:inset 0 0 0 2px var(--frame)}
.nb-rich blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--line-2);background:rgba(255,255,255,.025);color:var(--text)}
.nb-rich h3{font:600 14px/1.3 var(--ui);letter-spacing:.12em;text-transform:uppercase;margin:10px 0 4px}
.nb-rich ul,.nb-rich ol{margin:4px 0;padding-left:22px}
.nb-rich img.nimg{display:block;max-width:min(100%,560px);max-height:420px;height:auto;margin:8px 0;border:1px solid var(--line-2);border-radius:3px;background:var(--ink)}
.nb-rich img.nimg.missing{min-width:140px;min-height:60px}
a.nlink{color:var(--note-link,#B49BFF);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--note-link,#B49BFF) 50%,transparent);text-underline-offset:3px;cursor:pointer;white-space:normal}
a.nlink:hover{text-decoration-color:currentColor;text-shadow:0 0 10px color-mix(in srgb,var(--note-link,#B49BFF) 40%,transparent)}
a.nlink:focus-visible{outline:2px solid var(--frame);outline-offset:1px}
a.nlink.gone{color:var(--faint);text-decoration-style:dashed;cursor:default}
.mnote-b a.nlink{pointer-events:none}

/* picker popover (notes, link targets), right-click menu, toast */
.nk-pick.win{position:fixed;z-index:2100;display:flex;flex-direction:column;max-height:min(380px,calc(100vh - 16px));box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 30px var(--glow);animation:vt-in .25s ease}
.nk-q{margin:8px;background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:7px 9px;font:400 13px/1.2 var(--sans)}
.nk-q:focus{outline:none;border-color:var(--frame)}
.nk-list{overflow:auto;padding:0 6px 6px;min-height:0}
.nk-it{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;padding:7px 8px;border-radius:2px;font:500 13px/1.3 var(--sans);color:var(--text)}
.nk-it small{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nk-it:hover,.nk-it:focus-visible{background:color-mix(in srgb,var(--frame) 14%,transparent);outline:none}
.nk-ic{text-align:center;color:var(--frame);font-family:var(--math)}
.nk-new .nk-ic{color:var(--green)}
.nk-none{margin:8px;color:var(--faint);font-size:12.5px}
.tm-menu.win{position:fixed;z-index:2100;min-width:230px;max-width:320px;padding:5px;display:grid;box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 24px var(--glow);animation:vt-in .18s ease}
.tm-menu button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:2px;font:500 13px/1.3 var(--sans);color:var(--text)}
.tm-menu button small{display:block;font-size:11px;color:var(--muted)}
.tm-menu button:hover:not([disabled]),.tm-menu button:focus-visible{background:color-mix(in srgb,var(--frame) 16%,transparent);outline:none}
.tm-menu button[disabled]{opacity:.45;cursor:default}
.tm-menu kbd{font:500 11px/1 var(--mono);color:var(--faint)}
.tm-ic{text-align:center;color:var(--frame);font:400 13px/1 var(--math)}
.tm-toast.win{position:fixed;z-index:2100;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:10px 14px;font:500 13px/1.3 var(--sans);color:var(--text);box-shadow:0 12px 40px rgba(0,0,0,.55);animation:vt-in .25s ease;transition:opacity .4s}
.tm-toast.out{opacity:0}

@media (max-width:1100px){ .nb{--nb-fw:170px;--nb-lw:var(--nb-lw-user,230px)} }
@media (max-width:860px){
  .slots.three{grid-template-columns:minmax(0,1fr)}
  .mnotes-list{grid-template-columns:minmax(0,1fr)}
  .mx-stage{height:auto;display:grid}
  .mx-slide{position:relative;inset:auto;grid-area:1/1;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 180px}
  .mx-text{background:none;padding:18px 16px 12px}
  .mx-art{border-left:0;border-top:1px solid var(--line)}
  .mx-dots .mx-dot span{display:none}
  .mx-dot{width:10px;height:10px;padding:0}
  .mx-all{font-size:12px;padding:9px 12px}
  .mx-count{display:none}
  .nb{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 200px minmax(360px,1fr);height:auto}
  .nb-folders{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);max-height:150px}
  .nb-fh{display:none}
  .nb-fd{flex:0 0 auto}
  .nb-fadd{margin-top:0}
  .nb-list{border-right:0;border-bottom:1px solid var(--line)}
  .dk{bottom:70px}
}

/* ---------- notes toolbar, text colours, emoji/symbol panel (web/src/notes-widgets.js) ---------- */
.nr-tools{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:6px 14px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.1)}
.nr-tools>button,.nr-tools .nr-sym{all:unset;box-sizing:border-box;cursor:pointer;min-width:28px;height:28px;padding:0 7px;display:inline-grid;place-items:center;border:1px solid transparent;border-radius:2px;color:var(--muted);font:500 13px/1 var(--sans)}
.nr-tools>button:hover{color:var(--text);border-color:var(--line-2);background:rgba(255,255,255,.04)}
.nr-tools>button[aria-pressed="true"]{color:var(--text);border-color:var(--frame);background:color-mix(in srgb,var(--frame) 16%,transparent)}
.nr-tools>button:focus-visible{outline:2px solid var(--frame)}
.nr-tools>button[data-w],.nr-tools>button.nr-vid{font:600 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase}
.nr-sep{width:1px;height:18px;background:var(--line-2);margin:0 5px}
.nr-cols{display:inline-flex;gap:3px;align-items:center}
.nr-col{all:unset;cursor:pointer;width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.nr-col:hover{transform:scale(1.15);box-shadow:0 0 0 1px var(--text),0 0 8px var(--c)}
.nr-col:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.nr-colx{background:none;display:grid;place-items:center;font-size:13px;color:var(--muted);box-shadow:none}
.nb-rich span[data-c="amber"]{color:var(--amber)} .nb-rich span[data-c="cyan"]{color:var(--cyan)} .nb-rich span[data-c="pink"]{color:var(--pink)}
.nb-rich span[data-c="violet"]{color:var(--violet)} .nb-rich span[data-c="green"]{color:var(--green)} .nb-rich span[data-c="magenta"]{color:var(--magenta)}
.nb-rich span[data-c="lime"]{color:var(--lime)} .nb-rich span[data-c="red"]{color:var(--red)} .nb-rich span[data-c="muted"]{color:var(--muted)}
.dk-nbody .nr-tools{padding:4px 8px;gap:2px}
.dk-nbody .nr-tools>button{min-width:24px;height:24px;padding:0 5px}
.nr-panel.win{position:fixed;z-index:2100;display:flex;flex-direction:column;height:320px;box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 30px var(--glow);animation:vt-in .2s ease}
.nr-ptabs{display:flex;align-items:center;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line)}
.nr-ptabs [data-t]{all:unset;cursor:pointer;padding:7px 10px;font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.nr-ptabs [data-t][aria-selected="true"]{color:var(--text);border-bottom-color:var(--frame)}
.nr-phint{margin-left:auto;font:400 11.5px/1.2 var(--sans);color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nr-px{all:unset;cursor:pointer;padding:4px 8px;color:var(--faint)}
.nr-px:hover{color:var(--text)}
.nr-pbody{flex:1;min-height:0;overflow:auto;padding:4px 8px 10px}
.nr-grp h4{margin:10px 2px 4px;font:600 10px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.nr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:2px}
.nr-ch{all:unset;cursor:pointer;height:32px;display:grid;place-items:center;border-radius:3px;font:400 19px/1 "Noto Sans Symbols","STIX Two Text","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",var(--sans);color:var(--text)}
.nr-ch:hover,.nr-ch:focus-visible{background:color-mix(in srgb,var(--frame) 18%,transparent);outline:none}

/* ---------- note widgets: code box and music chart ---------- */
.nb-rich .nw{display:block;margin:10px 0;border:1px solid var(--line-2);border-left:3px solid var(--violet);border-radius:4px;background:var(--panel);white-space:normal;user-select:none;cursor:default;max-width:100%}
.nb-rich .nw[data-w="music"]{border-left-color:var(--magenta)}
.nw-h{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03);flex-wrap:wrap}
.nw-tag{font:600 12px/1 var(--mono);color:var(--violet);padding:0 4px}
.nw[data-w="music"] .nw-tag{color:var(--magenta);font-size:15px}
.nw-title{flex:1;min-width:90px;background:transparent;border:1px solid transparent;border-radius:2px;color:var(--text);font:600 12px/1.2 var(--ui);letter-spacing:.12em;text-transform:uppercase;padding:4px 6px;user-select:text}
.nw-title:hover,.nw-title:focus{border-color:var(--line-2);outline:none}
.nw-h select,.nw-tempo input{background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:3px 5px;font:400 12px/1.2 var(--sans)}
.nw-tempo{display:inline-flex;align-items:center;gap:3px;font:400 13px/1 var(--math);color:var(--muted)}
.nw-tempo input{width:54px}
.nw-b{all:unset;cursor:pointer;padding:5px 8px;border:1px solid var(--line-2);border-radius:2px;font:600 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--panel-2)}
.nw-b:hover{color:var(--text);border-color:var(--frame)}
.nw-b:focus-visible{outline:2px solid var(--frame)}
.nw-b[aria-pressed="true"]{color:var(--ink);background:var(--magenta);border-color:var(--magenta)}
.nw-del.armed{color:var(--red);border-color:var(--red)}
.nw-play{color:var(--text)}
.nw-code{display:grid;grid-template-columns:auto minmax(0,1fr);font:400 13.5px/1.55 var(--mono)}
.nw-gut{display:flex;flex-direction:column;padding:10px 8px 10px 10px;text-align:right;color:var(--faint);border-right:1px solid var(--line);user-select:none;background:rgba(0,0,0,.12)}
.nw-gut span{font:inherit}
.nw-edit{position:relative;min-width:0}
.nw-hl,.nw-ta{margin:0;padding:10px 12px;font:inherit;white-space:pre;tab-size:4;overflow:hidden;box-sizing:border-box;width:100%}
.nw-hl{position:absolute;inset:0;pointer-events:none;color:var(--text)}
.nw-ta{position:relative;display:block;resize:none;border:0;outline:none;background:transparent;color:transparent;caret-color:var(--amber);overflow-x:auto;user-select:text}
.nw-ta::selection{background:color-mix(in srgb,var(--frame) 30%,transparent);color:transparent}
.nw-edit:focus-within{box-shadow:inset 2px 0 0 var(--frame)}
.nw-hl .kw{color:var(--violet)} .nw-hl .bi{color:var(--cyan)} .nw-hl .str{color:var(--green)} .nw-hl .num{color:var(--amber)} .nw-hl .com{color:var(--faint);font-style:italic}
.nw-staff{overflow-x:auto;padding:4px 8px 0;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.ms{display:block}
.ms .ms-line{stroke:var(--muted);stroke-width:1}
.ms .ms-over{stroke:var(--red);stroke-width:2}
.ms .ms-ink{stroke:var(--text)}
.ms .ms-fill{fill:var(--text)}
.ms .ms-hollow{fill:none;stroke:var(--text);stroke-width:1.6}
.ms .ms-time{font:700 17px/1 var(--math);fill:var(--text)}
.ms .ms-sym{font:600 13px/1 var(--sans);fill:var(--magenta)}
.ms .ms-acc{font:400 15px/1 var(--math);fill:var(--text)}
.ms .ms-hot{fill:var(--amber);stroke:var(--amber)}
.ms .ms-hollow.ms-hot{fill:none}
.ms text.ms-hot,.ms rect.ms-hot{stroke:none}
.nw-mtools{display:grid;gap:8px;padding:8px 10px 10px;border-top:1px solid var(--line)}
.nw-durs{display:flex;flex-wrap:wrap;gap:4px}
.nw-durs button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;min-width:46px;padding:4px 4px 5px;border:1px solid var(--line-2);border-radius:2px;font:400 20px/1 "Noto Music","Apple Symbols","STIX Two Text",var(--math);color:var(--text)}
.nw-durs button small{font:500 9px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.nw-durs button[aria-checked="true"],.nw-durs button[aria-pressed="true"]{border-color:var(--magenta);background:color-mix(in srgb,var(--magenta) 16%,transparent)}
.nw-durs button:focus-visible{outline:2px solid var(--frame)}
.nw-keys{display:flex;align-items:stretch;gap:6px}
.nw-piano{position:relative;display:flex;height:78px;flex:1;max-width:420px}
.nw-piano .wk{all:unset;cursor:pointer;flex:1;position:relative;background:linear-gradient(180deg,#E9EDF4,#C9D1DE);border:1px solid #6b7486;border-radius:0 0 3px 3px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font:600 9px/1 var(--ui);color:#3a4256}
.nw-piano .bk{all:unset;cursor:pointer;width:5.2%;height:58%;margin:0 -2.6%;z-index:1;position:relative;background:linear-gradient(180deg,#2a3142,#0d1119);border:1px solid #05070b;border-radius:0 0 2px 2px}
.nw-piano .wk:hover{background:linear-gradient(180deg,#fff,#f3dcf6)} .nw-piano .bk:hover{background:linear-gradient(180deg,#6a4d73,#2d1d33)}
.nw-piano .wk:active,.nw-piano .bk:active{filter:brightness(.85)}
.nw-piano button:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.nw-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nw-chordf{display:flex;gap:4px}
.nw-chord{width:130px;background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:5px 7px;font:400 12.5px/1.2 var(--sans);user-select:text}
.nw-nota{display:grid;gap:4px;font:600 10px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.nw-nota small{font:400 11px/1.2 var(--mono);letter-spacing:0;text-transform:none;color:var(--muted);margin-left:6px}
.nw-seq{background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:6px 8px;font:400 13px/1.5 var(--mono);resize:vertical;user-select:text}
.nw-seq:focus,.nw-chord:focus{outline:none;border-color:var(--magenta)}
.nw-msg{margin:0;font-size:12px;color:var(--muted)} .nw-msg.bad{color:var(--red)}

/* ---------- notes drag and drop: nested folders, My order (1.16.1) ---------- */
.nb-fd.user{padding-left:calc(var(--d,0) * 14px)}
.nb-fd.user[draggable="true"]{cursor:grab}
.nb-fcar{all:unset;flex:none;width:16px;margin-left:6px;text-align:center;font-size:11px;color:var(--amber);cursor:pointer;border-radius:2px}
span.nb-fcar{cursor:inherit;color:var(--faint)}
button.nb-fcar:hover{background:rgba(255,255,255,.06)}
button.nb-fcar:focus-visible{outline:2px solid var(--frame)}
.nb-fd.user .nb-fdb{padding-left:6px}
.nb-fd.dragging,.nb-it.dragging{opacity:.45}
.nb-fd.drop-before,.nb-it.drop-before{box-shadow:inset 0 2px 0 var(--frame)}
.nb-fd.drop-after,.nb-it.drop-after{box-shadow:inset 0 -2px 0 var(--frame)}
.nb-ftop.drop{outline:1px dashed var(--frame);color:var(--text)}
@media (max-width:760px){ .nb-fd.user{padding-left:0} }

/* ---------- notes text sizes, Assist linked notes (1.16.1) ---------- */
@property --nb-base{syntax:"<length>";inherits:true;initial-value:15px}
.nb-rich{--nb-base:1em} /* computed once, at the editor's own size, then inherited as px: nested sizes never compound */
.nb-rich span[data-s="s"]{font-size:calc(var(--nb-base) * .82)} .nb-rich span[data-s="n"]{font-size:var(--nb-base)}
.nb-rich span[data-s="l"]{font-size:calc(var(--nb-base) * 1.3);line-height:1.4} .nb-rich span[data-s="xl"]{font-size:calc(var(--nb-base) * 1.75);line-height:1.3}
.nr-sizes{display:inline-flex;align-items:flex-end;gap:1px}
.nr-sz{all:unset;box-sizing:border-box;cursor:pointer;min-width:24px;height:28px;padding:0 4px;display:inline-grid;place-items:end center;padding-bottom:6px;border:1px solid transparent;border-radius:2px;color:var(--muted);font-family:var(--sans);font-weight:600;line-height:1}
.nr-sz:hover{color:var(--text);border-color:var(--line-2);background:rgba(255,255,255,.04)}
.nr-sz:focus-visible{outline:2px solid var(--frame)}
.nr-sz-s{font-size:11px!important} .nr-sz-n{font-size:13.5px!important} .nr-sz-l{font-size:16.5px!important} .nr-sz-xl{font-size:20px!important}
.dk-nh{margin:4px 0 0;font:600 10.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dk-nit.here{border-left-color:var(--green)}
.dk-nhere{font:600 10.5px/1.2 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--green);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- My notes: fold tabs + list resizer (notesLayout in app.js) ---------- */
.nb-fold{position:absolute;z-index:6;top:50%;transform:translate(-50%,-50%);width:18px;height:64px;padding:0;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(180deg,var(--panel-3),var(--panel-2));border:1px solid var(--line-2);border-radius:3px;color:var(--muted);font:400 10px/1 var(--ui);
  box-shadow:0 4px 14px rgba(0,0,0,.4);transition:left .32s cubic-bezier(.2,.7,.2,1),color .15s,border-color .15s,box-shadow .15s}
.nb-fold:hover{color:var(--text);border-color:var(--frame);box-shadow:0 0 12px var(--glow)}
.nb-fold:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.nb-fold[data-p="f"]{left:max(9px,var(--nb-fw));top:38%}
.nb-fold[data-p="l"]{left:max(9px,calc(var(--nb-fw) + var(--nb-lw)));top:62%}
.nb-rz{position:absolute;z-index:5;top:0;bottom:0;left:calc(var(--nb-fw) + var(--nb-lw));width:10px;transform:translateX(-50%);cursor:col-resize;touch-action:none;transition:left .32s cubic-bezier(.2,.7,.2,1)}
.nb-rz::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s,box-shadow .15s}
.nb-rz:hover::after,.nb.rz .nb-rz::after,.nb-rz:focus-visible::after{background:var(--frame);box-shadow:0 0 8px var(--frame)}
.nb-rz:focus-visible{outline:none}
.nb.rz,.nb.rz .nb-rz,.nb.rz .nb-fold{transition:none}
.nb.rz{cursor:col-resize;user-select:none}
.nb.lfold .nb-rz{display:none}
@media (min-width:861px){
  .nb.ffold{--nb-fw:0px} .nb.lfold{--nb-lw:0px}
  .nb>.nb-folders,.nb>.nb-list{overflow:hidden}
  .nb>.nb-folders{overflow-y:auto}
  .nb.ffold>.nb-folders,.nb.lfold>.nb-list{visibility:hidden;border-right:0;padding-left:0;padding-right:0;transition:visibility 0s linear .32s}
  .nb-list>*{min-width:180px}
}
@media (max-width:860px){ .nb-fold,.nb-rz{display:none} }

/* ---------- note videos (video widget in notes-widgets.js) ---------- */
.nb-rich .nw[data-w="video"]{border-left-color:var(--pink);max-width:760px}
.nw[data-w="video"] .nw-tag{color:var(--pink)}
.nw-vbox{position:relative;aspect-ratio:16/9;background:#000}
.nw-vbox iframe,.nw-vbox video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.nw-vmiss{margin:0;position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:var(--muted);font-size:13px}
a.nw-open{text-decoration:none}
.nv-body{display:grid;gap:8px;padding:12px}
.nv-body small{color:var(--muted);font-size:11.5px;line-height:1.4}
.nv-h{font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--text);padding:0 4px}
.nv-form{display:flex;gap:6px}
.nv-form input{flex:1;min-width:0;background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:6px 8px;font:400 13px/1.2 var(--sans)}
.nv-msg{margin:0;font-size:12px;color:var(--pink);min-height:1em}
.nv-msg:empty{display:none}
.nv-pop.win{height:auto}

/* ---------- Assist: glass window that slides out of the right edge; the rail of icons is its handle; holographic chat screen (1.16.1) ---------- */
.dk{--dkw:min(380px,calc(100vw - 32px))}
.dk.is-open .dk-gem{animation:dk-gem 2.4s ease-in-out infinite}
@keyframes dk-gem{50%{box-shadow:0 0 14px var(--frame),0 0 2px #fff}}
.dk-win.win{width:var(--dkw);transform:translateX(calc(100% + 28px));opacity:.4;
  transition:transform .38s cubic-bezier(.2,.7,.2,1),opacity .3s ease;
  background:linear-gradient(115deg,rgba(255,255,255,.07),transparent 32%,transparent 70%,color-mix(in srgb,var(--frame) 7%,transparent)),
    linear-gradient(160deg,color-mix(in srgb,var(--win-1) 62%,transparent),color-mix(in srgb,var(--win-2) 74%,transparent));
  border:1px solid color-mix(in srgb,var(--frame) 30%,var(--line-2));
  box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 28px var(--glow),inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 40px color-mix(in srgb,var(--frame) 6%,transparent);
  backdrop-filter:blur(20px) saturate(1.35);-webkit-backdrop-filter:blur(20px) saturate(1.35)}
.dk.is-open .dk-win{transform:none;opacity:1}
.dk-h{background:linear-gradient(180deg,color-mix(in srgb,var(--frame) 9%,rgba(255,255,255,.04)),transparent)}
.dk-ctx,.dk-nbar,.dk-ask,.dk-nfoot{background:rgba(0,0,0,.12)}
.dk-ask textarea{background:color-mix(in srgb,var(--ink) 75%,transparent)}
.dk-msg.assistant{background:color-mix(in srgb,var(--panel) 55%,transparent);backdrop-filter:blur(4px)}
.dk-nit{background:color-mix(in srgb,var(--panel) 45%,transparent)}
/* the chat screen: scanlines, a slow drifting sheen and a sweep, like the display box's screenshots */
.dk-screen{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--frame) 9%,transparent),transparent 70%)}
.dk-screen .dk-log{position:absolute;inset:0;z-index:1}
.dk-holo{position:absolute;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--frame) 5%,transparent) 0 1px,transparent 1px 3px),
    linear-gradient(105deg,transparent 30%,color-mix(in srgb,var(--frame) 7%,transparent) 45%,color-mix(in srgb,var(--tint-2) 100%,transparent) 52%,transparent 66%);
  background-size:100% 100%,260% 100%;animation:dk-flow 11s ease-in-out infinite alternate}
.dk-holo::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--frame) 14%,transparent),inset 0 0 50px color-mix(in srgb,var(--frame) 8%,transparent)}
.dk-scan{position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--frame) 10%,transparent),transparent);animation:mx-scan 7s linear infinite}
@keyframes dk-flow{from{background-position:0 0,100% 0}to{background-position:0 0,0% 0}}
.dk:not(.is-open) .dk-holo,.dk:not(.is-open) .dk-scan{animation-play-state:paused}

/* ---------- right-click definitions (textmenu.js) ---------- */
.tm-menu{max-width:min(380px,calc(100vw - 12px))}
.tm-def{border-top:1px solid var(--line);margin-top:4px;padding:10px 10px 6px;display:grid;gap:8px;max-height:min(320px,50vh);overflow:auto;font-size:13px;line-height:1.5;color:var(--text)}
.tm-dh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tm-dh b{font:400 19px/1.1 var(--math)}
.tm-ipa{font:400 14px/1 var(--math);color:var(--frame)}
.tm-src{margin-left:auto;font:600 9.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line-2);padding:3px 5px}
.tm-db{border-left:3px solid var(--gc,var(--frame));padding-left:8px}
.tm-ds{font:600 10px/1.3 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.tm-ds span{color:var(--gc);margin-right:5px;font-family:var(--math);letter-spacing:0}
.tm-ds i{font-style:normal;color:var(--faint);margin-left:4px}
.tm-db p{margin:0 0 4px}
.tm-db p b{color:var(--faint);font:600 11px/1 var(--mono)}
.tm-dl{margin:0;padding-left:18px;display:grid;gap:5px}
.tm-dl i{color:var(--faint);font:italic 12px/1 var(--sans)}
.tm-dn{margin:0;color:var(--muted)}
.tm-busy{animation:tm-pulse 1.2s ease-in-out infinite}
@keyframes tm-pulse{50%{opacity:.5}}
.tm-menu .tm-dgo,.tm-menu a.tm-dgo{all:unset;justify-self:start;cursor:pointer;font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--frame);padding:4px 0}
.tm-menu .tm-dgo:hover{text-decoration:underline}
.tm-menu .tm-dgo:focus-visible{outline:2px solid var(--frame)}
.tm-dfoot{margin:0;font-size:11px;color:var(--faint)}
.nb-favtop{flex:none;background:var(--ink);color:var(--faint);border:1px solid var(--line-2);border-radius:2px;padding:0 8px;cursor:pointer;font:600 10.5px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.nb-favtop[aria-pressed="true"]{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,var(--line-2))}
.nb-favtop:hover{color:var(--text);border-color:var(--frame)}
.tm-dacts{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}

/* ---------- dock layout (Oct 2026): icon rail (AI · Notes · Chat), "◆ Assist" header with tabs under it, separate Notes box ---------- */
.dk-rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 5px 6px 7px;border:1px solid var(--frame);border-right:0;
  background:linear-gradient(180deg,var(--win-1),var(--win-2));clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px);box-shadow:0 0 16px var(--glow);
  transition:transform .32s cubic-bezier(.2,.7,.2,1),opacity .25s}
.dk-rail .dk-gem{margin:0 0 7px;animation:dk-gem 2.4s ease-in-out infinite}
.dk-rail .dk-icons{flex-direction:column}
.dk.rail-off .dk-rail{transform:translateX(115%);opacity:0;pointer-events:none}
.dk-icons{display:flex;gap:2px}
.dk-ic{width:30px;height:30px;display:grid;place-items:center;padding:0;background:none;border:1px solid transparent;border-radius:2px;color:var(--muted);cursor:pointer;transition:color .15s,background .15s}
.dk-ic svg{width:17px;height:17px;display:block}
.dk-ic:hover{color:var(--frame);border-color:var(--line-2)}
.dk-ic[aria-pressed="true"]{color:var(--frame);background:color-mix(in srgb,var(--frame) 14%,transparent);border-color:color-mix(in srgb,var(--frame) 40%,transparent)}
.dk-ic:focus-visible{outline:2px solid var(--frame);outline-offset:1px}
.dk-h{align-items:flex-start;padding:9px 6px 0 12px}
.dk-hl{display:flex;flex-direction:column;gap:3px;min-width:0}
.dk-title{display:flex;align-items:center;gap:9px;font:600 12px/1 var(--ui);letter-spacing:.26em;text-transform:uppercase;color:var(--text);padding:3px 0}
.dk-title .dk-gem{animation:dk-gem 2.4s ease-in-out infinite}
.dk-tabs button{padding:8px 0 9px}
.dk-hr{margin-left:auto;display:flex;align-items:center;gap:2px}
.dk-hr .dk-x{margin-left:4px}
.dk-who{display:block;font:600 10.5px/1.2 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--frame);margin-bottom:3px}
.dk-ask textarea:disabled,.dk-ask button:disabled{opacity:.5;cursor:not-allowed}
/* Notes box: docked bottom right (left of Assist when both are open) or floating where it was dragged */
.dkn.win{--dknw:min(380px,calc(100vw - 32px));position:fixed;width:var(--dknw);height:min(540px,calc(100dvh - 90px));display:flex;flex-direction:column;
  opacity:0;transform:translateY(14px) scale(.98);transition:opacity .22s ease,transform .26s cubic-bezier(.2,.7,.2,1),right .38s cubic-bezier(.2,.7,.2,1);
  background:linear-gradient(115deg,rgba(255,255,255,.07),transparent 32%,transparent 70%,color-mix(in srgb,var(--frame) 7%,transparent)),
    linear-gradient(160deg,color-mix(in srgb,var(--win-1) 62%,transparent),color-mix(in srgb,var(--win-2) 74%,transparent));
  border:1px solid color-mix(in srgb,var(--frame) 30%,var(--line-2));
  box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 28px var(--glow),inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 40px color-mix(in srgb,var(--frame) 6%,transparent);
  backdrop-filter:blur(20px) saturate(1.35);-webkit-backdrop-filter:blur(20px) saturate(1.35)}
.dkn[hidden]{display:none}
.dkn.is-open{opacity:1;transform:none}
.dkn.docked{right:16px;bottom:16px}
.dk.is-open .dkn.docked{right:calc(var(--dkw) + 28px)}
.dkn.dragging{transition:none;user-select:none;box-shadow:0 26px 80px rgba(0,0,0,.6),0 0 34px var(--glow)}
.dkn-h{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--frame) 9%,rgba(255,255,255,.04)),transparent)}
.dkn.dragging .dkn-h{cursor:grabbing}
.dkn-grip{color:var(--faint);font-size:14px;line-height:1}
.dkn.docked .dkn-home{display:none}
@media (max-width:760px){ .dkn.win{left:16px!important;top:auto!important;right:16px;bottom:16px;width:auto} .dk.is-open .dkn.docked{right:16px} .dkn-h{cursor:default} .dkn-grip{display:none} }

/* ---------- windows over the app: My notes, Achievements (modalWin in app.js; fog rule in settings.css) ---------- */
.mw-ov{position:fixed;inset:0;z-index:1600;display:grid;place-items:center;padding:16px;
  background:radial-gradient(ellipse at 50% 40%,rgba(200,220,255,.06),rgba(3,6,11,.55));opacity:0;transition:opacity .3s ease}
body.mw-open .mw-ov{opacity:1}
.mw-ov.out{opacity:0;pointer-events:none}
.mw-win{width:min(1080px,100%);height:min(760px,calc(100dvh - 32px));display:flex;flex-direction:column;outline:none;
  box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03),0 0 40px var(--glow);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transform:translateY(10px) scale(.98);transition:transform .35s cubic-bezier(.2,.7,.2,1)}

.mw-h{flex-wrap:wrap;row-gap:6px}
.mw-sub{font:400 13px/1.3 var(--sans);color:var(--muted);margin-left:6px}
