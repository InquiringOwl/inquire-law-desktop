.mw-hx{margin-left:auto;display:flex;align-items:center;gap:8px}
.mw-h .set-x{margin-left:0}
.mw-tip{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:50%;color:var(--faint);font:600 11px/1 var(--ui);cursor:help}
.mw-tip:hover,.mw-tip:focus-visible{color:var(--text);border-color:var(--frame);outline:none}
.mw-body{flex:1;min-height:0;display:flex;flex-direction:column}
.mw-notes{width:min(1340px,100%);height:calc(100dvh - 32px)}
.mw-notes .mw-body>.nb{flex:1;min-height:0;height:auto}
@media (max-width:860px){ .mw-ov{padding:8px} .mw-win,.mw-notes{height:calc(100dvh - 16px)} .mw-body{overflow:auto} .mw-notes .mw-body>.nb{flex:none} .mw-sub{flex-basis:100%;margin:0} }

/* ---------- Achievements window (web/src/achievements.js) ---------- */
.mw-ach{width:min(1120px,100%)}
.ach-bal{display:inline-flex;align-items:baseline;gap:6px;padding:5px 11px 5px 9px;border:1px solid color-mix(in srgb,var(--amber) 55%,var(--line-2));border-radius:14px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--amber) 16%,transparent),color-mix(in srgb,var(--amber) 5%,transparent));box-shadow:0 0 14px color-mix(in srgb,var(--amber) 22%,transparent)}
.ach-coin{color:var(--amber);font-size:12px;text-shadow:0 0 8px var(--amber)}
.ach-bal b{font:600 15px/1 var(--ui);color:var(--text);letter-spacing:.04em}
.ach-bal small{font:600 10px/1 var(--ui);letter-spacing:.18em;color:var(--amber)}
.ach-mine[aria-pressed="true"]{color:var(--text);border-color:var(--frame)}
.ach-tabs{display:flex;align-items:flex-end;gap:20px;padding:0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ach-tabs [role=tab]{background:none;border:0;border-bottom:2px solid transparent;padding:12px 0 10px;cursor:pointer;font:600 11.5px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.ach-tabs [role=tab] .num{margin-left:4px;color:var(--faint)}
.ach-tabs [aria-selected="true"]{color:var(--text);border-bottom-color:var(--frame)}
.ach-sum{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 0 10px;font:500 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.ach-sum .num{color:var(--text)}
.ach-scroll{flex:1;min-height:0;overflow:auto;padding:14px 18px 22px}
.ach-cats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.ach-sec{margin:18px 0 0}
.ach-sh{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px dashed color-mix(in srgb,var(--line) 80%,transparent)}
.ach-sh h3{margin:0;font:600 12.5px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--text)}
.ach-sic{color:var(--frame);font-family:var(--math)}
.ach-sh .ln{font-size:12.5px;color:var(--faint)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ach-card{--ac:var(--frame);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-left:3px solid color-mix(in srgb,var(--ac) 45%,var(--line));
  background:color-mix(in srgb,var(--panel) 55%,transparent);position:relative}
.ach-card.done{border-color:color-mix(in srgb,var(--green) 40%,var(--line));border-left-color:var(--green);background:linear-gradient(110deg,color-mix(in srgb,var(--green) 9%,transparent),transparent 60%),color-mix(in srgb,var(--panel) 55%,transparent)}
.ach-card.soon{opacity:.55;border-style:dashed}
.ach-medal{width:38px;height:38px;display:grid;place-items:center;font:400 17px/1 var(--math);color:color-mix(in srgb,var(--ac) 80%,var(--text));
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 30%,var(--panel-2)),var(--panel-2))}
.ach-card.done .ach-medal{color:#0b1410;background:linear-gradient(160deg,#a6efb4,var(--green));box-shadow:0 0 14px var(--green)}
.ach-medal.sm{width:30px;height:30px;font-size:14px;--ac:var(--amber)}
.ach-txt h3{margin:0;font:600 14px/1.25 var(--sans);color:var(--text)}
.ach-txt p{margin:3px 0 7px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.ach-bar{display:inline-block;vertical-align:middle;width:min(160px,60%);height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-right:8px}
.ach-bar.big{width:120px}
.ach-bar i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--ac,var(--frame)) 70%,transparent),var(--ac,var(--frame)));border-radius:3px}
.ach-prog,.ach-when{font:500 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.ach-card.done .ach-when{color:var(--green)}
.ach-pts{font:600 15px/1 var(--ui);color:var(--amber);white-space:nowrap}
.ach-pts small{margin-left:3px;font-size:9.5px;letter-spacing:.16em}
.ach-card:not(.done) .ach-pts{color:color-mix(in srgb,var(--amber) 55%,var(--faint))}
.ach-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0 0 16px}
.ach-stats>div{padding:12px;border:1px solid var(--line);background:rgba(0,0,0,.14);display:flex;flex-direction:column;gap:6px}
.ach-stats b{font:600 22px/1 var(--ui);color:var(--text)}
.ach-stats>div:first-child b{color:var(--amber)}
.ach-stats span{font:500 10px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.ach-empty{color:var(--muted);font-size:14px;padding:20px 2px}
.ach-toasts{position:fixed;left:18px;bottom:18px;z-index:2150;display:flex;flex-direction:column-reverse;gap:8px;align-items:flex-start;pointer-events:none}
.ach-toast.win{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;text-align:left;color:var(--text);
  border:1px solid color-mix(in srgb,var(--amber) 55%,var(--line-2));box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 22px color-mix(in srgb,var(--amber) 30%,transparent);animation:ach-in .45s cubic-bezier(.2,.7,.2,1);transition:opacity .4s,transform .4s}
.ach-toast small{display:block;font:600 9.5px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.ach-toast b{font:600 14px/1.2 var(--sans)}
.ach-ap{font:600 13px/1 var(--ui);color:var(--amber);margin-left:6px}
.ach-toast.out{opacity:0;transform:translateX(-30px)}
@keyframes ach-in{from{opacity:0;transform:translateX(-40px)}}
.slot .ach-tag{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 55%,var(--line-2))}
.slots.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.slots.four .slot.big{grid-template-columns:auto 1fr;min-height:132px}
@media (max-width:1280px){ .slots.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){ .slots.four{grid-template-columns:minmax(0,1fr)} .ach-grid{grid-template-columns:minmax(0,1fr)} .ach-sum{margin-left:0;flex-basis:100%} .ach-toasts{left:12px;right:12px;align-items:stretch} }
@media (prefers-reduced-motion:reduce){ .ach-toast.win{animation:none} }

</style>

  { id: "lesson-template", group: "reference", name: "Lesson Template", glyph: "◇", status: "open", note: "Format reference · placeholder text only" }
];

/* Per-subject field maps: groups of field ids, eras across the map's columns. accent = the subject group's accent. */
DB.subjectMaps = {
  "lesson-template": { name: "Lesson Template", glyph: "◇", accent: "", mapLine: "[One line: the whole path of this subject]",
    mapSub: "[Placeholder] The standard order of study for a subject. Arrows show the usual prerequisites.",
    groups: [{ name: "[Group of fields]", ids: ["template-field", "template-planned"] }],
    eras: [{ name: "[Era of fields]", from: 0, to: 1 }] }
};

/* Main Menu display box: one slide per open subject. art = keys of app/menu/<key>.jpg (lab screenshots, inlined by build-web). */
DB.menuSlides = [
  { sub: "lesson-template", art: ["tpl-1"], kicker: "Format Reference", line: "The blank Concept · Intermediate · Formal lesson every Law subject will be built from.", tags: ["Concept", "Intermediate", "Formal"] }
];

/* ============ Story panels (format kept from Inquire; usable for case excerpts) ============
   Tag set used by story tokens. The current tags are placeholders until a Law tag set is designed. */
/* Parts-of-speech tags used in English story passages. The traditional eight, coloured in five
   groups: naming words (c1), verbs (c2), noun modifiers (c3), adverbs (c4), connectors and exclamations (c5).
   Articles count as adjectives in the traditional eight; they keep their own tag so pages can say "article". */
DB.posTags = {
  n:  { name: "Noun", c: "c1", test: "Fits the frame “the ___” and can usually be made plural or possessive: truth, truths, truth’s. Proper nouns (names) are capitalised." },
  pr: { name: "Pronoun", c: "c1", test: "Stands in for a whole noun phrase. Personal pronouns change form for case: I, me, my." },
  v:  { name: "Verb", c: "c2", test: "Heads the predicate and can be marked for tense: is → was, give → gave. Auxiliaries (be, have, will, would, must) are verbs too." },
  aj: { name: "Adjective", c: "c3", test: "Modifies a noun. Fits “a ___ thing” and “very ___”, and most compare: young, younger, youngest." },
  ar: { name: "Article", c: "c3", test: "a, an, the: mark a noun as indefinite or definite. The traditional eight count articles as adjectives (modern grammars: determiners)." },
  av: { name: "Adverb", c: "c4", test: "Modifies a verb, an adjective, another adverb or a whole clause. Answers how, when, where, how often or how much." },
  p:  { name: "Preposition", c: "c5", test: "Links a noun phrase (its object) to the rest of the sentence: in Tuckahoe, of a wife." },
  cj: { name: "Conjunction", c: "c5", test: "Joins words, phrases or clauses. Coordinating: and, but, or. Subordinating: that, because, although." },
  ij: { name: "Interjection", c: "c5", test: "An exclamation that stands outside the grammar of the sentence: Bah! Oh! Alas!" }
};
/* Story token strings: "word_tag" separated by spaces; bare punctuation; "*" after the tag = italic in
   the source; "#key" after the tag = use notes[key]; "¶" = paragraph break. */
DB.parseStory = tokens => {
  const out = []; let prev = "";
  tokens.trim().split(/\s+/).forEach(t => {
    if (t === "¶") { out.push({ br: true }); prev = "\n"; return; }
    const m = t.match(/^(.*?)_([a-z]+)(\*?)(?:#([a-z0-9]+))?$/);
    const w = (m ? m[1] : t).replace(/~/g, " ");
    const glue = prev === "" || prev === "\n" || /[“—‘(]$/.test(prev) || /^([,.;:!?’”—)]|’[a-z]|n’t)/.test(w);
    out.push({ w, tag: m ? m[2] : null, it: !!(m && m[3]), key: m ? (m[4] || w.toLowerCase().replace(/[’']s$/, "")) : null, glue });
    prev = w;
  });
  return out;
};
DB.storyText = tokens => DB.parseStory(tokens).map(x => x.br ? "\n" : (x.glue ? "" : " ") + x.w).join("");

<script>/* web/kits/universal/core.js */
/* ============ Universal lab kit: what every lab in every subject uses ============
   Loaded first (build-web: web/kits/universal → categorical → subjects → labs). window.LabKit:
     LabKit.make(stage, ro, ctl) → k      the kit a lab receives (L["id"] = k => {…})
     LabKit.stopAll()                     stops loops, observers and timers when a page closes
     LabKit.extend(fn)                    a categorical kit adds its helpers: fn(k) runs at the end of every make()
     LabKit.rules                         DOM-free helpers (tested in tests/universal.test.js): fmt, gcd, lcm, shuffle,
                                          clamp, snap, decimals, parseNum, scrubValue, numText
   k (every lab): C (colours), F (fonts), alpha, reduce, fmt, gcd, lcm, shuffle, M, neg, frac, words; stage, ro, ctl;
     k.canvas() → c, k.dom(), k.loop(fn), k.every(ms, fn), k.fontsReady(cb), k.setRO(html), k.css(id, text)
     controls: k.slider, k.number, k.select, k.button, k.check, k.modes, k.params, k.group/k.showGroup
     layout:   k.split(c, host, o), k.hint(text) (one at a time), k.smooth(cur, target, dt)
     output:   k.readout({title, big, rows, landmark, narr}), k.guard([answers])
     numbers you can change: S = k.vars(defs, onChange), S.html(key), k.eqline(html)   (see below)
   Categorical kits (web/kits/categorical) add: k.plot/k.plane/k.cplane/k.drag (plane.js), k.stepper/k.stepsPanel
   (stepper.js), LabKit.quiz (quiz.js). Subject kits (web/kits/subjects) add DOM-free rules and subject drawing. */
(function(){
const W = typeof window !== "undefined" ? window : globalThis;
const MI = "−";

/* ---------------- DOM-free rules ---------------- */
const fmt = (v, d = 3) => { if (!isFinite(v)) return "undefined"; const s = (Math.round(v * 10 ** d) / 10 ** d).toLocaleString("en-US", { maximumFractionDigits: d }); return s.replace("-", MI); };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const lcm = (a, b) => a && b ? Math.abs(a * b) / gcd(a, b) : 0;
// Copy of arr, shuffled; seeded (repeatable, for tests) when seed is given.
const shuffle = (arr, seed) => {
  const a = arr.slice(); let s = seed == null ? Math.random() * 1e9 : seed;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor((seed == null ? Math.random() : rnd()) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
const clamp = (v, lo = -Infinity, hi = Infinity) => Math.max(lo, Math.min(hi, v));
// Number of decimals a step needs (0.25 → 2, 1 → 0, π/12 → 6)
const decimals = step => { if (!step || !isFinite(step)) return 6; for (let d = 0; d <= 6; d++) if (Math.abs(Math.round(step * 10 ** d) - step * 10 ** d) < 1e-9) return d; return 6; };
// Nearest multiple of step from origin, cleaned of float dust (0.1 + 0.2 → 0.3)
const snap = (v, step, origin = 0) => { if (!step) return v; const n = Math.round((v - origin) / step); return +(origin + n * step).toFixed(Math.max(decimals(step), decimals(origin))); };
// Typed number → value or null. Accepts −/-, decimals, fractions (3/4, −5/2), mixed (1 1/2), π forms (π, 2π, π/3, −3π/4, 2pi), √n, a√n, %.
function parseNum(str){
  if (str == null) return null;
  let s = String(str).trim().toLowerCase().replace(/[−–—]/g, "-").replace(/\s+/g, " ").replace(/pi/g, "π").replace(/sqrt\s*/g, "√").replace(/,/g, "");
  if (!s) return null;
  let sign = 1; if (s[0] === "+") s = s.slice(1).trim(); else if (s[0] === "-") { sign = -1; s = s.slice(1).trim(); }
  let m;
  if ((m = /^(\d+) (\d+)\/(\d+)$/.exec(s))) { const d = +m[3]; return d ? sign * (+m[1] + +m[2] / d) : null; }
  if ((m = /^(\d*\.?\d*)%$/.exec(s)) && m[1] !== "" && m[1] !== ".") return sign * (+m[1] / 100);
  const atom = t => {
    t = t.trim(); let q;
    if ((q = /^(\d*\.?\d*)\s*π$/.exec(t))) return (q[1] === "" ? 1 : q[1] === "." ? NaN : +q[1]) * Math.PI;
    if ((q = /^(\d*\.?\d*)\s*√\s*(\d*\.?\d+)$/.exec(t))) return (q[1] === "" ? 1 : +q[1]) * Math.sqrt(+q[2]);
    if (/^(\d+\.?\d*|\.\d+)(e-?\d+)?$/.test(t)) return +t;
    return NaN;
  };
  const parts = s.split("/");
  if (parts.length > 2) return null;
  const top = atom(parts[0]), bot = parts.length === 2 ? atom(parts[1]) : 1;
  if (!isFinite(top) || !isFinite(bot) || bot === 0) return null;
  return sign * top / bot;
}

const numText = (v, d = 4) => { if (!isFinite(v)) return "undefined"; const s = String(+v.toFixed(d)); return (s === "-0" ? "0" : s).replace("-", MI); };

function D(g){
  return {
    text(s, x, y, o = {}){ g.font = o.font || `16px ${F.math}`; g.fillStyle = o.color || C.text; g.textAlign = o.align || "left"; g.textBaseline = o.base || "alphabetic"; g.fillText(s, x, y); return g.measureText(s).width; },
    width(s, font){ g.font = font; return g.measureText(s).width; },
    line(x1, y1, x2, y2, color = C.line2, w = 1, dash){ g.save(); g.strokeStyle = color; g.lineWidth = w; if (dash) g.setLineDash(dash); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore(); },
    rect(x, y, w, h, fill, stroke, lw = 1){ if (fill) { g.fillStyle = fill; g.fillRect(x, y, w, h); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.strokeRect(x + .5, y + .5, w - 1, h - 1); } },
    rr(x, y, w, h, r, fill, stroke, lw = 1){ g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } },
    circle(x, y, r, fill, stroke, lw = 1){ g.beginPath(); g.arc(x, y, Math.max(0, r), 0, Math.PI * 2); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } },
    hop(x1, x2, y, hgt, color, w = 2){ g.save(); g.strokeStyle = color; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y); g.quadraticCurveTo((x1 + x2) / 2, y - hgt, x2, y); g.stroke();
      const ang = Math.atan2(y - (y - hgt), x2 - (x1 + x2) / 2); g.fillStyle = color; g.beginPath(); g.moveTo(x2, y); g.lineTo(x2 - 8 * Math.cos(ang - .4), y - 8 * Math.sin(ang - .4)); g.lineTo(x2 - 8 * Math.cos(ang + .4), y - 8 * Math.sin(ang + .4)); g.closePath(); g.fill(); g.restore(); },
    arrow(x1, y1, x2, y2, color, w = 2){ g.save(); g.strokeStyle = color; g.fillStyle = color; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); const a = Math.atan2(y2 - y1, x2 - x1); g.beginPath(); g.moveTo(x2, y2); g.lineTo(x2 - 9 * Math.cos(a - .45), y2 - 9 * Math.sin(a - .45)); g.lineTo(x2 - 9 * Math.cos(a + .45), y2 - 9 * Math.sin(a + .45)); g.closePath(); g.fill(); g.restore(); },
    pow(base, exp, x, y, o = {}){ const size = o.size || 16; const f = `${size}px ${o.family || F.math}`; const w1 = this.text(base, x, y, { font: f, color: o.color, align: "left", base: o.base }); const w2 = this.text(exp, x + w1 + 1, y - size * .42, { font: `${Math.round(size * .66)}px ${o.family || F.math}`, color: o.ecolor || o.color, align: "left", base: o.base }); return w1 + w2 + 1; },
    powW(base, exp, size, family){ return this.width(base, `${size}px ${family || F.math}`) + this.width(exp, `${Math.round(size*.66)}px ${family || F.math}`) + 1; }

const M = s => `<span class="m">${s}</span>`;
const neg = n => (n < 0 ? MI + Math.abs(n) : String(n));
const frac = (n, d, cls = "") => `<span class="m ${cls}"><span class="fr"><span>${n}</span><span>${d}</span></span></span>`;
function words(n){
  if (n === 0) return "zero";
  const a = ["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const t = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  const two = x => x < 20 ? a[x] : t[Math.floor(x / 10)] + (x % 10 ? "-" + a[x % 10] : "");
  const three = x => (x >= 100 ? a[Math.floor(x / 100)] + " hundred" + (x % 100 ? " " : "") : "") + (x % 100 ? two(x % 100) : "");
  const parts = []; const units = ["", " thousand", " million", " billion"]; let i = 0;
  while (n > 0) { const c = n % 1000; if (c) parts.unshift(three(c) + units[i]); n = Math.floor(n / 1000); i++; }
  return parts.join(" ");
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function make(stage, ro, ctl){
  const kit = { C, F, alpha, reduce, coarse, fmt, gcd, lcm, shuffle, M, neg, frac, words, esc, stage, ro, ctl, rules };
  const listen = (el, type, fn, opt) => { el.addEventListener(type, fn, opt); live.offs.add(() => el.removeEventListener(type, fn, opt)); };
  kit.listen = listen;
  let lastRO = "";
  kit.setRO = html => { if (html !== lastRO) { ro.innerHTML = html; lastRO = html; } };
  kit.css = addCSS;
  kit.canvas = () => {
    const cv = document.createElement("canvas"); stage.appendChild(cv);
    const g = cv.getContext("2d"); const o = { cv, g, w: 1, h: 1, dpr: 1, d: D(g) };
    const rs = () => { const r = stage.getBoundingClientRect(); o.w = Math.max(1, r.width); o.h = Math.max(1, r.height); o.dpr = Math.min(W.devicePixelRatio || 1, 2); cv.width = Math.round(o.w * o.dpr); cv.height = Math.round(o.h * o.dpr); };
    const obs = new ResizeObserver(rs); obs.observe(stage); live.ros.add(obs); rs();
    o.begin = () => { g.setTransform(o.dpr, 0, 0, o.dpr, 0, 0); g.clearRect(0, 0, o.w, o.h); };
    o.xy = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    return o;
  };
  kit.dom = () => { const d = document.createElement("div"); d.className = "dom"; stage.appendChild(d); return d; };
  kit.loop = fn => { const L = { on: true }; live.loops.add(L); let last = performance.now(); const f = now => { if (!L.on) return; const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; try { fn(dt, now / 1000); } catch(e) { console.error(e); L.on = false; return; } requestAnimationFrame(f); }; requestAnimationFrame(f); };
  kit.every = (ms, fn) => { const id = setInterval(fn, ms); live.timers.add(id); return () => { clearInterval(id); live.timers.delete(id); }; };
  // One hint at a time: k.hint(text) replaces the previous hint ("" removes it).
  kit.hint = t => { stage.querySelectorAll(".hintc").forEach(e => e.remove()); if (t) { const e = document.createElement("div"); e.className = "hintc"; e.textContent = t; stage.appendChild(e); } };
  // Declare the current mode's answers (strings as they would appear, e.g. "x = 3"); tools/layoutcheck.js reports any
  // of them visible when the mode opens. Call again with [] or new answers when the mode changes.
  kit.guard = list => { stage.dataset.answers = JSON.stringify(list || []); };
  // Let the page drive this lab: k.expose({ set: v => …, play: () => … }). Concept-tab "Try it" chips call
  // LabKit.drive("set:19,play") (comma-separated, name[:argument]); see docs/subjects/LAYERS.md.
  kit.expose = actions => { live.expose = actions; };
  // Every control also drives itself (1.18.5): a chip may name a control by its key, the first word of its label
  // ("<i>a</i>" → a, "Round to" → round, "Next pair" → nextpair for buttons; a repeated key gets 2, 3 …), and the
  // control publishes its value under that key. slider/number: "a:7" (the raw slider value); select: "op:1" (option
  // index); check: "log:1" / "log:0" / "log" (toggle); button: "nextpair"; k.modes: "mode:2" (button index).
  // Commands the lab exposes itself (k.expose) win over these.
  const autoKey = (label, button) => { let t = String(label).replace(/<[^>]*>/g, " ").replace(/&[a-z]+;/g, " ").toLowerCase();
    t = button ? t.replace(/[^a-z]+/g, "") : (t.replace(/[^a-z0-9]+/g, " ").trim().split(" ")[0] || "");
    if (!/^[a-z]/.test(t)) return ""; let k = t, i = 2; while (live.auto[k] && live.auto[k].el && live.auto[k].el.isConnected) k = t + i++; return k; };   // a control rebuilt for another mode keeps its key
  const autoCtl = (key, fn, v, el) => { if (!key) return; fn.el = el; live.auto[key] = fn; if (v !== undefined) kit.publish(key, v); };
  // Tell the page a live value: k.publish("n", 17). The Concept tab's question figure ({echo: "n"}) follows it;
  // fires "inquire:lab-value" {key, value} only when the value changes; LabKit.value(key) reads the latest.
  kit.publish = (key, v) => { if (live.values[key] === v) return; live.values[key] = v; window.dispatchEvent(new CustomEvent("inquire:lab-value", { detail: { key, value: v } })); };

  kit.slider = (label, min, max, step, value, onInput, fmtFn) => {
    const id = "lab" + (++uid);
    const w = document.createElement("div"); w.className = "ctl grow";
    w.innerHTML = `<label for="${id}">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}"><span class="val"></span>`;
    kit.ctl.appendChild(w);
    const inp = w.querySelector("input"), val = w.querySelector(".val");
    const show = () => { val.textContent = fmtFn ? fmtFn(+inp.value) : String(inp.value).replace("-", MI); };
    inp.addEventListener("input", () => { show(); onInput(+inp.value); kit.publish(sk, +inp.value); }); show();
    const sk = autoKey(label); autoCtl(sk, v => { inp.value = v; inp.dispatchEvent(new Event("input")); }, +inp.value, inp);
    return { el: inp, get v(){ return +inp.value; }, set(v){ inp.value = v; show(); kit.publish(sk, +inp.value); }, setMax(m){ inp.max = m; if (+inp.value > m) { inp.value = m; } show(); }, setMin(m){ inp.min = m; if (+inp.value < m) inp.value = m; show(); } };
  };
  kit.number = (label, min, max, value, onChange, width) => {
    const id = "lab" + (++uid);
    const w = document.createElement("div"); w.className = "ctl";
    w.innerHTML = `<label for="${id}">${label}</label><input type="number" id="${id}" min="${min}" max="${max}" value="${value}">`;
    kit.ctl.appendChild(w);
    const inp = w.querySelector("input"); if (width) inp.style.width = width;
    const read = () => { let v = Math.round(+inp.value); if (!isFinite(v)) v = value; v = Math.max(min, Math.min(max, v)); return v; };
    inp.addEventListener("change", () => { const v = read(); inp.value = v; onChange(v); kit.publish(nk, v); });

  };
  kit.select = (label, options, value, onChange) => {
    const id = "lab" + (++uid);
    const w = document.createElement("div"); w.className = "ctl";
    w.innerHTML = `<label for="${id}">${label}</label><select id="${id}">${options.map(([v, t]) => `<option value="${v}"${String(v) === String(value) ? " selected" : ""}>${t}</option>`).join("")}</select>`;
    kit.ctl.appendChild(w);
    const s = w.querySelector("select"); s.addEventListener("change", () => { onChange(s.value); kit.publish(qk, s.selectedIndex); });
    const qk = autoKey(label); autoCtl(qk, v => { s.selectedIndex = Math.max(0, Math.min(s.options.length - 1, Math.round(+v) || 0)); s.dispatchEvent(new Event("change")); }, s.selectedIndex, s);
    return { el: s, get v(){ return s.value; }, set(v){ s.value = v; kit.publish(qk, s.selectedIndex); } };
  };
  kit.button = (label, onClick, cls = "btn") => { const b = document.createElement("button"); b.type = "button"; b.className = cls; b.textContent = label; b.addEventListener("click", onClick); kit.ctl.appendChild(b); autoCtl(autoKey(label, true), () => b.click(), undefined, b); return b; };
  kit.check = (label, value, onChange) => {
    const id = "lab" + (++uid);
    const w = document.createElement("div"); w.className = "ctl";
    w.innerHTML = `<input type="checkbox" id="${id}"${value ? " checked" : ""}><label for="${id}" style="font-family:var(--sans)">${label}</label>`;
    kit.ctl.appendChild(w); const c = w.querySelector("input"); c.addEventListener("change", () => { onChange(c.checked); kit.publish(ck, c.checked ? 1 : 0); });
    const ck = autoKey(label); autoCtl(ck, v => { c.checked = v === "" ? !c.checked : !!+v; c.dispatchEvent(new Event("change")); }, c.checked ? 1 : 0, c); return c;
  };
  kit.modes = (list, active, onPick) => {
    const w = document.createElement("div"); w.className = "modes"; w.setAttribute("role", "group");
    list.forEach(([k, t]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = t; b.dataset.k = k; b.setAttribute("aria-pressed", String(k === active)); b.onclick = () => { w.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); onPick(k); }; w.appendChild(b); });
    stage.appendChild(w); const bs = [...w.querySelectorAll("button")];
    autoCtl(live.auto.mode ? "" : "mode", v => { const b = bs[Math.max(0, Math.min(bs.length - 1, Math.round(+v) || 0))]; if (b) b.click(); }, Math.max(0, list.findIndex(x => x[0] === active)));

  kit.showGroup = name => { for (const [g, els] of Object.entries(groups)) els.forEach(e => { e.style.display = g === name ? "" : "none"; }); };

  // Split the stage between a DOM panel (steps, tables) and the canvas plot, below the mode buttons.
  // Wide (≥ minWide px): panel on the `side` ("left" | "right", width frac); narrow: panel on top (height hfrac).
  // Returns the plot padding {l, r, t, b} for k.plane({pad}); o.full → panel takes the whole stage (returns null);
  // o.off → hides the panel and returns default padding. Call every frame (cheap: only restyles on change).
  kit.split = (c, host, o = {}) => {
    const mb = stage.querySelector(".modes"), top = mb ? mb.offsetTop + mb.offsetHeight + 4 : 8, set = css => { if (host.__css !== css) { host.style.cssText = css; host.__css = css; } };
    if (o.off) { set("display:none"); return { l: 40, r: 16, t: 16, b: 30 }; }
    const wide = c.w >= (o.minWide || 600); host.classList.toggle("narrow", !wide);
    if (o.full) { set(`display:block;left:0;right:0;top:${top}px;bottom:0;width:auto;height:auto;padding:0;overflow:auto`); return null; }
    if (wide) { const dw = Math.round(c.w * (o.frac || .46)), left = o.side !== "right";

      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        const v0 = val[j][i], v1 = val[j][i + 1], v2 = val[j + 1][i + 1], v3 = val[j + 1][i]; const x0 = P.left + i * res, y0 = P.top + j * res;
        const e = []; if ((v0 > 0) !== (v1 > 0)) e.push([x0 + res * lerpT(v0, v1), y0]); if ((v1 > 0) !== (v2 > 0)) e.push([x0 + res, y0 + res * lerpT(v1, v2)]);

      } g.stroke(); g.restore(); }); };
    // Shade between y = f and y = h (h defaults to the x-axis) for x in [from, to]
    P.shade = (f, h, from, to, color) => { h = h || (() => 0); P.clip(() => { g.save(); g.fillStyle = color; g.beginPath(); const N = 160; for (let i = 0; i <= N; i++) { const x = from + (to - from) * i / N; const y = Math.max(P.ymin - 1e3, Math.min(P.ymax + 1e3, f(x))); i ? g.lineTo(P.X(x), P.Y(y)) : g.moveTo(P.X(x), P.Y(y)); } for (let i = N; i >= 0; i--) { const x = from + (to - from) * i / N; const y = Math.max(P.ymin - 1e3, Math.min(P.ymax + 1e3, h(x))); g.lineTo(P.X(x), P.Y(y)); } g.closePath(); g.fill(); g.restore(); }); };
    P.seg = (x1, y1, x2, y2, color, w = 2, dash) => { P.line(x1, y1, x2, y2, color, w, dash); for (let i = 0; i <= 10; i++) record(P.X(x1 + (x2 - x1) * i / 10), P.Y(y1 + (y2 - y1) * i / 10)); };
    // A draggable handle at (x, y): filled dot, ring, and a halo when hovered/dragged/focused. state: {hover, active, focus}
    P.handle = (x, y, color = C.amber, st = {}) => { if (!(x >= P.xmin && x <= P.xmax && y >= P.ymin && y <= P.ymax)) return; const px = P.X(x), py = P.Y(y);
      if (st.active || st.hover) d.circle(px, py, st.active ? 17 : 14, alpha(color, st.active ? .22 : .14));
      if (st.focus) { g.save(); g.setLineDash([3, 3]); d.circle(px, py, 13, null, color, 1.5); g.restore(); }
      d.circle(px, py, 7, C.ink, color, 2.2); d.circle(px, py, 3.6, color); record(px, py); P.boxes.push({ x: px - 9, y: py - 9, w: 18, h: 18 }); };
    // Labels placed so they don't overlap each other, curves drawn so far, the mode buttons or the plot edges.
    // list: [{text, x, y (math coords), color, font, prefer: "ne"|"nw"|…}] — draw these LAST in the frame.
    P.labels = list => {
      const items = list.filter(l => l && l.x >= P.xmin && l.x <= P.xmax && l.y >= P.ymin && l.y <= P.ymax).map(l => { const font = l.font || `14px ${F.math}`; return Object.assign({}, l, { font, ax: P.X(l.x), ay: P.Y(l.y), w: d.width(l.text, font) + 2, h: parseInt(/(\d+)px/.exec(font)[1], 10) + 4 }); });
      const res = placeLabels(items.map(l => ({ x: l.ax, y: l.ay, w: l.w, h: l.h, prefer: l.prefer })), { bounds: { x: P.left, y: P.top, w: P.width, h: P.height }, boxes: P.boxes, pts: P.pts });
      items.forEach((l, i) => { const r = res[i]; if (l.halo !== false) d.rect(r.x - 1, r.y, r.w + 2, r.h, alpha(C.ink, .72)); d.text(l.text, r.x + 1, r.y + r.h / 2, { font: l.font, color: l.color || C.text, base: "middle" }); P.boxes.push(r); });
      return res;
    };
    return P;
  };

  // Draggable points (mouse, touch, keyboard). See the header for the constraint fields.
  k.drag = (c, getP, pts, onMove, opt = {}) => {
    const st = { active: -1, hover: -1, focus: -1, pts }, R = opt.r || (k.coarse ? 24 : 16);
    const win = P => [P.xmin, P.xmax, P.ymin, P.ymax];
    const usable = i => pts[i] && !pts[i].off;
    const hit = e => { const P = getP(); if (!P) return -1; const q = c.xy(e); let best = -1, bd = R; pts.forEach((p, i) => { if (!usable(i)) return; const dd = Math.hypot(P.X(p.x) - q.x, P.Y(p.y) - q.y); if (dd < bd) { bd = dd; best = i; } }); return best; };
    const apply = (i, mx, my) => { const P = getP(), p = pts[i]; if (!P || !p) return; const t = dragTarget(p, mx, my, win(P)); if (!t) return; if (t.x === p.x && t.y === p.y) return; p.x = t.x; p.y = t.y; if (onMove) onMove(i, p); say(i); };
    const move = e => { const P = getP(); if (!P || st.active < 0) return; const q = c.xy(e), m = P.inv(q.x, q.y); apply(st.active, m.x, m.y); };
    const name = i => pts[i].name || (pts.length > 1 ? `point ${i + 1}` : "the point");
    const num = v => String(+(+v).toFixed(3)).replace("-", "−");
    let sayT = 0; const say = i => { const now = performance.now(); if (now - sayT < 120 && st.active >= 0) return; sayT = now; c.cv.setAttribute("aria-label", `${opt.label || "Graph"}: ${name(i)} at (${num(pts[i].x)}, ${num(pts[i].y)}). Tab to choose a point, arrow keys to move it.`); };
    if (!c.cv.hasAttribute("tabindex")) c.cv.tabIndex = 0;
    c.cv.setAttribute("role", "application");
    if (!c.cv.getAttribute("aria-label")) c.cv.setAttribute("aria-label", `${opt.label || "Graph"} with ${pts.length} draggable point${pts.length > 1 ? "s" : ""}. Drag them, or Tab to a point and use the arrow keys.`);
    k.listen(c.cv, "pointerdown", e => { const i = hit(e); if (i < 0) return; st.active = i; c.cv.style.cursor = "grabbing"; try { c.cv.setPointerCapture(e.pointerId); } catch (_) {} move(e); e.preventDefault(); });
    k.listen(c.cv, "pointermove", e => { if (st.active >= 0) move(e); else { const h = hit(e); if (h !== st.hover) { st.hover = h; } c.cv.style.cursor = st.hover >= 0 ? "grab" : ""; } });
    const up = () => { if (st.active >= 0) c.cv.style.cursor = "grab"; st.active = -1; };
    k.listen(c.cv, "pointerup", up); k.listen(c.cv, "pointercancel", up); k.listen(c.cv, "pointerleave", () => { if (st.active < 0) st.hover = -1; });

    const firstUsable = (from, dir) => { for (let i = from; i >= 0 && i < pts.length; i += dir) if (usable(i)) return i; return -1; };
    k.listen(c.cv, "focus", () => { if (st.focus < 0) st.focus = firstUsable(0, 1); if (st.focus >= 0) say(st.focus); });
    k.listen(c.cv, "blur", () => { st.focus = -1; });
    k.listen(c.cv, "keydown", e => { if (st.focus < 0 || !pts[st.focus]) return; const P = getP(); if (!P) return;
      if (e.key === "Tab") { const n = firstUsable(st.focus + (e.shiftKey ? -1 : 1), e.shiftKey ? -1 : 1); if (n >= 0) { st.focus = n; say(n); e.preventDefault(); } return; }
      const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }, dv = dirs[e.key]; if (!dv) return; e.preventDefault();
      const p = pts[st.focus], mul = e.shiftKey ? 5 : 1;
      const sx = p.keyStep || p.snapX || p.snap || niceStep(P.xmax - P.xmin, 40), sy = p.keyStep || p.snapY || p.snap || niceStep(P.ymax - P.ymin, 40);
      if (p.on) { const s = (dv[0] || dv[1]) * sx * mul; apply(st.focus, p.x + s, p.y); return; }
      if (p.path) { // step along the constraint: try a small move in the arrow's direction, then project

  };
});
})();

</script>
<script>/* web/kits/categorical/quiz.js */
/* ============ Categorical kit: quiz (scored questions, any subject) ============
   LabKit.quiz(cfg) → controller (DOM-free, tested; EngLab.quiz is the same function):
     cfg.items: array; cfg.render(item, state) → html (state: {answered, picked, correct}); cfg.check(item, picked) → bool;
     cfg.seed (optional, repeatable order for tests)
     ctl.pick(v) → state (fires window "inquire:quiz" {correct} for Achievements), ctl.next(), ctl.reset(),
     ctl.item, ctl.index, ctl.total, ctl.state, ctl.score {right, tries}, ctl.html()
   Order shuffles without repeats; the lab draws and binds, the kit keeps the state. Also on every k as k.quiz. */
(function(){
const W = typeof window !== "undefined" ? window : globalThis;
W.LabKit = W.LabKit || {};
const shuffle = (W.LabKit.rules && W.LabKit.rules.shuffle) || ((a) => a.slice());
const quiz = cfg => {
  let order = shuffle(cfg.items.map((_, i) => i), cfg.seed), pos = 0;
  const ctl = {
    score: { right: 0, tries: 0 },
    state: { answered: false, picked: null, correct: null },
    get item(){ return cfg.items[order[pos]]; },
    get index(){ return pos; },
    get total(){ return cfg.items.length; },
    pick(v){ if (ctl.state.answered) return ctl.state; const ok = !!cfg.check(ctl.item, v); ctl.state = { answered: true, picked: v, correct: ok }; ctl.score.tries++; if (ok) ctl.score.right++; if (typeof W.dispatchEvent === "function" && typeof CustomEvent !== "undefined") W.dispatchEvent(new CustomEvent("inquire:quiz", { detail: { correct: ok } })); return ctl.state; }, // inquire:quiz → Achievements
    next(){ pos++; if (pos >= order.length) { order = shuffle(order, cfg.seed == null ? null : cfg.seed + 1); pos = 0; } ctl.state = { answered: false, picked: null, correct: null }; },
    reset(){ ctl.score = { right: 0, tries: 0 }; pos = 0; ctl.state = { answered: false, picked: null, correct: null }; },
    html(){ return cfg.render(ctl.item, ctl.state); }
  };
  return ctl;
};
W.LabKit.quiz = quiz;
if (W.LabKit.extend) W.LabKit.extend(k => { k.quiz = quiz; });
})();

</script>
<script>/* web/kits/categorical/stepper.js */
/* ============ Categorical kit: stepper (worked solutions revealed one step at a time) ============
   Shared by every subject that walks through steps (math solutions, physics problems, proofs, CS traces' controls).
     k.stepper(count, onStep, {start, ms}) → {play, pause, step, reset, finish, k}   Play/Step/Reset buttons in the controls
     k.stepsPanel(host, {todo}) → {el, set(lines, cur)}   lines = [{tag, eq, why}]; lines after `cur` render as empty
                                                          placeholders (never their content), so answers can't show early
     LabKit.reveal(lines, k)  DOM-free: lines with everything after index k replaced by null (MathRules.reveal alias) */
(function(){
const W = typeof window !== "undefined" ? window : globalThis;
const reveal = (lines, k) => lines.map((l, i) => (i <= k ? l : null));
W.LabKit = W.LabKit || {}; W.LabKit.reveal = reveal;
if (typeof document === "undefined" || !W.LabKit.make) return;
W.LabKit.css("mk-steps-css", `.mk-steps{flex:1 1 300px;min-width:0;display:grid;gap:4px;font:400 19px/1.45 var(--math);align-content:start}
.mk-steps .st{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:baseline;gap:0 10px;padding:5px 8px;border-radius:4px;color:var(--muted)}
.mk-steps .st.cur{background:rgba(242,184,75,.07);color:var(--text);box-shadow:inset 2px 0 0 var(--amber)}
.mk-steps .st.todo{color:var(--faint)}
.mk-steps .tag{font:600 11px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.mk-steps .st.cur .tag{color:var(--amber)}
.mk-steps .eq{overflow-x:auto;overflow-y:hidden;min-width:0}
.mk-steps .why{grid-column:2;font:12.5px/1.4 var(--sans);color:var(--faint)}
@media (max-width:560px){.mk-steps{font-size:17px}.mk-steps .st{grid-template-columns:minmax(0,1fr)}.mk-steps .why{grid-column:1}}`);
W.LabKit.extend(kit => {
  kit.stepper = (count, onStep, opts = {}) => {
    let k = opts.start ?? 0, playing = false, stop = null;
    const btnP = kit.button("Play", () => playing ? pause() : play());
    const btnS = kit.button("Step", () => { pause(); step(); }, "btn ghost");
    const btnR = kit.button("Reset", () => { pause(); k = 0; onStep(k); }, "btn ghost");
    function step(){ if (k < count()) { k++; onStep(k); } else pause(); }
    function play(){ if (k >= count()) { k = 0; onStep(k); } playing = true; btnP.textContent = "Pause"; stop = kit.every(opts.ms || 900, () => { if (k >= count()) pause(); else step(); }); }
    function pause(){ playing = false; btnP.textContent = "Play"; if (stop) stop(); stop = null; }
    return { play, pause, step, buttons: [btnP, btnS, btnR], get k(){ return k; }, set k(v){ k = v; }, reset(){ pause(); k = 0; onStep(k); }, finish(){ pause(); k = count(); onStep(k); } };
  };
  kit.stepsPanel = (host, opt = {}) => {
    const el = document.createElement("div"); el.className = "mk-steps"; host.appendChild(el); let last = "";
    return { el, set(lines, cur){ const html = reveal(lines, cur).map((l, i) => l ? `<div class="st${i === cur ? " cur" : ""}"><span class="tag">${l.tag || "step " + (i + 1)}</span><span class="eq">${l.eq}</span>${l.why ? `<span class="why">${l.why}</span>` : ""}</div>` : `<div class="st todo"><span class="tag">${opt.todo ? lines[i] && lines[i].tag || "" : ""}</span><span class="eq">·&nbsp;·&nbsp;·</span></div>`).join(""); if (html !== last) { el.innerHTML = html; last = html; } } };
  };
});
})();

</script>
<script>/* web/kits/subjects/cs.js */
/* ============ Subject kit: Computer Science (Programming Fundamentals onward) ============
   Every program a lab shows is REAL Python: write it in web/cs-src/<topic-id>.py and run
   `python3 tools/pytrace.py <topic-id>`; that records each step CPython takes into web/traces/<topic-id>.js
   (window.CSTraces["<id>/<program>"]). Labs only play traces back, so a lab can never disagree with Python.
   Two layers:
   1. window.CSRules (CR): pure, DOM-free rules, tested in tests/cs.test.js (node tools/labtest.js cs):
      tokens(line) Python highlighting · show(val, heap) Python-style display text · frames/out/changed per step ·
      watch(trace, name) a variable's value at every step · bits (toBase, fromBase, twos, fromTwos, utf8) · shuffle(arr, seed).
   2. window.CSKit.attach(k): k.trace(cfg) the whole Trace / Memory / Array lab in one call, k.predict(cfg) predict-then-run,
      k.bits(cfg) bit board, k.csModes(list, build) mode switching, k.guard(list), k.csro(o) standard readout.
   House colour keys for every CS page (the legend must use them): c1 amber = line about to run, c2 cyan = variable that
   just changed, c3 pink = output, c4 violet = references / objects, c5 green = return values. */
(function(){
const W = window;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------------- 1. CSRules ---------------- */
const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const BI = new Set("print input int float str bool len range list dict set tuple sum min max abs round sorted enumerate zip type isinstance open map filter reversed any all chr ord".split(" "));
function tokens(line){
  const out = []; let i = 0;
  const push = (t, s) => { if (s) out.push({ t, s }); };
  while (i < line.length) {
    const r = line.slice(i);
    let m;
    if ((m = r.match(/^#.*/))) { push("com", m[0]); break; }
    if ((m = r.match(/^[rRbBfF]{0,2}("""|'''|"(?:[^"\\]|\\.)*"?|'(?:[^'\\]|\\.)*'?)/)) && (m[1] !== '"""' && m[1] !== "'''" || true)) { push("str", m[0]); i += m[0].length; continue; }
    if ((m = r.match(/^\d+(\.\d*)?([eE][+-]?\d+)?j?|^\.\d+/))) { push("num", m[0]); i += m[0].length; continue; }
    if ((m = r.match(/^[A-Za-z_]\w*/))) { const w = m[0]; push(KW.has(w) ? "kw" : BI.has(w) ? "bi" : "name", w); i += w.length; continue; }
    if ((m = r.match(/^\s+/))) { push("ws", m[0]); i += m[0].length; continue; }
    push("op", line[i]); i++;
  }
  // merge neighbouring ops/ws so the HTML stays small
  return out.reduce((a, x) => { const l = a[a.length - 1]; if (l && l.t === x.t && (x.t === "op" || x.t === "ws")) l.s += x.s; else a.push({ ...x }); return a; }, []);
}

// Display text for a traced value, Python style. Cycles show as [...].
function show(v, heap, seen = new Set()){
  if (!v) return "";
  const [kind, x] = v;
  if (kind === "v") return x;
  if (kind === "fn") return `function ${x}`;
  if (kind === "cls") return `class ${x}`;
  const o = heap[x]; if (!o) return "…";
  if (o.t === "val") return o.v;
  if (seen.has(x)) return o.t === "dict" ? "{...}" : "[...]";
  const s2 = new Set(seen); s2.add(x);
  const items = o.t === "dict" || o.t === "obj" ? null : o.v.map(e => show(e, heap, s2));
  if (o.t === "list") return `[${items.join(", ")}]`;
  if (o.t === "tuple") return items.length === 1 ? `(${items[0]},)` : `(${items.join(", ")})`;
  if (o.t === "set") return items.length ? `{${items.join(", ")}}` : "set()";
  if (o.t === "dict") return `{${o.v.map(([a, b]) => show(a, heap, s2) + ": " + show(b, heap, s2)).join(", ")}}`;
  return `${o.c}(${o.v.map(([a, b]) => a + "=" + show(b, heap, s2)).join(", ")})`;
}

const stepAt = (T, i) => T.steps[Math.max(0, Math.min(T.steps.length - 1, i))];
const outAt = (T, i) => T.out.slice(0, stepAt(T, i).o);
// How many times line `line` has started running in steps 0…i (loop passes: give the first line of the body).
const hits = (T, i, line) => T.steps.slice(0, Math.max(0, i) + 1).filter(s => s.ev === "line" && s.l === line).length;
// Names whose shown value differs from the step before: Set of "depth:name" (depth 0 = global frame).
function changed(T, i){
  const res = new Set(); if (i <= 0) return res;
  const a = stepAt(T, i - 1), b = stepAt(T, i);

    const pf = a.f[d] && a.f[d].fn === fr.fn ? a.f[d] : null;
    for (const [n, v] of Object.entries(fr.vars)) if (!pf || !(n in pf.vars) || show(pf.vars[n], a.h) !== show(v, b.h)) res.add(d + ":" + n);
  });
  return res;
}
// A global (or innermost-frame, inner: true) variable's shown value at every step; undefined before it exists.
const watch = (T, name, inner) => T.steps.map(s => { const fr = inner ? s.f[s.f.length - 1] : s.f[0]; return fr && name in fr.vars ? show(fr.vars[name], s.h) : undefined; });
// Python list of numbers at step i as a JS array (for the array view), or null.
function nums(T, i, name){
  const s = stepAt(T, i); const fr = s.f.find(f => name in f.vars) ; const v = fr && fr.vars[name];
  if (!v || v[0] !== "r" || !s.h[v[1]] || s.h[v[1]].t !== "list") return null;
  return s.h[v[1]].v.map(e => (e[0] === "v" ? Number(e[1]) : NaN));
}
const evText = (T, i) => { const s = stepAt(T, i), fn = s.f.length ? s.f[s.f.length - 1].fn : "";
  return s.ev === "end" ? "program finished" : s.ev === "call" ? `calling ${fn}()` : s.ev === "return" ? `${fn}() returns ${show(s.r, s.h)}` : s.ev === "exc" ? "an exception is raised" : `about to run line ${s.l}`; };

// Bits. toBase(13, 2, 8) = "00001101"; fromBase("ff", 16) = 255; twos(-3, 8) = "11111101"; fromTwos("11111101") = -3.
const toBase = (n, b, w = 0) => { if (!Number.isInteger(n) || n < 0) throw new Error("CSRules.toBase: needs a whole number ≥ 0 (use twos for negatives)"); return n.toString(b).toUpperCase().padStart(w, "0"); };
const fromBase = (s, b) => { const v = parseInt(String(s).replace(/_/g, ""), b); if (!Number.isFinite(v)) throw new Error(`CSRules.fromBase: "${s}" is not base ${b}`); return v; };
const twos = (n, w) => { const lo = -(2 ** (w - 1)), hi = 2 ** (w - 1) - 1; if (n < lo || n > hi) throw new Error(`CSRules.twos: ${n} does not fit in ${w} bits (${lo}…${hi})`); return toBase(n < 0 ? 2 ** w + n : n, 2, w); };
const fromTwos = bits => { const w = bits.length, u = fromBase(bits, 2); return bits[0] === "1" ? u - 2 ** w : u; };
const utf8 = ch => { const c = ch.codePointAt(0); if (c < 0x80) return [c]; if (c < 0x800) return [0xC0 | c >> 6, 0x80 | c & 63];
  if (c < 0x10000) return [0xE0 | c >> 12, 0x80 | c >> 6 & 63, 0x80 | c & 63]; return [0xF0 | c >> 18, 0x80 | c >> 12 & 63, 0x80 | c >> 6 & 63, 0x80 | c & 63]; };
const shuffle = (arr, seed) => { const a = arr.slice(); let s = seed == null ? null : seed;
  const rnd = () => { if (s == null) return Math.random(); s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const CR = W.CSRules = { tokens, show, stepAt, outAt, hits, changed, watch, nums, evText, toBase, fromBase, twos, fromTwos, utf8, shuffle, esc };

/* ---------------- 2. CSKit ---------------- */
const CSS = `

@media (max-width:700px){.stage .dom.cs{grid-template-columns:minmax(0,1fr);padding:54px 10px 10px}.cs-code,.cs-vars,.cs-out pre{font-size:12px}.cs-bits{gap:4px}.cs-bits button{width:32px;height:44px;font-size:17px}}`;
function css(){ if (typeof document === "undefined" || document.getElementById("cs-kit-css")) return; const s = document.createElement("style"); s.id = "cs-kit-css"; s.textContent = CSS; document.head.appendChild(s); }

const codeHTML = code => code.replace(/\n$/, "").split("\n").map(l => `<div class="ln"><span class="tx">${tokens(l).map(x => x.t === "ws" || x.t === "op" || x.t === "name" ? esc(x.s) : `<span class="${x.t}">${esc(x.s)}</span>`).join("") || " "}</span></div>`).join("");

function varsHTML(T, i){
  const s = stepAt(T, i), ch = changed(T, i), n = s.f.length;
  return s.f.slice().reverse().map((fr, ri) => { const d = n - 1 - ri;
    const rows = Object.entries(fr.vars).map(([k, v]) => `<tr class="${ch.has(d + ":" + k) ? "ch" : ""}"><td>${esc(k)}</td><td>${esc(show(v, s.h))}</td></tr>`).join("")
      + (s.ev === "return" && d === n - 1 ? `<tr class="ret"><td>return</td><td>${esc(show(s.r, s.h))}</td></tr>` : "");
    return `<div class="cs-fr${ri === 0 && n > 1 ? " top" : ""}"><div class="fn">${fr.fn === "global" ? "global frame" : esc(fr.fn) + "()"}</div><table>${rows || `<tr><td>—</td><td></td></tr>`}</table></div>`; }).join("");
}

// Memory diagram: frames (names) on the left, objects on the right, arrows (c4) from each reference.
function memorySVG(T, i){
  const s = stepAt(T, i), ch = changed(T, i), CW = 7.9, RH = 22, P = 8;
  const refs = [], seen = new Set();
  const visit = v => { if (v && v[0] === "r" && !seen.has(v[1]) && s.h[v[1]]) { seen.add(v[1]); refs.push(v[1]); const o = s.h[v[1]]; if (o.t === "val") return; (o.t === "dict" ? o.v.flat() : o.t === "obj" ? o.v.map(e => e[1]) : o.v).forEach(visit); } };
  s.f.forEach(fr => Object.values(fr.vars).forEach(visit));
  const cellTxt = v => (v[0] === "r" ? "" : show(v, s.h));
  let y = 10, fx = 10; const fw = Math.max(150, ...s.f.flatMap(fr => Object.entries(fr.vars).map(([k, v]) => (k.length + cellTxt(v).length) * CW + 40)));
  const parts = [], dots = [], boxes = {};
  s.f.forEach((fr, d) => {
    const names = Object.entries(fr.vars); const h = 22 + Math.max(1, names.length) * RH;
    parts.push(`<rect x="${fx}" y="${y}" width="${fw}" height="${h}" rx="4" fill="none" stroke="var(--line-2)"/><text x="${fx + P}" y="${y + 15}" font-family="var(--ui)" font-size="11" letter-spacing="1.5" fill="${d === s.f.length - 1 && s.f.length > 1 ? "var(--amber)" : "var(--muted)"}">${fr.fn === "global" ? "GLOBAL FRAME" : esc(fr.fn.toUpperCase()) + "()"}</text>`);
    names.forEach(([k, v], j) => { const ty = y + 22 + j * RH + 15, c = ch.has(d + ":" + k) ? "var(--cyan)" : "var(--text)";
      parts.push(`<text x="${fx + P}" y="${ty}" font-family="var(--mono)" font-size="13" fill="var(--muted)">${esc(k)}</text>`);
      if (v[0] === "r") dots.push({ x: fx + fw - 14, y: ty - 4, to: v[1] }); else parts.push(`<text x="${fx + fw - P}" y="${ty}" text-anchor="end" font-family="var(--mono)" font-size="13" fill="${c}">${esc(cellTxt(v))}</text>`); });
    y += h + 10;
  });
  const ox = fx + fw + 70; let oy = 10, maxW = 0;
  refs.forEach(r => { const o = s.h[r]; const label = o.t === "obj" ? o.c + " object" : o.t;
    if (o.t === "val") {
      const w = Math.max(56, o.v.length * CW + 20);
      parts.push(`<text x="${ox}" y="${oy + 11}" font-family="var(--ui)" font-size="11" letter-spacing="1.5" fill="var(--violet)">${esc(o.c.toUpperCase())}</text><rect x="${ox}" y="${oy + 16}" width="${w}" height="26" rx="4" fill="rgba(180,155,255,.08)" stroke="var(--violet)"/><text x="${ox + w / 2}" y="${oy + 34}" text-anchor="middle" font-family="var(--mono)" font-size="13" fill="var(--text)">${esc(o.v)}</text>`);
      boxes[r] = { x: ox, y: oy + 29 }; maxW = Math.max(maxW, w); oy += 52; return;
    }
    if (o.t === "list" || o.t === "tuple" || o.t === "set") {
      const cells = o.v.map(e => Math.max(28, cellTxt(e).length * CW + 14)); const w = Math.max(60, cells.reduce((a, b) => a + b, 0)); let cx = ox;
      parts.push(`<text x="${ox}" y="${oy + 11}" font-family="var(--ui)" font-size="11" letter-spacing="1.5" fill="var(--violet)">${label.toUpperCase()}</text>`);
      o.v.forEach((e, j) => { parts.push(`<rect x="${cx}" y="${oy + 16}" width="${cells[j]}" height="26" fill="rgba(180,155,255,.08)" stroke="var(--violet)"/>${o.t !== "set" ? `<text x="${cx + cells[j] / 2}" y="${oy + 54}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--faint)">${j}</text>` : ""}`);
        if (e[0] === "r") dots.push({ x: cx + cells[j] / 2, y: oy + 29, to: e[1] }); else parts.push(`<text x="${cx + cells[j] / 2}" y="${oy + 34}" text-anchor="middle" font-family="var(--mono)" font-size="13" fill="var(--text)">${esc(cellTxt(e))}</text>`);
        cx += cells[j]; });
      if (!o.v.length) parts.push(`<rect x="${ox}" y="${oy + 16}" width="40" height="26" fill="none" stroke="var(--violet)" stroke-dasharray="3 3"/>`);
      boxes[r] = { x: ox, y: oy + 29 }; maxW = Math.max(maxW, w); oy += 70;
    } else {
      const rows = o.v.map(([a, b]) => [o.t === "dict" ? show(a, s.h) : a, b]);
      const w = Math.max(120, ...rows.map(([a, b]) => (String(a).length + cellTxt(b).length) * CW + 44)); const h = 22 + Math.max(1, rows.length) * RH;
      parts.push(`<rect x="${ox}" y="${oy}" width="${w}" height="${h}" rx="4" fill="rgba(180,155,255,.08)" stroke="var(--violet)"/><text x="${ox + P}" y="${oy + 15}" font-family="var(--ui)" font-size="11" letter-spacing="1.5" fill="var(--violet)">${esc(label.toUpperCase())}</text>`);
      rows.forEach(([a, b], j) => { const ty = oy + 22 + j * RH + 15; parts.push(`<text x="${ox + P}" y="${ty}" font-family="var(--mono)" font-size="13" fill="var(--muted)">${esc(a)}</text>`);
        if (b[0] === "r") dots.push({ x: ox + w - 14, y: ty - 4, to: b[1] }); else parts.push(`<text x="${ox + w - P}" y="${ty}" text-anchor="end" font-family="var(--mono)" font-size="13" fill="var(--text)">${esc(cellTxt(b))}</text>`); });
      boxes[r] = { x: ox, y: oy + 11 }; maxW = Math.max(maxW, w); oy += h + 14;
    }
  });
  dots.forEach(d => { const b = boxes[d.to]; if (!b) return; const mx = Math.max(d.x + 24, b.x - 30);
    parts.push(`<circle cx="${d.x}" cy="${d.y}" r="3.5" fill="var(--violet)"/><path d="M${d.x} ${d.y} C${mx} ${d.y}, ${b.x - 30} ${b.y}, ${b.x - 6} ${b.y}" fill="none" stroke="var(--violet)" stroke-width="1.6"/><path d="M${b.x - 6} ${b.y - 4} L${b.x} ${b.y} L${b.x - 6} ${b.y + 4}" fill="var(--violet)"/>`); });
  const vw = Math.max(320, ox + maxW + 10), vh = Math.max(y, oy) + 4;
  return `<svg viewBox="0 0 ${vw} ${vh}" style="max-width:${vw}px" role="img" aria-label="memory diagram">${parts.join("")}</svg>`;
}

// Array view: bars for a list of numbers; marks {i: "c2"} colour the index held in variable i.
function barsSVG(T, i, name, marks = {}){
  const a = nums(T, i, name); if (!a) return `<p class="narr" style="padding:0 10px">${esc(name)} does not exist yet.</p>`;
  const s = stepAt(T, i), at = {}; for (const [v, c] of Object.entries(marks)) { const fr = s.f.slice().reverse().find(f => v in f.vars); const x = fr && fr.vars[v]; if (x && x[0] === "v" && /^-?\d+$/.test(x[1])) at[+x[1]] = (at[+x[1]] ? at[+x[1]] + " " : "") + c + ":" + v; }
  const mx = Math.max(1, ...a.map(Math.abs)), bw = 34, gap = 8, H = 120, vw = Math.max(240, a.length * (bw + gap) + 20);
  const col = { c1: "var(--amber)", c2: "var(--cyan)", c3: "var(--pink)", c4: "var(--violet)", c5: "var(--green)" };
  const bars = a.map((v, j) => { const h = Math.max(2, Math.abs(v) / mx * H), x = 10 + j * (bw + gap), m = at[j] ? at[j].split(" ").map(t => t.split(":")) : [];
    const fill = m.length ? col[m[0][0]] : "rgba(180,155,255,.35)";
    return `<rect x="${x}" y="${20 + H - h}" width="${bw}" height="${h}" rx="2" fill="${fill}"/><text x="${x + bw / 2}" y="${14 + H - h}" text-anchor="middle" font-family="var(--mono)" font-size="12" fill="var(--text)">${v}</text><text x="${x + bw / 2}" y="${36 + H}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--faint)">${j}</text>`
      + m.map(([c, nm], q) => `<text x="${x + bw / 2}" y="${52 + H + q * 14}" text-anchor="middle" font-family="var(--mono)" font-size="12" fill="${col[c]}">${esc(nm)}</text>`).join(""); }).join("");
  return `<svg viewBox="0 0 ${vw} ${H + 84}" style="max-width:${vw}px" role="img" aria-label="${esc(name)} as bars">${bars}</svg>`;
}

function attach(k){
  css();
  if (!k.guard) k.guard = list => { k.stage.dataset.answers = JSON.stringify(list || []); };
  k.CR = CR;
  k.csro = o => k.setRO(`<div>${o.title ? `<h2>${o.title}</h2>` : ""}${o.big ? `<div class="ro-big" style="margin-top:8px">${o.big}</div>` : ""}</div>`
    + (o.rows && o.rows.length ? `<div class="ro-rows">${o.rows.filter(Boolean).map(r => `<div class="row"><span>${r.label}</span> <span class="v ${r.c || ""}">${r.value}</span>${r.note ? `<span class="lbl">${r.note}</span>` : ""}</div>`).join("")}</div>` : "")
    + (o.landmark ? `<div class="landmark${o.landmark.hit ? " hit" : ""}"><div class="big">${o.landmark.big || ""}</div>${o.landmark.note ? `<div class="note">${o.landmark.note}</div>` : ""}</div>` : "")
    + (o.narr ? `<p class="narr">${o.narr}</p>` : ""));
  /* k.csModes([["trace","Trace"], …], key => { …build that mode…; return obj with pause() if it plays }, active?)
     Switching modes stops playback, clears the controls and the stage (except the mode buttons) and the guard. */
  k.csModes = (list, build, active) => { let cur = null; const first = active || list[0][0];
    const run = key => { if (cur && cur.pause) cur.pause(); k.ctl.innerHTML = ""; [...k.stage.children].forEach(el => { if (!el.classList.contains("modes")) el.remove(); }); delete k.stage.dataset.answers; cur = build(key) || null; };
    const bar = k.modes(list, first, run);
    // keep the panes below the mode buttons even when they wrap onto two rows (phones, long labels)
    const pad = () => { const d = k.stage.querySelector(".dom.cs"); if (d && bar.offsetHeight) d.style.paddingTop = Math.max(54, bar.offsetTop + bar.offsetHeight + 10) + "px"; };
    const run0 = run; const runP = key => { run0(key); pad(); };
    bar.querySelectorAll("button").forEach(b => { const f = b.onclick; b.onclick = e => { f.call(b, e); pad(); }; });
    if (typeof ResizeObserver !== "undefined") new ResizeObserver(pad).observe(bar);
    runP(first); };
  const get = key => { const T = W.CSTraces && W.CSTraces[key]; if (!T) throw new Error(`CSKit: no trace "${key}" (run python3 tools/pytrace.py ${key.split("/")[0]})`); return T; };

  /* k.trace(cfg): code + state + output with Back / Step / Play / Reset.
     cfg: { host?: element (default k.dom()), programs: [["id/name", "Label"], …], view: "vars" | "memory" | "bars" | "vars+bars",
            bars: { name: "xs", marks: { i: "c2", j: "c3" } }, title, narr(step, i, T, key) → html | { "id/name": { line: html } },
            rows(step, i, T) → extra readout rows, onStep(i, T) } → { go(i), get i(), get T, select(key) } */
  k.trace = cfg => {
    const dom = cfg.host || k.dom(); dom.className = "dom cs"; let key = cfg.programs[0][0], T = get(key), i = 0, stop = null;
    const view = cfg.view || "vars";
    if (cfg.programs.length > 1) k.select("Program", cfg.programs, key, v => { key = v; T = get(v); i = 0; build(); draw(); });
    const bBack = k.button("Back", () => { pause(); go(i - 1); }, "btn ghost"), bStep = k.button("Step", () => { pause(); go(i + 1); });
    const bPlay = k.button("Play", () => (stop ? pause() : play()), "btn ghost"); k.button("Reset", () => { pause(); go(0); }, "btn ghost");
    function play(){ if (i >= T.steps.length - 1) go(0); bPlay.textContent = "Pause"; stop = k.every(k.reduce ? 1400 : 900, () => (i >= T.steps.length - 1 ? pause() : go(i + 1))); }
    function pause(){ if (stop) stop(); stop = null; bPlay.textContent = "Play"; }
    let codeEl, stateEl, outEl, prevLine = 0;
    function build(){
      dom.innerHTML = `<div class="pane"><h3>Program</h3><div class="cs-code">${codeHTML(T.code)}</div></div>
        <div class="pane"><h3>${view === "memory" ? "Frames and objects" : view === "bars" ? "List" : "Variables"}</h3><div class="cs-state"></div></div>
        <div class="pane cs-out"><h3>Output</h3><pre></pre></div>`;
      codeEl = dom.querySelector(".cs-code"); stateEl = dom.querySelector(".cs-state"); outEl = dom.querySelector(".cs-out pre");
    }
    function go(n){ const last = T.steps.length - 1; n = Math.max(0, Math.min(last, n)); prevLine = n > 0 ? stepAt(T, n - 1).l : 0; i = n; draw(); }
    function draw(){
      const s = stepAt(T, i), last = T.steps.length - 1;
      codeEl.querySelectorAll(".ln").forEach((el, j) => { el.classList.toggle("cur", j + 1 === s.l); el.classList.toggle("prev", j + 1 === prevLine && j + 1 !== s.l); });
      const cur = codeEl.querySelector(".ln.cur"); if (cur && cur.scrollIntoView && codeEl.parentNode.scrollHeight > codeEl.parentNode.clientHeight) cur.scrollIntoView({ block: "nearest" });
      stateEl.innerHTML = view === "memory" ? memorySVG(T, i) : view === "bars" ? barsSVG(T, i, cfg.bars.name, cfg.bars.marks)
        : view === "vars+bars" ? `<div class="cs-vars">${varsHTML(T, i)}</div>${barsSVG(T, i, cfg.bars.name, cfg.bars.marks)}` : `<div class="cs-vars">${varsHTML(T, i)}</div>`;
      if (view === "vars") stateEl.firstChild.className = "cs-vars";
      outEl.innerHTML = esc(outAt(T, i)) + (s.ev === "end" && T.error ? `<span class="err">${esc(T.error)}</span>` : "");
      bBack.disabled = i === 0; bStep.disabled = i === last;
      const ch = [...changed(T, i)].map(x => x.split(":")[1]);
      const nar = typeof cfg.narr === "function" ? cfg.narr(s, i, T, key) : cfg.narr && cfg.narr[key] ? cfg.narr[key][s.ev === "end" ? "end" : s.l] : "";
      k.csro({ title: cfg.title || "Trace", big: `<span class="m">step ${i} of ${last}</span>`,
        rows: [{ label: "Now", value: esc(evText(T, i)), c: s.ev === "return" ? "c5" : "c1" }, ch.length ? { label: "Changed", value: esc(ch.join(", ")), c: "c2" } : null,
          { label: "Frames", value: String(s.f.length), note: s.f.length > 1 ? "call stack depth" : "" }, ...(cfg.rows ? cfg.rows(s, i, T) || [] : [])],
        narr: nar || (i === 0 ? "Press Step to run one line at a time. The amber line has not run yet." : "") });
      if (cfg.onStep) cfg.onStep(i, T);
    }
    build(); draw();
    return { go, get i(){ return i; }, get T(){ return T; }, get key(){ return key; }, pause };
  };

  /* k.predict(cfg): show a program, the learner picks its output, then sees the real output.
     cfg: { host?, items: [{ key: "id/name", choices: ["…", …], why: html }] }  (the real output is added to the choices
     automatically and shuffled; choices must be the plausible mistakes). No k.guard: the right answer is one of the buttons by design. */
  k.predict = cfg => {
    const dom = cfg.host || k.dom(); dom.className = "dom cs one"; let n = 0, picked = null; const score = { right: 0, tries: 0 };
    const real = it => get(it.key).out.replace(/\n$/, "") + (get(it.key).error ? (get(it.key).out ? "\n" : "") + get(it.key).error : "");
    const order = cfg.items.map(it => shuffle([...new Set([real(it), ...it.choices])]));
    k.button("Next program", () => { n = (n + 1) % cfg.items.length; picked = null; draw(); });
    function draw(){
      const it = cfg.items[n], T = get(it.key), ans = real(it);
      dom.innerHTML = `<div class="pane"><h3>Program ${n + 1} of ${cfg.items.length}${T.input.length ? ` · input: ${esc(T.input.join(", "))}` : ""}</h3><div class="cs-code">${codeHTML(T.code)}</div></div>
        <div class="pane"><h3>What does it print?</h3><div class="cs-pick">${order[n].map((c, j) => `<button type="button" data-j="${j}" class="${picked == null ? "" : c === ans ? "right" : j === picked ? "wrong" : ""}">${esc(c || "(nothing)")}</button>`).join("")}</div></div>`;
      dom.querySelectorAll(".cs-pick button").forEach(b => b.onclick = () => { if (picked != null) return; picked = +b.dataset.j; score.tries++; if (order[n][picked] === ans) score.right++; draw(); });
      const done = picked != null, ok = done && order[n][picked] === ans;
      k.csro({ title: "Predict the output", big: `<span class="m">${score.right} / ${score.tries}</span>`,
        rows: [{ label: "Program", value: `${n + 1} of ${cfg.items.length}` }, done ? { label: "Python printed", value: `<span style="white-space:pre-wrap">${esc(ans || "(nothing)")}</span>`, c: "c3" } : null],
        landmark: done ? { big: ok ? "Correct" : "Not quite", hit: ok } : null, narr: done ? it.why : "Trace it in your head line by line, then pick." });
    }
    draw();
  };

<script>/* web/labs/template.js */
/* Placeholder model for the Lesson Template page (format reference only, no Law content).

  k.button("+1", () => { if (n < 10) { n++; s.set(n); } }, "btn ghost");

  [".nw-title", ".nw-seq", ".nw-tempo input", ".nw-chord"].forEach(s => $(s).addEventListener("input", e => { e.stopPropagation(); if (s !== ".nw-chord") save(); }));
  [".nw-clef", ".nw-time"].forEach(s => $(s).addEventListener("change", () => { if (s === ".nw-clef") { oct = $(s).value === "bass" ? 3 : 4; piano(); } save(); }));
  delButton(el);

}

/* ---------- app state + routing ---------- */

  if (push) { try { history.pushState({ ...next, view: S.view, subject: S.subject, field: S.field, topic: S.topic, gword: S.gword, ...(S.view === "glossary" ? { g: { sub: G.sub, word: G.word, field: G.field } } : {}) }, "", "#" + tok); } catch(e){} }

}

/* ---------- windows over the app (My notes, Achievements) ----------
   Like Settings and the New note dialog: the app behind fogs and eases back (body.mw-open, settings.css), ✕, Esc

   modalWin(id, { title, sub, cls }) → { ov, win, body, head, cleanup: [], close() }; one window at a time. */
const MW = {};

const WIN_VIEWS = {

};
function openNotesWin(){

    sub: `All notes are saved on this computer${who ? ` for <b>${esc(who)}</b>` : ""}.` });

function viewIn(el){

  if (t.startsWith("field-")) { const f = t.slice(6); if (DB.fields[f]) return { view: "math", subject: subjOf(f), field: f, topic: null }; }

/* ---------- favourites + the top-bar progress meter ----------

      .map(([k, nm, sub]) => { const pool = k === "here" ? null : favPool(k), d = pool ? pool.filter(n => mastered.has(n.id)).length : 0;

{ const ts = $("#topstat"); if (ts) ts.onclick = favMenu; }

/* ---------- main menu ----------

function menuCarousel(box){
  const stage = $(".mx-stage", box), dots = $(".mx-dots", box), count = $(".mx-count", box), bar = $(".mx-bar i", box);
  const ART = window.InquireArt || {}, N = MENU_SLIDES.length;
  const reduce = () => document.documentElement.hasAttribute("data-reduce-motion") || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  MENU_SLIDES.forEach((x, i) => {
    const sub = DB.subjects.find(d => d.id === x.sub) || { name: SM[x.sub].name, glyph: "·" };
    const grp = (DB.subjectGroups || []).find(g => g.id === sub.group);
    const imgs = x.art.filter(a => ART[a]).map((a, k) => `<img class="mx-i mx-i${k}" src="${ART[a]}" alt="" loading="lazy" decoding="async">`).join("");
    const sl = h("button", { type: "button", class: "mx-slide", "data-accent": grp && grp.accent ? grp.accent : "", "aria-label": `Open ${sub.name}`, tabindex: i ? "-1" : "0",
      onclick: () => go({ view: "math", subject: x.sub, field: "map", topic: null }) },
      `<span class="mx-text"><span class="mx-kicker">${esc(x.kicker)}</span>
        <span class="mx-title"><span class="mx-glyph">${sub.glyph}</span>${esc(sub.name)}</span>
        <span class="mx-line">${esc(x.line)}</span>
        <span class="mx-tags">${x.tags.map(t => `<i>${esc(t)}</i>`).join("")}</span>
        <span class="mx-go">Open ${esc(sub.name)} ▸</span></span>
       <span class="mx-art n${Math.min(3, x.art.length)}">${imgs}<span class="mx-scan" aria-hidden="true"></span></span>`);
    stage.appendChild(sl);
    const d = h("button", { type: "button", role: "tab", class: "mx-dot", "aria-label": sub.name, onclick: () => { show(i); restart(); } }, `<span>${esc(sub.name)}</span>`);
    dots.appendChild(d);
  });
  let cur = -1, t0 = 0, raf = 0, paused = false; const DUR = 7000;
  function show(i){
    cur = (i + N) % N;
    [...stage.children].forEach((el, k) => { el.classList.toggle("on", k === cur); el.tabIndex = k === cur ? 0 : -1; el.setAttribute("aria-hidden", String(k !== cur)); });
    [...dots.children].forEach((el, k) => el.setAttribute("aria-selected", String(k === cur)));
    count.textContent = String(cur + 1).padStart(2, "0") + " / " + String(N).padStart(2, "0");
  }
  function restart(){ t0 = performance.now(); bar.style.width = "0%"; }
  function tick(now){
    raf = requestAnimationFrame(tick);
    if (paused || reduce() || document.hidden) { t0 = now - (parseFloat(bar.style.width) || 0) / 100 * DUR; return; }
    const p = (now - t0) / DUR;
    if (p >= 1) { show(cur + 1); restart(); return; }
    bar.style.width = (p * 100).toFixed(2) + "%";
  }
  box.querySelectorAll(".mx-arrow").forEach(b => b.onclick = () => { show(cur + +b.dataset.d); restart(); });
  box.addEventListener("pointerenter", () => paused = true); box.addEventListener("pointerleave", () => paused = false);
  box.addEventListener("focusin", () => paused = true); box.addEventListener("focusout", () => paused = false);
  box.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); show(cur + (e.key === "ArrowRight" ? 1 : -1)); restart(); const on = $(".mx-slide.on", box); if (on) on.focus(); } });
  show(0); restart(); raf = requestAnimationFrame(tick);
  cleanup.push(() => cancelAnimationFrame(raf));
}

/* ---------- My notes layout: fold the folders / notes columns (◀ ▶ tabs, like the navigator's) and drag the list's right edge to resize it ---------- */
function notesLayout(nb){
  const fold = store.get("nbfold", { f: false, l: false }), W0 = () => store.get("nbw", 0);
  const paint = () => {
    nb.classList.toggle("ffold", !!fold.f); nb.classList.toggle("lfold", !!fold.l);
    nb.querySelectorAll(".nb-fold").forEach(b => {
      const shut = !!fold[b.dataset.p], what = b.dataset.p === "f" ? "folders" : "notes list";
      b.innerHTML = `<span aria-hidden="true">${shut ? "▶" : "◀"}</span>`; b.title = (shut ? "Show the " : "Hide the ") + what; b.setAttribute("aria-label", b.title); b.setAttribute("aria-expanded", String(!shut));
    });
    const w = W0(); if (w) nb.style.setProperty("--nb-lw-user", w + "px"); else nb.style.removeProperty("--nb-lw-user");
    if (matchMedia("(min-width:861px)").matches) { $(".nb-folders", nb).inert = !!fold.f; $(".nb-list", nb).inert = !!fold.l; }
  };
  nb.querySelectorAll(".nb-fold").forEach(b => b.onclick = () => { fold[b.dataset.p] = !fold[b.dataset.p]; store.set("nbfold", fold); paint(); });
  const rz = $(".nb-rz", nb), list = $(".nb-list", nb);
  const lim = w => { const total = nb.offsetWidth, fw = $(".nb-folders", nb).offsetWidth; return Math.round(Math.max(180, Math.min(w, 620, total - fw - 340))); };
  const setW = w => { store.set("nbw", w ? lim(w) : 0); paint(); };
  rz.addEventListener("pointerdown", e => {
    if (e.button !== 0) return; e.preventDefault();
    const z = nb.getBoundingClientRect().width / nb.offsetWidth || 1, x0 = e.clientX, w0 = list.offsetWidth;
    rz.setPointerCapture(e.pointerId); nb.classList.add("rz");
    const move = ev => nb.style.setProperty("--nb-lw-user", lim(w0 + (ev.clientX - x0) / z) + "px");
    const up = () => { rz.removeEventListener("pointermove", move); rz.removeEventListener("pointerup", up); rz.removeEventListener("pointercancel", up); nb.classList.remove("rz"); store.set("nbw", list.offsetWidth); };
    rz.addEventListener("pointermove", move); rz.addEventListener("pointerup", up); rz.addEventListener("pointercancel", up);
  });
  rz.addEventListener("dblclick", () => setW(0));
  rz.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); setW(list.offsetWidth + (e.key === "ArrowRight" ? 20 : -20)); }
    else if (e.key === "Home") { e.preventDefault(); setW(0); }
  });
  paint();
}

/* ---------- small dialog in the Settings style (the app behind fogs): askText({title, label, placeholder, value, ok, max}) → text | null ---------- */
function askText(o = {}){
  return new Promise(done => {
    document.querySelectorAll(".ask-ov").forEach(x => x.remove());
    const last = document.activeElement;
    const ov = h("div", { class: "ask-ov" }, `<form class="ask-win win" role="dialog" aria-modal="true" aria-labelledby="ask-t">
      <header class="set-h"><span class="dot"></span><h2 id="ask-t">${esc(o.title || "Name")}</h2><button type="button" class="set-x" data-x aria-label="Cancel">✕</button></header>
      <div class="ask-body"><label class="ask-l" for="ask-in">${esc(o.label || "Name")}</label>
        <input id="ask-in" class="ask-in" maxlength="${o.max || 140}" placeholder="${esc(o.placeholder || "")}" value="${esc(o.value || "")}" autocomplete="off">
        <div class="ask-btns"><button type="button" class="btn-s" data-x>Cancel</button><button type="submit" class="btn good">${esc(o.ok || "OK")}</button></div></div></form>`);
    document.body.appendChild(ov);
    requestAnimationFrame(() => document.body.classList.add("ask-open"));
    const inp = $(".ask-in", ov);
    const fin = v => { document.body.classList.remove("ask-open"); document.removeEventListener("keydown", key, true); ov.classList.add("out"); setTimeout(() => ov.remove(), 250); if (last && document.contains(last)) try { last.focus({ preventScroll: true }); } catch (e) {} done(v); };
    const key = e => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); fin(null); } };
    document.addEventListener("keydown", key, true);
    ov.querySelectorAll("[data-x]").forEach(b => b.onclick = () => fin(null));
    ov.addEventListener("pointerdown", e => { if (e.target === ov) fin(null); });
    $("form", ov).onsubmit = e => { e.preventDefault(); fin(inp.value.trim()); };
    setTimeout(() => { inp.focus(); inp.select(); }, 30);
  });
}

      const id = b.dataset.f, f = fs.find(x => x.id === id), sib = fs.filter(x => x.parent === f.parent).map(x => x.id), i = sib.indexOf(id);
      if (e.key === "ArrowUp" && i > 0) NS.moveFolder(id, f.parent, sib[i - 1]); else if (e.key === "ArrowDown" && i < sib.length - 1) NS.moveFolder(id, f.parent, sib[i + 2] || null); else return;

  }
  // where a drag over the folder column would land: { el, how: "into" | "before" | "after" | "top", id }

    const d = e.target.closest(".nb-fd"); if (!d || !d.dataset.f) return null;
    const f = d.dataset.f;
    if (DRAG.type === "note") return f === "all" ? null : { el: d, how: "into", id: f };
    if (f === "fav") return null;
    if (f === "all" || f === "none") return { el: d, how: "top" };

  fold.addEventListener("dragover", e => {

        const ids = all.map(n => n.id), i = ids.indexOf(b.dataset.id), j = i + (e.key === "ArrowUp" ? -1 : 1); if (j < 0 || j >= ids.length) return;

  }
  // the notes on screen in their new order → fold them into the full My order (notes not on screen keep their places)
  let curIds = [];

    const full = NS.list().sort(NS.byOrder).map(n => n.id), shown = new Set(ids), slots = [];

  let saveT = null, rich = null;
  const flushEd = () => { if (rich) rich.flush(); if (saveT) { clearTimeout(saveT); saveT = null; const ti = $(".nb-title", ed); if (ti && ed.dataset.id && NS.get(ed.dataset.id)) NS.update(ed.dataset.id, { title: ti.value.trim() || "Untitled note" }); } };

        <label class="nb-fsel"><span>Folder</span><select data-a="folder" aria-label="Folder"><option value="">Unfiled</option>${fs.map(f => `<option value="${f.id}"${n.folder === f.id ? " selected" : ""}>${"\u00a0\u00a0\u00a0".repeat(f.depth)}${esc(f.name)}</option>`).join("")}</select></label>
        <span class="nb-saved" aria-live="polite" title="Last saved ${esc(new Date(n.updated).toLocaleString())}">Saved</span>

        <button type="button" class="btn-s" data-a="md">Save as .md</button><button type="button" class="btn-s set-warn" data-a="del">Delete</button></div>
      <form class="nb-urlrow" hidden><input type="url" placeholder="https://… address of a photo" aria-label="Photo address"><button type="submit" class="btn-s">Insert</button><button type="button" class="btn-s" data-a="purlx">Cancel</button><span class="nb-urlmsg"></span></form>

    const chips = () => {

/* ---------- dictionary ---------- */
function renderDict(){
  const s = h("div", { class: "screen" });
  s.innerHTML = `<div class="screen-in">
    <div class="hello"><div class="back-row"><button type="button" class="btn-s" id="dback">◀ Menu</button></div><p class="eyebrow">Dictionary</p><h1>Subjects</h1>
    <p>Pick a subject to open its navigator. Fields appear on the left and the selected field's skill tree on the right.</p></div>
    <div class="subj-groups" id="subj"></div></div>`;
  viewEl.appendChild(s);
  $("#dback", s).onclick = () => go({ view: "menu", topic: null });
  (DB.subjectGroups || [{ id: "all", name: "Subjects", line: "" }]).forEach(g => {
    const subs = DB.subjects.filter(x => (x.group || "all") === g.id).map((x, i) => [x, i]) // starred subjects first in their group, then the usual order
      .sort((a, b) => (isFav("s:" + b[0].id) - isFav("s:" + a[0].id)) || a[1] - b[1]).map(x => x[0]);
    if (!subs.length) return;
    const sec = h("section", { class: "subj-group", "data-accent": g.accent || "", "aria-label": g.name });
    sec.innerHTML = `<div class="subj-gh"><h2>${esc(g.name)}</h2><span class="ln">${esc(g.line || "")}</span><span class="n">${subs.length}</span></div><div class="slots"></div>`;
    subs.forEach(sub => {
      const open = sub.status === "open";
      const el = h(open ? "button" : "div", open ? { type: "button", class: "slot", onclick: () => go({ view: "math", subject: sub.id, field: "map", topic: null }) } : { class: "slot locked", "aria-disabled": "true" },
        `<span class="glyph">${sub.glyph}</span><span><h3>${esc(sub.name)}</h3><p>${esc(sub.note)}</p></span><span class="tag">${open ? "Open" : "Locked"}</span>`);
      if (open && SM[sub.id]) { const wrap = h("div", { class: "slot-wrap" }); wrap.append(el, starBtn("s:" + sub.id)); $(".slots", sec).appendChild(wrap); }
      else $(".slots", sec).appendChild(el);

  $("#subj", s).addEventListener("click", e => { if (!e.target.closest(".fav")) return; setTimeout(() => { if (S.view !== "dict") return; const y = viewEl.scrollTop; render(); viewEl.scrollTop = y; }, 0); }, true); // capture: the star stops the click
